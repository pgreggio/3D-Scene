<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biplane Crop Duster — Interactive 3D</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87b5e0; font-family: 'Segoe UI', Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
        position: absolute; top: 16px; left: 16px; z-index: 10;
        background: rgba(12, 20, 30, 0.72); color: #f3f6fa;
        padding: 14px 18px; border-radius: 12px;
        backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15);
        max-width: 270px; box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    }
    #hud h1 { font-size: 15px; letter-spacing: 0.5px; margin-bottom: 4px; color: #6fa8ff; }
    #hud p { font-size: 11px; opacity: 0.8; line-height: 1.5; margin-bottom: 10px; }
    #sprayBtn {
        display: block; width: 100%; padding: 10px 12px; font-size: 13px; font-weight: 700;
        border: none; border-radius: 8px; cursor: pointer; letter-spacing: 0.5px;
        background: #3a4350; color: #cfd8e3; transition: background 0.25s, transform 0.1s;
    }
    #sprayBtn:hover { transform: translateY(-1px); }
    #sprayBtn.on { background: #2f9e4f; color: #fff; }
    #sprayBtn.off { background: #8c3b2e; color: #fff; }
    #hint {
        position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
        color: rgba(255,255,255,0.85); font-size: 11px; letter-spacing: 0.6px;
        background: rgba(12,20,30,0.5); padding: 6px 14px; border-radius: 20px; z-index: 10;
        white-space: nowrap;
    }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
    <h1>AG-1 "BLUEJACKET" CROP DUSTER</h1>
    <p>Running biplane spray simulation. Use the toggle below to operate the spray system.</p>
    <button id="sprayBtn" class="off">SPRAY SYSTEM: OFF</button>
</div>
<div id="hint">Drag to orbit &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Right-drag to pan</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
    var container = document.getElementById('app');
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b5e0);
    scene.fog = new THREE.Fog(0x87b5e0, 55, 180);
    var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(7.5, 4.5, 9.5);
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.6, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3;
    controls.maxDistance = 60;
    controls.maxPolarAngle = Math.PI * 0.495;
    var sun = new THREE.DirectionalLight(0xfff3e0, 1.25);
    sun.position.set(14, 18, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
    sun.shadow.camera.far = 60;
    sun.shadow.bias = -0.0005;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xbdd7f5, 0x3d5a2e, 0.55));
    var fill = new THREE.DirectionalLight(0xcfe0ff, 0.25);
    fill.position.set(-10, 6, -8);
    scene.add(fill);
    function makeFieldTexture() {
        var c = document.createElement('canvas'); c.width = c.height = 512;
        var g = c.getContext('2d');
        for (var i = 0; i < 16; i++) {
            g.fillStyle = i % 2 === 0 ? '#4d7a33' : '#588a3a';
            g.fillRect(0, i * 32, 512, 32);
        }
        g.globalAlpha = 0.12;
        for (var j = 0; j < 2600; j++) {
            g.fillStyle = Math.random() > 0.5 ? '#2f5423' : '#7aa35a';
            g.fillRect(Math.random() * 512, Math.random() * 512, 2, 5);
        }
        var t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(18, 18);
        return t;
    }
    var ground = new THREE.Mesh(
        new THREE.PlaneGeometry(400, 400),
        new THREE.MeshStandardMaterial({ map: makeFieldTexture(), roughness: 1, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    var rowMat = new THREE.MeshStandardMaterial({ color: 0x3c6429, roughness: 1 });
    for (var ri = -10; ri <= 10; ri++) {
        if (Math.abs(ri) < 3) continue;
        var row = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.35, 120), rowMat);
        row.position.set(ri * 4.2, 0.17, 0);
        row.receiveShadow = true; row.castShadow = true;
        scene.add(row);
    }
    var yellowPaint = new THREE.MeshStandardMaterial({ color: 0x2f6fc4, roughness: 0.55, metalness: 0.15 });
    var yellowDull  = new THREE.MeshStandardMaterial({ color: 0x2456a8, roughness: 0.8, metalness: 0.05 });
    var bareMetal   = new THREE.MeshStandardMaterial({ color: 0x6f7076, roughness: 0.45, metalness: 0.8 });
    var darkMetal   = new THREE.MeshStandardMaterial({ color: 0x2c2e33, roughness: 0.6, metalness: 0.6 });
    var tyreMat     = new THREE.MeshStandardMaterial({ color: 0x1b1b1d, roughness: 0.95, metalness: 0 });
    var hubMat      = new THREE.MeshStandardMaterial({ color: 0xd9d9d9, roughness: 0.4, metalness: 0.5 });
    var oilMat      = new THREE.MeshStandardMaterial({ color: 0x140e06, roughness: 1, metalness: 0, transparent: true, opacity: 0.88 });
    var wireMat     = new THREE.LineBasicMaterial({ color: 0x1d1f24 });
    var glassMat    = new THREE.MeshStandardMaterial({ color: 0x9fc4d8, roughness: 0.15, metalness: 0.4, transparent: true, opacity: 0.55 });
    var boomMat     = new THREE.MeshStandardMaterial({ color: 0x8a8d92, roughness: 0.5, metalness: 0.7 });
    var plane = new THREE.Group();
    scene.add(plane);
    var PITCH = 0.085;
    plane.rotation.z = PITCH;
    function shadowify(m) { m.castShadow = true; m.receiveShadow = true; return m; }
    var fuselage = new THREE.Group();
    plane.add(fuselage);
    var body = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.30, 4.4, 20), yellowPaint));
    body.rotation.z = Math.PI / 2;
    body.position.set(-0.4, 1.55, 0);
    fuselage.add(body);
    var belly = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.22, 4.0, 16, 1, false, 0, Math.PI), yellowDull));
    belly.rotation.z = Math.PI / 2; belly.rotation.x = Math.PI;
    belly.position.set(-0.4, 1.42, 0);
    fuselage.add(belly);
    var tailCone = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.10, 1.8, 16), yellowPaint));
    tailCone.rotation.z = Math.PI / 2;
    tailCone.position.set(-3.4, 1.55, 0);
    fuselage.add(tailCone);
    var cowling = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.46, 1.1, 24), yellowDull));
    cowling.rotation.z = Math.PI / 2;
    cowling.position.set(2.05, 1.55, 0);
    fuselage.add(cowling);
    var cowlNose = shadowify(new THREE.Mesh(new THREE.SphereGeometry(0.52, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), darkMetal));
    cowlNose.rotation.z = -Math.PI / 2;
    cowlNose.position.set(2.6, 1.55, 0);
    fuselage.add(cowlNose);
    var intake = shadowify(new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.07, 10, 24), darkMetal));
    intake.rotation.y = Math.PI / 2;
    intake.position.set(2.62, 1.42, 0);
    fuselage.add(intake);
    for (var es = -1; es <= 1; es += 2) {
        var ex = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.35, 8), darkMetal));
        ex.rotation.z = Math.PI / 2 - 0.4;
        ex.position.set(1.85, 1.22, es * 0.30);
        fuselage.add(ex);
    }
    var streaks = new THREE.Group();
    var streakData = [
        { y: 1.30, z:  0.36, len: 2.6, w: 0.10, op: 0.90 },
        { y: 1.22, z:  0.40, len: 3.2, w: 0.07, op: 0.85 },
        { y: 1.16, z:  0.42, len: 2.2, w: 0.05, op: 0.80 },
        { y: 1.30, z: -0.36, len: 2.6, w: 0.10, op: 0.90 },
        { y: 1.22, z: -0.40, len: 3.0, w: 0.07, op: 0.85 },
        { y: 1.08, z:  0.00, len: 3.4, w: 0.14, op: 0.88 }
    ];
    streakData.forEach(function (sd) {
        var m = new THREE.Mesh(new THREE.BoxGeometry(sd.len, 0.012, sd.w), oilMat.clone());
        m.material.opacity = sd.op;
        m.position.set(2.05 - sd.len / 2 - 0.25, sd.y - 0.02, sd.z);
        m.rotation.z = -0.03;
        streaks.add(m);
    });
    fuselage.add(streaks);
    var cockpitRim = shadowify(new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.05, 8, 20), darkMetal));
    cockpitRim.rotation.x = Math.PI / 2;
    cockpitRim.position.set(0.35, 1.95, 0);
    fuselage.add(cockpitRim);
    var windscreen = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.5), glassMat));
    windscreen.position.set(0.72, 2.02, 0);
    windscreen.rotation.z = -0.35;
    fuselage.add(windscreen);
    var seatHead = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.26, 0.24), darkMetal));
    seatHead.position.set(0.1, 1.98, 0);
    fuselage.add(seatHead);
    var wingGroup = new THREE.Group();
    plane.add(wingGroup);
    var SPAN = 5.4, CHORD = 1.05;
    var upperWingX = 0.95, lowerWingX = 0.35;
    var upperWingY = 2.75, lowerWingY = 1.35;
    function buildWing(x, y, dihedral) {
        var wing = new THREE.Group();
        [-1, 1].forEach(function (s) {
            var half = shadowify(new THREE.Mesh(new THREE.BoxGeometry(CHORD, 0.09, SPAN / 2), yellowPaint));
            half.position.set(0, 0, s * SPAN / 4);
            half.rotation.x = s * dihedral;
            wing.add(half);
            var ail = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.07, SPAN / 2 - 0.1), yellowDull));
            ail.position.set(-CHORD / 2 + 0.15, -0.01, s * SPAN / 4);
            ail.rotation.x = s * dihedral;
            wing.add(ail);
            var tipCap = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), yellowDull);
            tipCap.position.set(0, 0, s * SPAN / 2);
            wing.add(tipCap);
        });
        wing.position.set(x, y, 0);
        return wing;
    }
    var upperWing = buildWing(upperWingX, upperWingY, 0.03);
    var lowerWing = buildWing(lowerWingX, lowerWingY, 0.05);
    wingGroup.add(upperWing, lowerWing);
    var cabaneTop = shadowify(new THREE.Mesh(new THREE.BoxGeometry(CHORD * 0.9, 0.09, 1.2), yellowPaint));
    cabaneTop.position.set(upperWingX, upperWingY, 0);
    wingGroup.add(cabaneTop);
    var wirePoints = [];
    [-1, 1].forEach(function (side) {
        [1.55, 2.45].forEach(function (zAbs) {
            var z = side * zAbs;
            [0.32, -0.32].forEach(function (dx) {
                var strut = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.09, upperWingY - lowerWingY, 0.05), yellowDull));
                strut.position.set((upperWingX + lowerWingX) / 2 + dx, (upperWingY + lowerWingY) / 2, z);
                wingGroup.add(strut);
            });
            var yU = upperWingY - 0.05, yL = lowerWingY + 0.05;
            var xUf = upperWingX + 0.32, xUr = upperWingX - 0.32;
            var xLf = lowerWingX + 0.32, xLr = lowerWingX - 0.32;
            wirePoints.push(
                new THREE.Vector3(xLf, yL, z), new THREE.Vector3(xUf, yU, z),
                new THREE.Vector3(xLr, yL, z), new THREE.Vector3(xUr, yU, z),
                new THREE.Vector3(xLf, yL, z), new THREE.Vector3(xUr, yU, z),
                new THREE.Vector3(xLr, yL, z), new THREE.Vector3(xUf, yU, z)
            );
        });
        wirePoints.push(
            new THREE.Vector3(lowerWingX, lowerWingY + 0.05, side * 2.45), new THREE.Vector3(1.9, 1.35, side * 0.3),
            new THREE.Vector3(upperWingX, upperWingY - 0.05, side * 2.45), new THREE.Vector3(0.2, 1.35, side * 0.3)
        );
    });
    var wireGeo = new THREE.BufferGeometry().setFromPoints(wirePoints);
    wingGroup.add(new THREE.LineSegments(wireGeo, wireMat));
    var tailGroup = new THREE.Group();
    plane.add(tailGroup);
    var hStab = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.06, 2.2), yellowPaint));
    hStab.position.set(-4.0, 1.62, 0);
    tailGroup.add(hStab);
    var fin = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.95, 0.06), yellowPaint));
    fin.position.set(-4.0, 2.05, 0);
    tailGroup.add(fin);
    var rudder = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.85, 0.05), yellowDull));
    rudder.position.set(-4.45, 2.0, 0);
    tailGroup.add(rudder);
    var chips = new THREE.Group();
    function chip(x, y, z, w, h, rotZ, mat) {
        var c = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.012), mat || bareMetal);
        c.position.set(x, y, z);
        if (rotZ) c.rotation.z = rotZ;
        chips.add(c);
    }
    var leChips = [
        [0.9, 2.80, 1.1, 0.16], [0.92, 2.80, 2.2, 0.22], [0.88, 2.80, -1.6, 0.14], [0.91, 2.80, -2.5, 0.2],
        [0.82, 1.40, 0.9, 0.15], [0.84, 1.40, 2.0, 0.19], [0.80, 1.40, -1.2, 0.13], [0.83, 1.40, -2.3, 0.17]
    ];
    leChips.forEach(function (c) { chip(c[0] + CHORD / 2 - 0.06, c[1], c[2], c[3], 0.05, 0, bareMetal); });
    chip(2.30, 1.83, 0.30, 0.20, 0.10, 0.4, bareMetal);
    chip(2.42, 1.30, -0.35, 0.16, 0.09, -0.3, bareMetal);
    chip(2.10, 1.95, -0.12, 0.14, 0.08, 0.2, bareMetal);
    chip(2.55, 1.60, 0.42, 0.12, 0.07, 0.1, darkMetal);
    chip(-3.62, 1.66, 0.9, 0.12, 0.04, 0, bareMetal);
    chip(-3.62, 1.66, -0.9, 0.12, 0.04, 0, bareMetal);
    plane.add(chips);
    var propGroup = new THREE.Group();
    propGroup.position.set(2.85, 1.55, 0);
    plane.add(propGroup);
    var spinner = shadowify(new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.35, 16), darkMetal));
    spinner.rotation.z = -Math.PI / 2;
    propGroup.add(spinner);
    var bladeMat = new THREE.MeshStandardMaterial({ color: 0x33261a, roughness: 0.6 });
    var blades = new THREE.Group();
    for (var bi = 0; bi < 2; bi++) {
        var bHolder = new THREE.Group();
        bHolder.rotation.x = bi * Math.PI;
        var b = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.9, 0.17), bladeMat));
        b.rotation.x = 0.25;
        bHolder.add(b);
        blades.add(bHolder);
    }
    propGroup.add(blades);
    var blurDisc = new THREE.Mesh(
        new THREE.CircleGeometry(1.0, 32),
        new THREE.MeshBasicMaterial({ color: 0x4a3b28, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })
    );
    blurDisc.rotation.y = Math.PI / 2;
    blurDisc.position.x = 0.02;
    propGroup.add(blurDisc);
    var gearGroup = new THREE.Group();
    scene.add(gearGroup);
    function fatTyre(radius, width, x, z) {
        var g = new THREE.Group();
        var tyre = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width, 24), tyreMat));
        tyre.rotation.x = Math.PI / 2;
        tyre.scale.set(1, 1, 0.90);
        g.add(tyre);
        for (var i = 0; i < 10; i++) {
            var rib = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, width + 0.02), tyreMat);
            var a = (i / 10) * Math.PI * 2;
            rib.position.set(Math.cos(a) * radius * 0.98, Math.sin(a) * radius * 0.98 * 0.9, 0);
            rib.rotation.z = a + Math.PI / 2;
            g.add(rib);
        }
        var hub = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.45, radius * 0.45, width + 0.04, 16), hubMat));
        hub.rotation.x = Math.PI / 2;
        g.add(hub);
        var patch = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.55, radius * 0.55, width * 0.9, 16, 1, false, 0, Math.PI), tyreMat);
        patch.rotation.x = Math.PI / 2;
        patch.scale.set(1, 0.25, 1);
        patch.position.y = -radius * 0.88;
        g.add(patch);
        g.position.set(x, radius * 0.88, z);
        return g;
    }
    var mainY = 0.55;
    [-1, 1].forEach(function (s) {
        var wheel = fatTyre(mainY, 0.42, 0.95, s * 1.05);
        gearGroup.add(wheel);
        var legTop = new THREE.Vector3(0.75, 1.15, s * 0.30);
        var legBottom = new THREE.Vector3(0.95, mainY, s * 1.05);
        var legLen = legTop.distanceTo(legBottom);
        var leg = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, legLen, 8), darkMetal));
        leg.position.copy(legTop.clone().add(legBottom).multiplyScalar(0.5));
        leg.lookAt(legTop); leg.rotateX(Math.PI / 2);
        gearGroup.add(leg);
        var axle = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.1, 8), darkMetal));
        axle.rotation.x = Math.PI / 2;
        axle.position.set(0.95, mainY, 0);
        gearGroup.add(axle);
    });
    var tailWheel = fatTyre(0.20, 0.14, -4.15, 0);
    tailWheel.position.y = 0.18;
    gearGroup.add(tailWheel);
    var twFork = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.55, 8), darkMetal));
    twFork.position.set(-4.15, 0.45, 0);
    twFork.rotation.z = 0.35;
    gearGroup.add(twFork);
    var sprayGroup = new THREE.Group();
    plane.add(sprayGroup);
    var nozzles = [];
    var boomY = lowerWingY - 0.28;
    var boomSpan = SPAN * 0.86;
    [-1, 1].forEach(function (side) {
        var len = boomSpan / 2;
        var zc = side * (len / 2 + 0.15);
        var boom = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, len, 10), boomMat));
        boom.rotation.x = Math.PI / 2;
        boom.position.set(lowerWingX - 0.15, boomY, zc);
        sprayGroup.add(boom);
        [side * 0.9, side * 2.1].forEach(function (z) {
            var sup = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.26, 6), boomMat));
            sup.position.set(lowerWingX - 0.15, boomY + 0.13, z);
            sprayGroup.add(sup);
        });
        var count = 7;
        for (var i = 0; i < count; i++) {
            var z = side * (0.35 + (len - 0.5) * (i / (count - 1)));
            var nz = new THREE.Group();
            nz.position.set(lowerWingX - 0.15, boomY - 0.06, z);
            var bodyN = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.12, 8), darkMetal);
            nz.add(bodyN);
            var flap = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.09, 8), new THREE.MeshStandardMaterial({ color: 0xb88030, roughness: 0.5, metalness: 0.4 }));
            flap.position.y = -0.09;
            nz.add(flap);
            sprayGroup.add(nz);
            nozzles.push({ node: nz, flap: flap, open: 0 });
        }
    });
    var tank = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0xd8d8d2, roughness: 0.5, metalness: 0.3 })));
    tank.rotation.z = Math.PI / 2;
    tank.position.set(1.15, 1.5, 0);
    plane.add(tank);
    var MAXP = 2200;
    var pGeo = new THREE.BufferGeometry();
    var pPos = new Float32Array(MAXP * 3);
    var pVel = new Float32Array(MAXP * 3);
    var pLife = new Float32Array(MAXP);
    for (var pl = 0; pl < MAXP; pl++) { pLife[pl] = -1; pPos[pl * 3 + 1] = -50; }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    var pMat = new THREE.PointsMaterial({
        color: 0xdff2ff, size: 0.14, transparent: true, opacity: 0.75,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
    });
    var sprayPoints = new THREE.Points(pGeo, pMat);
    sprayPoints.frustumCulled = false;
    scene.add(sprayPoints);
    var sprayOn = false;
    var spawnAccumulator = 0;
    var _v = new THREE.Vector3();
    function spawnParticles(dt) {
        spawnAccumulator += dt * 900;
        var toSpawn = Math.floor(spawnAccumulator);
        spawnAccumulator -= toSpawn;
        for (var i = 0; i < MAXP && toSpawn > 0; i++) {
            if (pLife[i] < 0) {
                var n = nozzles[Math.floor(Math.random() * nozzles.length)];
                n.node.getWorldPosition(_v);
                pPos[i * 3] = _v.x + (Math.random() - 0.5) * 0.05;
                pPos[i * 3 + 1] = _v.y - 0.12;
                pPos[i * 3 + 2] = _v.z + (Math.random() - 0.5) * 0.05;
                pVel[i * 3] = -0.9 - Math.random() * 0.4;
                pVel[i * 3 + 1] = -1.6 - Math.random() * 0.8;
                pVel[i * 3 + 2] = (Math.random() - 0.5) * 0.35;
                pLife[i] = 1.0 + Math.random() * 0.6;
                toSpawn--;
            }
        }
    }
    function updateParticles(dt) {
        for (var i = 0; i < MAXP; i++) {
            if (pLife[i] >= 0) {
                pLife[i] -= dt;
                pPos[i * 3] += pVel[i * 3] * dt;
                pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
                pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
                pVel[i * 3 + 1] -= 1.2 * dt;
                if (pPos[i * 3 + 1] < 0.02 || pLife[i] < 0) {
                    pLife[i] = -1;
                    pPos[i * 3 + 1] = -50;
                }
            }
        }
        pGeo.attributes.position.needsUpdate = true;
    }
    var btn = document.getElementById('sprayBtn');
    btn.addEventListener('click', function () {
        sprayOn = !sprayOn;
        btn.textContent = 'SPRAY SYSTEM: ' + (sprayOn ? 'ON' : 'OFF');
        btn.className = sprayOn ? 'on' : 'off';
    });
    var clock = new THREE.Clock();
    var vibT = 0;
    function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.05);
        vibT += dt;
        blades.rotation.x += dt * 28;
        blurDisc.material.opacity = 0.15 + Math.sin(vibT * 40) * 0.03;
        plane.position.y = Math.sin(vibT * 31) * 0.006;
        plane.rotation.x = Math.sin(vibT * 23) * 0.0022;
        nozzles.forEach(function (n) {
            var target = sprayOn ? 1 : 0;
            n.open += (target - n.open) * Math.min(1, dt * 6);
            n.flap.rotation.x = n.open * 1.1;
            n.flap.position.y = -0.09 - n.open * 0.03;
            n.flap.scale.setScalar(1 + n.open * 0.25);
        });
        if (sprayOn) spawnParticles(dt);
        updateParticles(dt);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>
</body>
</html>
