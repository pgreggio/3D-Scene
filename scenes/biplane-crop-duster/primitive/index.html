<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AG-1 Bluejacket Crop Duster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3eee3; --paper2:#ebe4d4; --ink:#18242c; --muted:#5f6b72; --line:#d6ccb9;
  --blue:#2f63b5; --hot:#e8692a; --off:#8e979c;
  --f-title:'Big Shoulders Stencil Display', 'Barlow Condensed', sans-serif;
  --f-ui:'Barlow Condensed', sans-serif; --f-num:'IBM Plex Mono', monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#e2e4dc;color:var(--ink);font-family:var(--f-ui)}
#app{position:fixed;inset:0}
canvas{display:block;outline:none}
.card{background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(24,36,44,.16)}
.brand{position:absolute;top:18px;left:18px;padding:12px 18px 12px 14px;display:flex;gap:12px;align-items:center;z-index:5}
.brand svg{width:46px;height:30px;color:var(--blue);flex:none}
.kicker{font:600 12px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:800 34px/0.95 var(--f-title);letter-spacing:.04em;color:var(--blue);margin-top:4px}
.cams{position:absolute;top:18px;right:18px;z-index:5;display:flex;gap:6px;padding:6px}
.cams button{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;color:var(--ink);font:600 14px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:7px;cursor:pointer}
.cams button svg{width:17px;height:17px}
.cams button:hover{background:var(--paper2)}
.cams button.active{background:var(--ink);color:var(--paper)}
.cams button:focus-visible,.switch:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.hint{position:absolute;top:74px;right:18px;font:500 13px/1.3 var(--f-ui);letter-spacing:.05em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);z-index:5;text-align:right}
.panel{position:absolute;left:0;right:0;bottom:16px;margin:0 auto;width:min(1180px,calc(100% - 32px));display:grid;grid-template-columns:auto 1fr auto;gap:0;z-index:5;overflow:hidden}
.panel > div,.panel > .metrics{padding:12px 18px}
.panel > div + div,.panel > .sw-block + .metrics,.panel > .metrics + .diag{border-left:1px solid var(--line)}
.metrics{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.lbl{font:600 12px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sw-block{display:flex;flex-direction:column;justify-content:center;min-width:210px}
.switch{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;font:800 26px/1 var(--f-title);letter-spacing:.06em;color:var(--off)}
.switch .track{position:relative;width:66px;height:32px;border-radius:32px;background:#cfc6b4;border:1px solid #bdb29d;transition:background .25s}
.switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.4,1.4,.6,1)}
.switch.on{color:var(--hot)}
.switch.on .track{background:var(--hot);border-color:#c9551f}
.switch.on .knob{transform:translateX(34px)}
#sprayState{margin-top:9px;font:500 13px/1 var(--f-num);letter-spacing:.06em;display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
#sprayState::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--off)}
#sprayState[data-s="on"]{color:var(--ink)} #sprayState[data-s="on"]::before{background:var(--hot);box-shadow:0 0 0 3px rgba(232,105,42,.25)}
#sprayState[data-s="busy"]::before{background:#d9a441;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.readouts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;gap:6px 18px}
.ro{display:flex;flex-direction:column;gap:6px;min-width:0}
.ro .k{font:600 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ro .v{display:flex;align-items:baseline;gap:4px}
.ro b{font:500 24px/1 var(--f-num);color:var(--ink);font-variant-numeric:tabular-nums}
.ro i{font:600 13px/1 var(--f-ui);font-style:normal;color:var(--muted);letter-spacing:.06em}
.ro .bar{display:block;height:4px;background:var(--paper2);border-radius:3px;overflow:hidden}
.ro .bar span{display:block;height:100%;background:var(--blue);transform-origin:left}
.diag svg{width:250px;height:54px;display:block}
.diag .wing{fill:#d9d1c1;stroke:#b8ad97;stroke-width:1}
.diag .fus{fill:var(--blue)}
.diag .boom{stroke:#8e979c;stroke-width:2}
.nz circle{fill:var(--off);transition:fill .2s}
.nz.open circle{fill:var(--hot)}
.nz .fan{fill:var(--hot);opacity:0;transition:opacity .25s}
.nz.flow .fan{opacity:.35}


@media (max-width:900px){
  .brand h1{font-size:26px}
  .hint{display:none}
  .cams button span{display:none}
  .panel{grid-template-columns:1fr;bottom:10px}
  .panel > div + div{border-left:0;border-top:1px solid var(--line)}
  .readouts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .diag{display:none}
}
@media (max-width:520px){
  .brand{max-width:calc(100% - 36px)}
  .cams{top:104px}
}
@media (max-width:400px){
  .panel > div,.panel > .metrics{padding:10px 14px}
  .readouts{gap:6px 12px}
  .ro .k{font-size:10px;letter-spacing:.08em}
  .ro b{font-size:20px}
  .ro i{font-size:11px}
}

</style>
</head>

 flow"><path class="fan" d="M160.4 33 l-4 16 h8 z"/><circle cx="160.4" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M167.6 33 l-4 16 h8 z"/><circle cx="167.6" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M174.8 33 l-4 16 h8 z"/><circle cx="174.8" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M182.1 33 l-4 16 h8 z"/><circle cx="182.1" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M189.3 33 l-4 16 h8 z"/><circle cx="189.3" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M196.5 33 l-4 16 h8 z"/><circle cx="196.5" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M203.7 33 l-4 16 h8 z"/><circle cx="203.7" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M210.9 33 l-4 16 h8 z"/><circle cx="210.9" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M218.2 33 l-4 16 h8 z"/><circle cx="218.2" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M225.4 33 l-4 16 h8 z"/><circle cx="225.4" cy="31" r="2.6"/></g><g class="nz open flow"><path class="fan" d="M232.6 33 l-4 16 h8 z"/><circle cx="232.6" cy="31" r="2.6"/></g></svg>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

var BufferGeometryUtils = { mergeGeometries: mergeGeometries, mergeBufferGeometries: mergeGeometries };

(function () {
    var container = document.getElementById('app');
    var renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    var _pixelRatio = renderer.getPixelRatio();
    container.appendChild(renderer.domElement);
    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xe2e4dc, 38, 460);
    var camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.05, 5000);
    camera.position.set(9.3, 2.95, -8.5);
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-0.45, 1, 0.1);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 1.2;
    controls.maxDistance = 28;
    controls.maxPolarAngle = 1.54;
    controls.screenSpacePanning = false;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 1.6;
    controls.rotateSpeed = 0.7;
    controls.zoomSpeed = 0.9;
    var CAMERA_CLEARANCE = 0.2;
    var cameraColliders = [];
    var camRay = new THREE.Raycaster();
    var camLastSafe = camera.position.clone();
    function isDescendantOf(obj, root) {
        for (var n = obj; n; n = n.parent) {
            if (n === root) return true;
        }
        return false;
    }
    var GROUND_CAM_Y = 0.12;
    var GROUND_TARGET_Y = 0.05;
    var cropMinX = -260, cropMaxX = 260, cropMinZ = -260, cropMaxZ = 260;
    function resolveCameraCollision() {
        var from = camLastSafe.clone();
        var want = camera.position.clone();
        for (var pass = 0; pass < 3; pass++) {
            var move = want.clone().sub(from);
            var len = move.length();
            if (len < 1e-6) break;
            var dir = move.clone().divideScalar(len);
            camRay.set(from, dir);
            camRay.near = 0;
            camRay.far = len + CAMERA_CLEARANCE;
            var hits = camRay.intersectObjects(cameraColliders, false);
            var hit = null;
            for (var h = 0; h < hits.length; h++) {
                var n = hits[h].face.normal.clone().transformDirection(hits[h].object.matrixWorld);
                if (n.dot(dir) < 0) { hit = hits[h]; break; }
            }
            if (!hit) { from.copy(want); break; }
            var stop = from.clone().addScaledVector(dir, Math.max(0, hit.distance - CAMERA_CLEARANCE));
            var remaining = want.clone().sub(stop);
            var slide = remaining.clone().sub(n.clone().multiplyScalar(remaining.dot(n)));
            from.copy(stop);
            if (pass === 2) want.copy(stop);
            else want.copy(stop).add(slide);
        }
        camera.position.copy(from);
        camLastSafe.copy(from);
    }
    function enforceViewBarrier() {
        var p = camera.position;
        var t = controls.target;
        if (p.y < GROUND_CAM_Y) p.y = GROUND_CAM_Y;
        if (t.y < GROUND_TARGET_Y) t.y = GROUND_TARGET_Y;
        // keep the pivot over the field and carry the camera with it, so panning stops at the edge;
        // clamping the camera itself flattened the orbit into a box and made it jump when zoomed out
        if (t.x < cropMinX) { p.x += cropMinX - t.x; t.x = cropMinX; }
        if (t.x > cropMaxX) { p.x += cropMaxX - t.x; t.x = cropMaxX; }
        if (t.z < cropMinZ) { p.z += cropMinZ - t.z; t.z = cropMinZ; }
        if (t.z > cropMaxZ) { p.z += cropMaxZ - t.z; t.z = cropMaxZ; }
        if (camAnim) camLastSafe.copy(camera.position);
        else resolveCameraCollision();
        if (p.y < GROUND_CAM_Y) p.y = GROUND_CAM_Y;
    }
    var finishUniforms = {
        tDiffuse: { value: null },
        uTime: { value: 0 },
        uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };
    var finishShader = {
        uniforms: finishUniforms,
        vertexShader: [
            "varying vec2 vUv;",
            "void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }"
        ].join("\n"),
        fragmentShader: [
            "uniform sampler2D tDiffuse;",
            "uniform float uTime;",
            "uniform vec2 uRes;",
            "varying vec2 vUv;",
            "void main(){",
            "  vec2 d = vUv - 0.5;",
            "  float r2 = dot(d, d);",
            "  vec2 off = d * r2 * 0.010;",
            "  vec3 c = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);",
            "  c *= 1.0 - 0.3 * smoothstep(0.1, 0.55, r2 * 1.6);",
            "  float n = fract(sin(dot(vUv * uRes + fract(uTime) * 97.0, vec2(12.9898, 78.233))) * 43758.5453);",
            "  c += (n - 0.5) * 0.02;",
            "  gl_FragColor = vec4(c, 1.0);",
            "}"
        ].join("\n")
    };
    var composerTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
        type: THREE.HalfFloatType,
        samples: 4
    });
    var composer = new EffectComposer(renderer, composerTarget);
    composer.addPass(new RenderPass(scene, camera));
    var bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.22, 0.55, 1.15);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
    var finishPass = new ShaderPass(finishShader);
    finishUniforms = finishPass.uniforms;
    composer.addPass(finishPass);
    function linVec3(hex) {
        var c = new THREE.Color(hex);
        return 'vec3(' + c.r.toFixed(4) + ',' + c.g.toFixed(4) + ',' + c.b.toFixed(4) + ')';
    }
    var tn = {
        horizon: 0xe2e4dc,
        zen: 0x3f7ecb,
        mid: 0x93bde4,
        below: 0x7c7a55,
        grass: 0x76793f,
        grassLush: 0x5c6c2e,
        grassDry: 0x9b8c5c,
        dirt: 0x5e3d25,
        dirtDry: 0x837969,
        soil: 0x5b4b31,
        crop: 0x4f6e2a
    };
    var sunDir = new THREE.Vector3(0.2, 0.62, -0.76).normalize();
    var sun = new THREE.DirectionalLight(0xffeed6, 3.9);
    sun.position.copy(sunDir).multiplyScalar(70).add(new THREE.Vector3(-4, 0, 0));
    sun.target.position.set(-4, 0, 0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;
    sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26;
    sun.shadow.camera.near = 30;
    sun.shadow.camera.far = 108;
    sun.shadow.bias = -0.0001;
    sun.shadow.normalBias = 0.012;
    scene.add(sun);
    scene.add(sun.target);
    var skyUniforms = {
        uTime: { value: 0 },
        uSun: { value: sunDir }
    };
    function makeSkyMaterial(withSunDisc) {
        var discLine = withSunDisc
            ? "  col += vec3(1.0, 0.93, 0.8) * smoothstep(0.99955, 0.9998, s) * 60.0;"
            : "";
        return new THREE.ShaderMaterial({
            uniforms: {
                uTime: skyUniforms.uTime,
                uSun: skyUniforms.uSun
            },
            side: THREE.BackSide,
            depthWrite: false,
            fog: false,
            vertexShader: [
                "varying vec3 vDir;",
                "void main() {",
                "  vDir = normalize(position);",
                "  vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
                "  gl_Position = p.xyww;",
                "}"
            ].join("\n"),
            fragmentShader: [
                "uniform float uTime;",
                "uniform vec3 uSun;",

            uT: { value: tDir.clone() },
            uK: { value: kDir.clone() },
            uWind: { value: wind.clone() },
            uPx: { value: 800 }
        };
        var mat = new THREE.ShaderMaterial({
            uniforms: U,
            transparent: true,
            depthWrite: false,
            blending: THREE.NormalBlending,
            vertexShader: [
                "attribute vec4 aSeed;",
                "attribute vec3 aNoz;",
                "attribute float aType;",
                "uniform float uTime;",
                "uniform float uS0;",
                "uniform float uE0;",
                "uniform float uS1;",
                "uniform float uE1;",
                "uniform float uPx;",
                "uniform vec3 uN;",
                "uniform vec3 uT;",
                "uniform vec3 uK;",
                "uniform vec3 uWind;",
                "varying float vA;",
                "varying float vType;",
                "varying float vL;",
                "void main(){",
                "  bool ex = aType > 1.5;",
                "  bool mist = aType > 0.5 && !ex;",
                "  float life = ex ? mix(1.4, 2.4, aSeed.x) : (mist ? mix(2.8, 4.4, aSeed.x) : mix(1.1, 1.9, aSeed.x));",
                "  float age = fract(uTime/life + aSeed.y) * life;",
                "  float te = uTime - age;",
                "  float dl = 0.30 + aSeed.z*0.18;",
                "  float vis = ex ? 1.0 : max(step(uS0 + dl, te)*step(te, uE0), step(uS1 + dl, te)*step(te, uE1));",
                "  if (vis < 0.5) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vA = 0.0; vType = aType; vL = 1.0; return; }",
                "  float fan = (aSeed.w - 0.5)*2.0;",
                "  vec3 v0 = ex ? (uT*1.6 - vec3(0.0, 1.4, 0.0) + uK*(aSeed.w - 0.5)*0.8) : (uN*(3.2 + 1.6*aSeed.z) + uK*fan*1.35 + uT*0.4);",
                "  if (mist) v0 *= 0.55;",
                "  float tau = 0.28;",
                "  vec3 p = aNoz + uWind*age + (v0 - uWind)*tau*(1.0 - exp(-age/tau));",
                "  p.y -= (ex ? -0.2 : (mist ? 0.2 : 0.55))*age*age;",
                "  vec3 q = aSeed.yzw*vec3(37.0, 53.0, 71.0);",
                "  vec3 tb = vec3(sin(uTime*1.3 + q.x + age*2.1), 0.6*sin(uTime*1.7 + q.y + age*1.6), sin(uTime*1.1 + q.z + age*2.4));",
                "  p += tb*(0.18*age + 0.22*age*age)*(mist ? 1.4 : 0.8);",
                "  float gy = 0.03 + (mist ? 0.22 + 0.55*smoothstep(0.5, 3.5, age) : 0.015);",
                "  if (p.y < gy) p.y = gy + (gy - p.y)*0.08;",
                "  vec4 mv = modelViewMatrix*vec4(p, 1.0);",
                "  float sz = ex ? mix(0.08, 0.9, age/life) : (mist ? mix(0.35, 2.0, smoothstep(0.0, 3.0, age)) : mix(0.02, 0.11, smoothstep(0.0, 1.2, age)));",
                "  gl_PointSize = clamp(sz*uPx/(-mv.z), 1.0, 180.0);",
                "  gl_Position = projectionMatrix*mv;",
                "  float fin = smoothstep(0.0, 0.06, age);",
                "  float fout = 1.0 - smoothstep(0.5, 1.0, age/life);",
                "  vA = fin*fout*(ex ? 0.07 : (mist ? 0.03 : 0.3));",
                "  if (!mist && !ex) vA *= smoothstep(0.05, 0.7, p.y);",
                "  vA *= mix(0.55, 1.0, smoothstep(1.5, 5.0, gl_PointSize));",
                "  vType = aType;",
                "  vL = clamp(0.8 + 0.25*p.y, 0.8, 1.1);",
                "}"
            ].join("\n"),
            fragmentShader: [
                "varying float vA;",
                "varying float vType;",
                "varying float vL;",
                "void main(){",
                "  vec2 c = gl_PointCoord*2.0 - 1.0;",
                "  float d = dot(c, c);",
                "  if (d > 1.0) discard;",
                "  float a = vA*(vType < 0.5 ? (1.0 - d) : pow(1.0 - d, 1.7));",
                "  vec3 col = vType > 1.5 ? vec3(0.33, 0.33, 0.34) : vec3(0.93, 0.96, 0.98)*vL;",
                "  gl_FragColor = vec4(col, a);",
                "}"
            ].join("\n")
        });
        var pts = new THREE.Points(g, mat);
        pts.frustumCulled = false;
        pts.renderOrder = 5;
        pts.name = "SPRAY_PARTICLES";
        var fanGeos = [];
        nozArr.forEach(function (w, R) {
            var P = new THREE.ConeGeometry(1, 1, 18, 3, true);
            P.translate(0, -0.5, 0);
            var b = P.attributes.position.count;
            var M = new Float32Array(b), C = new Float32Array(b), V = new Float32Array(b);
            for (var z = 0; z < b; z++) {
                M[z] = -P.attributes.position.getY(z);
                C[z] = Math.atan2(P.attributes.position.getZ(z), P.attributes.position.getX(z));
                V[z] = R;
            }
            P.setAttribute("aH", new THREE.BufferAttribute(M, 1));
            P.setAttribute("aAng", new THREE.BufferAttribute(C, 1));
            P.setAttribute("aId", new THREE.BufferAttribute(V, 1));
            if (P.attributes.uv) P.deleteAttribute("uv");
            if (P.attributes.normal) P.deleteAttribute("normal");
            var B = new THREE.Matrix4().makeBasis(
                kDir.clone().multiplyScalar(0.16),
                nDir.clone().multiplyScalar(-0.36),
                tDir.clone().multiplyScalar(0.05)
            );
            P.applyMatrix4(B);
            P.translate(w.x, w.y, w.z);
            fanGeos.push(P.index ? P.toNonIndexed() : P);
        });
        var FU = { uFlow: { value: 1 }, uTime: U.uTime };
        var fanMat = new THREE.ShaderMaterial({
            uniforms: FU,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            blending: THREE.NormalBlending,
            vertexShader: [
                "attribute float aH;",
                "attribute float aAng;",
                "attribute float aId;",
                "varying float vH;",
                "varying float vAng;",
                "varying float vId;",
                "void main(){",
                "  vH = aH;",
                "  vAng = aAng;",
                "  vId = aId;",
                "  gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);",
                "}"
            ].join("\n"),
            fragmentShader: [
                "varying float vH;",
                "varying float vAng;",
                "varying float vId;",
                "uniform float uFlow;",
                "uniform float uTime;",
                "void main(){",
                "  float streak = mix(0.55, 1.0, 0.5 + 0.5*sin(vAng*13.0 + vId*2.3 + sin(uTime*9.0 + vId)*0.8));",
                "  float flick = 0.75 + 0.25*sin(uTime*31.0 + vId*5.1 + vH*18.0);",
                "  float a = uFlow*(1.0 - smoothstep(0.15, 1.0, vH))*smoothstep(0.0, 0.06, vH)*streak*flick*0.34;",
                "  gl_FragColor = vec4(vec3(0.94, 0.97, 1.0), a);",
                "}"
            ].join("\n")
        });
        var merged = BufferGeometryUtils.mergeBufferGeometries(fanGeos, false);
        if (!merged) {
            merged = fanGeos[0];
            for (var fi = 1; fi < fanGeos.length; fi++) merged = BufferGeometryUtils.mergeBufferGeometries([merged, fanGeos[fi]], false) || merged;
        }
        var fanMesh = new THREE.Mesh(merged, fanMat);
        fanMesh.renderOrder = 4;
        fanMesh.frustumCulled = false;
        fanMesh.name = "SPRAY_FAN_SHEETS";
        return { pts: pts, fanMesh: fanMesh, U: U, FU: FU };
    }
    var Fs = buildSpraySystem(nozTips, nAxisW, tAftW, sideW, windW, exhTips);
    scene.add(Fs.pts);
    scene.add(Fs.fanMesh);
    var sprayFlow = 0;
    var vibT = 0;
    var sprayOn = window.location.href.indexOf('off') === -1;
    var spraySwitchTime = -100;
    if (!sprayOn) Fs.U.uE0.value = -1000;
    var hopper = 74.0;
    var nozzles = plane.userData.noz.map(function (nz, i) {
        return { open: 1, index: i, O: nz.O };
    });
    function setSprayEnabled(on, t) {
        var e = Fs.U;
        if (on) {
            e.uS1.value = e.uS0.value;
            e.uE1.value = e.uE0.value;
            e.uS0.value = t;
            e.uE0.value = 1e9;
        } else {
            e.uE0.value = t;
        }
    }
    var spraySwitch = document.getElementById('spraySwitch');
    var sprayState = document.getElementById('sprayState');
    var swText = document.getElementById('swText');
    var hopperBar = document.getElementById('hopBar');
    var rFlow = document.getElementById('rFlow');
    var rPress = document.getElementById('rPress');
    var rNoz = document.getElementById('rNoz');
    var rAper = document.getElementById('rAper');
    var rRpm = document.getElementById('rRpm');
    var rHop = document.getElementById('rHop');
    var boomNz = document.querySelectorAll('#boomDiag .nz');
    var camHeroBtn = document.getElementById('camHero');
    var camNozBtn = document.getElementById('camNoz');
    var camOrbitBtn = document.getElementById('camOrbit');
    function cubicEase(t) {
        t = Math.max(0, Math.min(1, t));
        return t * t * (3 - 2 * t);
    }
    function sprayLevels(at) {
        var sw = at - spraySwitchTime;
        var opening, flow;
        if (sprayOn) {
            opening = cubicEase(sw / 0.55);
            flow = cubicEase((sw - 0.3) / 0.7);
        } else {
            opening = 1 - cubicEase((sw - 0.12) / 0.5);
            flow = 1 - cubicEase(sw / 0.25);
        }
        return {
            opening: Math.max(0, Math.min(1, opening)),
            flow: Math.max(0, Math.min(1, flow))
        };
    }
    var uiCache = {};
    function updateSprayUI() {
        var lv = sprayLevels(vibT);
        var opening = lv.opening, flow = lv.flow;
        var onClass = 'switch' + (sprayOn ? ' on' : '');
        var onChecked = sprayOn ? 'true' : 'false';
        var onText = sprayOn ? 'ON' : 'OFF';
        var sState;
        if (sprayOn) sState = opening < 0.99 ? 'NOZZLES OPENING' : (flow < 0.98 ? 'PRESSURISING' : 'SPRAYING');
        else sState = opening > 0.01 ? 'NOZZLES CLOSING' : 'STANDBY';
        var sData = sState === 'SPRAYING' ? 'on' : (sState === 'STANDBY' ? 'off' : 'busy');
        var wobble = Math.sin(vibT * 7.1) * 0.6 + Math.sin(vibT * 2.3) * 0.4;
        var sFlow = String(Math.round(flow * (142 + 1.2 * wobble)));
        var sPress = (flow * (2.8 + 0.03 * wobble)).toFixed(2);
        var sRpm = String(1850 + Math.round(9 * wobble));
        var sNzOp = (0.25 + 0.75 * opening).toFixed(2);
        var sNoz = Math.round(26 * opening) + '/26';
        var sAper = String(Math.round(100 * opening));
        var sHop = hopper.toFixed(1);
        if (uiCache.c !== onClass) { uiCache.c = onClass; if (spraySwitch) spraySwitch.className = onClass; }
        if (uiCache.ck !== onChecked) { uiCache.ck = onChecked; if (spraySwitch) spraySwitch.setAttribute('aria-checked', onChecked); }
        if (uiCache.wt !== onText) { uiCache.wt = onText; if (swText) swText.textContent = onText; }
        if (uiCache.ds !== sData || uiCache.st !== sState) {
            uiCache.ds = sData; uiCache.st = sState;
            if (sprayState) { sprayState.dataset.s = sData; sprayState.textContent = sState; }
        }
        if (uiCache.fl !== sFlow) { uiCache.fl = sFlow; if (rFlow) rFlow.textContent = sFlow; }
        if (uiCache.pr !== sPress) { uiCache.pr = sPress; if (rPress) rPress.textContent = sPress; }
        if (uiCache.nz !== sNoz) { uiCache.nz = sNoz; if (rNoz) rNoz.textContent = sNoz; }
        if (uiCache.ap !== sAper) { uiCache.ap = sAper; if (rAper) rAper.textContent = sAper; }
        if (uiCache.rp !== sRpm) { uiCache.rp = sRpm; if (rRpm) rRpm.textContent = sRpm; }
        if (uiCache.no !== sNzOp) {
            uiCache.no = sNzOp;
            for (var oi = 0; oi < boomNz.length; oi++) boomNz[oi].style.opacity = sNzOp;
        }
        if (uiCache.hp !== sHop) { uiCache.hp = sHop; if (rHop) rHop.textContent = sHop; }
        if (uiCache.hb !== sHop) { uiCache.hb = sHop; if (hopperBar) hopperBar.style.transform = 'scaleX(' + (hopper / 100) + ')'; }
        var openCls = opening > 0.5, flowCls = flow > 0.5;
        if (uiCache.oc !== openCls || uiCache.fc !== flowCls) {
            uiCache.oc = openCls; uiCache.fc = flowCls;
            for (var ni = 0; ni < boomNz.length; ni++) {
                var el = boomNz[ni];
                el.classList.toggle('open', openCls);
                el.classList.toggle('flow', flowCls);
            }
        }
    }
    function setSprayOn(on) {
        if (on === sprayOn) return;
        if (on && hopper <= 0) hopper = 100;
        sprayOn = on;
        spraySwitchTime = vibT;
        setSprayEnabled(sprayOn, vibT);
        updateSprayUI();
    }
    function toggleSpray() {
        setSprayOn(!sprayOn);
    }
    if (spraySwitch) spraySwitch.addEventListener('click', toggleSpray);
    var camState = 'hero';
    var camAnim = null;
    var CAM = {
        hero: { pos: [9.3, 2.95, -8.5], look: [-0.45, 1, 0.1] },
        nozzles: { pos: [2.1, 0.62, -4.3], look: [-0.25, 0.66, -2.35] }
    };
    function updateCamButtons() {
        if (camHeroBtn) {
            camHeroBtn.classList.toggle('active', camState === 'hero');
            camHeroBtn.setAttribute('aria-pressed', camState === 'hero' ? 'true' : 'false');
        }
        if (camNozBtn) {
            var nz = camState === 'nozzles' || camState === 'noz';
            camNozBtn.classList.toggle('active', nz);
            camNozBtn.setAttribute('aria-pressed', nz ? 'true' : 'false');
        }
        if (camOrbitBtn) {
            var orb = !!controls.autoRotate;
            camOrbitBtn.classList.toggle('active', orb);
            camOrbitBtn.setAttribute('aria-pressed', orb ? 'true' : 'false');
        }
    }
    function setOrbitEnabled(on) {
        controls.autoRotate = !!on;
        if (on) {
            camAnim = null;
            camState = 'orbit';
        } else if (camState === 'orbit') {
            camState = 'free';
        }
            updateCamButtons();
    }
    function setCameraPreset(name, instant) {
        if (name === 'noz') name = 'nozzles';
        if (name === 'orbit') {
            setOrbitEnabled(!(camState === 'orbit' && controls.autoRotate));
            return;
        }
        var p = CAM[name];
        if (!p) return;
        controls.autoRotate = false;
        var p1 = new THREE.Vector3(p.pos[0], p.pos[1], p.pos[2]);
        var l1 = new THREE.Vector3(p.look[0], p.look[1], p.look[2]);
        if (instant) {
            camera.position.copy(p1);
            camLastSafe.copy(camera.position);
            controls.target.copy(l1);
            camState = name;
            updateCamButtons();
            return;
        }
        camAnim = {
            t0: performance.now(), dur: 1300,
            p0: camera.position.clone(), p1: p1,
            l0: controls.target.clone(), l1: l1,
            name: name
        };
        camState = name;
        updateCamButtons();
    }
    function updateCameraTransition() {
        if (!camAnim) return;
        var t = Math.min(1, (performance.now() - camAnim.t0) / camAnim.dur);
        var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
        controls.target.lerpVectors(camAnim.l0, camAnim.l1, e);
        if (t >= 1) {
            camState = camAnim.name;
            camAnim = null;
            updateCamButtons();
        }
    }
    if (camHeroBtn) camHeroBtn.addEventListener('click', function () { setCameraPreset('hero'); });
    if (camNozBtn) camNozBtn.addEventListener('click', function () { setCameraPreset('noz'); });
    if (camOrbitBtn) camOrbitBtn.addEventListener('click', function () { setOrbitEnabled(!(camState === 'orbit' && controls.autoRotate)); });
    window.addEventListener('keydown', function (e) {
        var t = e.target;
        var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
        if (typing) return;
        if (t && t.tagName === 'BUTTON' && (e.key === ' ' || e.code === 'Space' || e.key === 'Enter')) return;
        var k = e.key.toLowerCase();
        if (k === 'h') { setCameraPreset('hero'); e.preventDefault(); }
        else if (k === 'n') { setCameraPreset('noz'); e.preventDefault(); }
        else if (k === 'o') { setOrbitEnabled(!(camState === 'orbit' && controls.autoRotate)); e.preventDefault(); }
        else if (k === 's') { toggleSpray(); e.preventDefault(); }
        else if (e.key === ' ' || e.code === 'Space') { toggleSpray(); e.preventDefault(); }
    });


    updateSprayUI();
    var clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.05);
        vibT += dt;
        var propAngle = vibT * -24;
        blades.rotation.x = propAngle;
        for (var ghi = 0; ghi < propGhosts.length; ghi++) propGhosts[ghi].rotation.x = propAngle + (ghi + 1) * 0.17;
        if (blurDisc.material.uniforms && blurDisc.material.uniforms.uPhase) blurDisc.material.uniforms.uPhase.value = -propAngle;
        pumpFan.rotation.x = -vibT * 17;
        plane.position.y = plane.userData.H;
        plane.rotation.x = 0;
        var lv = sprayLevels(vibT);
        var opening = lv.opening, flow = lv.flow;
        plane.userData.setAperture(opening);
        sprayFlow = flow;
        Fs.U.uTime.value = vibT;
        Fs.FU.uFlow.value = flow;
        Fs.U.uPx.value = window.innerHeight * _pixelRatio / (2 * Math.tan(camera.fov * Math.PI / 360));
        updateCameraTransition();
        var wetTarget = sprayOn ? 0.85 : 0;
        groundUniforms.uWet.value += (wetTarget - groundUniforms.uWet.value) * Math.min(1, dt * 2.5);
        if (sprayOn && flow > 0) {
            hopper = Math.max(0, hopper - 0.06 * flow * dt);
            if (hopper <= 0) {
                hopper = 0;
                setSprayOn(false);
            }
        }
        updateSprayUI();
        controls.update();
        enforceViewBarrier();
        finishPass.uniforms.uTime.value = vibT;
        skyUniforms.uTime.value = vibT;
        vegTime.value = vibT;
        composer.render();
    }
    animate();
    function resizeView() {
        _pixelRatio = renderer.getPixelRatio();
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        finishPass.uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
        bloomPass.resolution.set(window.innerWidth, window.innerHeight);
    }
    resizeView();
    window.addEventListener('resize', resizeView);
    window.__SCENE__ = scene;
    window.__PLANE__ = plane;
})();
