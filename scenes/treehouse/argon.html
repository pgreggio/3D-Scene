<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Old Oak — Treehouse Builder</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
        position: absolute; top: 16px; left: 16px; z-index: 10;
        background: rgba(24, 34, 18, 0.75); color: #eef6e2;
        padding: 13px 17px; border-radius: 12px;
        backdrop-filter: blur(6px); border: 1px solid rgba(180, 220, 140, 0.28);
        max-width: 265px; box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    #hud h1 { font-size: 15px; letter-spacing: 0.5px; margin-bottom: 4px; color: #b8e986; }
    #hud p { font-size: 11px; opacity: 0.9; line-height: 1.6; }
    #resetBtn {
        margin-top: 9px; width: 100%; padding: 7px 10px; font-size: 12px; font-weight: 600;
        border: none; border-radius: 8px; cursor: pointer;
        background: #7a9a4a; color: #fff; transition: background 0.2s;
    }
    #resetBtn:hover { background: #8fb45a; }
    #hint {
        position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
        color: rgba(240, 250, 225, 0.9); font-size: 11px; letter-spacing: 0.5px;
        background: rgba(24, 34, 18, 0.6); padding: 6px 14px; border-radius: 20px; z-index: 10;
        white-space: nowrap; border: 1px solid rgba(180,220,140,0.2);
    }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
    <h1>🌳 The Old Oak</h1>
    <p><b>Drag to rotate</b> the view. Grab any platform and pull it <b>up or down</b> along the trunk — the bridges and ladders follow, and your layout is still here when you come back.</p>
    <button id="resetBtn">Reset platform heights</button>
</div>
<div id="hint">Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Drag platforms vertically</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
    var container = document.getElementById('app');
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fcbe8);
    scene.fog = new THREE.Fog(0x9fcbe8, 50, 160);

    var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(10, 6.5, 11);
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.6, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 4;
    controls.maxDistance = 60;
    controls.maxPolarAngle = Math.PI * 0.55;

    // ---------- Daylight ----------
    var sun = new THREE.DirectionalLight(0xfff2d8, 1.35);
    sun.position.set(10, 14, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -6;
    sun.shadow.camera.far = 60;
    sun.shadow.bias = -0.0005;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x3d5a2e, 0.6));

    function shadowify(m) { m.castShadow = true; m.receiveShadow = true; return m; }

    // ---------- Grassy ground ----------
    function makeGrassTexture() {
        var c = document.createElement('canvas'); c.width = c.height = 256;
        var g = c.getContext('2d');
        g.fillStyle = '#5d8342'; g.fillRect(0, 0, 256, 256);
        for (var i = 0; i < 2500; i++) {
            g.fillStyle = Math.random() > 0.5 ? 'rgba(70,105,48,0.5)' : 'rgba(140,175,100,0.4)';
            g.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 3);
        }
        var t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(20, 20);
        return t;
    }
    var ground = new THREE.Mesh(
        new THREE.CircleGeometry(90, 40),
        new THREE.MeshStandardMaterial({ map: makeGrassTexture(), roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    // little rise under the tree
    var mound = shadowify(new THREE.Mesh(new THREE.SphereGeometry(3.6, 20, 12), new THREE.MeshStandardMaterial({ color: 0x557a3c, roughness: 1 })));
    mound.scale.set(1, 0.16, 1);
    mound.position.y = -0.05;
    scene.add(mound);
    // ---------- ONE main trunk (no second trunk), bark texture ----------
    function makeBarkTexture() {
        var c = document.createElement('canvas'); c.width = 256; c.height = 512;
        var g = c.getContext('2d');
        g.fillStyle = '#6a4c30'; g.fillRect(0, 0, 256, 512);
        for (var i = 0; i < 60; i++) {
            g.strokeStyle = 'rgba(' + (Math.random() > 0.5 ? '50,34,18' : '110,84,55') + ',' + (0.2 + Math.random() * 0.35) + ')';
            g.lineWidth = 1.5 + Math.random() * 4;
            var x = Math.random() * 256;
            g.beginPath();
            g.moveTo(x, -10);
            g.bezierCurveTo(x + (Math.random() - 0.5) * 30, 170, x + (Math.random() - 0.5) * 30, 340, x + (Math.random() - 0.5) * 20, 522);
            g.stroke();
        }
        var t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3, 2);
        return t;
    }
    var barkMat = new THREE.MeshStandardMaterial({ map: makeBarkTexture(), roughness: 0.95 });
    var trunk = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.62, 10.5, 18), barkMat));
    trunk.position.y = 5.25;
    scene.add(trunk);
    // root flares gripping the mound
    for (var r = 0; r < 6; r++) {
        var a = (r / 6) * Math.PI * 2;
        var root = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.22, 1.4, 8), barkMat));
        root.position.set(Math.cos(a) * 0.55, 0.35, Math.sin(a) * 0.55);
        root.rotation.set(Math.sin(a) * 0.7, 0, -Math.cos(a) * 0.7);
        scene.add(root);
    }
    // branches near the top
    var leafMatA = new THREE.MeshStandardMaterial({ color: 0x4e7a36, roughness: 1 });
    var leafMatB = new THREE.MeshStandardMaterial({ color: 0x5d8a40, roughness: 1 });
    var branchData = [
        { a: 0.5, y: 7.6, len: 2.6 }, { a: 2.4, y: 8.4, len: 2.2 }, { a: 4.2, y: 8.0, len: 2.4 }
    ];
    branchData.forEach(function (b, i) {
        var br = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.14, b.len, 8), barkMat));
        br.position.set(Math.cos(b.a) * (b.len / 2) * 0.9, b.y, Math.sin(b.a) * (b.len / 2) * 0.9);
        br.rotation.set(Math.sin(b.a) * 1.1, 0, Math.cos(b.a) * 1.1);
        scene.add(br);
        var foliage = shadowify(new THREE.Mesh(new THREE.SphereGeometry(1.3 + (i % 2) * 0.3, 12, 9), i % 2 ? leafMatA : leafMatB));
        foliage.position.set(Math.cos(b.a) * b.len * 0.85, b.y + 0.7, Math.sin(b.a) * b.len * 0.85);
        foliage.scale.y = 0.75;
        scene.add(foliage);
    });
    // crown foliage above
    var crown = shadowify(new THREE.Mesh(new THREE.SphereGeometry(2.4, 14, 10), leafMatA));
    crown.position.set(0, 10.6, 0);
    crown.scale.y = 0.8;
    scene.add(crown);
    var crown2 = shadowify(new THREE.Mesh(new THREE.SphereGeometry(1.7, 12, 9), leafMatB));
    crown2.position.set(1.2, 9.8, 0.8);
    scene.add(crown2);
    // ---------- Three platforms: different heights, different sides ----------
    var DEFAULT_HEIGHTS = [2.3, 4.1, 5.9];
    var OFFSET_ANGLES = [0.35, 2.55, 4.65]; // radians around the trunk: all different sides
    var PLAT_R = 1.5;                       // platform deck radius
    var plankMat = new THREE.MeshStandardMaterial({ color: 0xa87c4e, roughness: 0.8 });
    var plankMat2 = new THREE.MeshStandardMaterial({ color: 0x966e44, roughness: 0.85 });
    var beamMat = new THREE.MeshStandardMaterial({ color: 0x6e4c28, roughness: 0.9 });
    var railWood = new THREE.MeshStandardMaterial({ color: 0x8a6238, roughness: 0.85 });

    var platforms = [];
    function buildPlatform(idx, angle, y) {
        var g = new THREE.Group();
        var dirX = Math.cos(angle), dirZ = Math.sin(angle);
        g.position.set(dirX * (PLAT_R * 0.55), y, dirZ * (PLAT_R * 0.55));
        // deck: separate planks with visible gaps (board divisions)
        var nPlanks = 9;
        for (var i = 0; i < nPlanks; i++) {
            var off = (i - (nPlanks - 1) / 2) * (PLAT_R * 2 / nPlanks);
            var len = 2 * Math.sqrt(Math.max(0.1, PLAT_R * PLAT_R - off * off));
            var plank = shadowify(new THREE.Mesh(new THREE.BoxGeometry(len, 0.07, PLAT_R * 2 / nPlanks - 0.035), i % 2 ? plankMat : plankMat2));
            plank.position.set(0, 0, off);
            plank.rotation.y = -angle; // planks aligned across the radial direction
            g.add(plank);
        }
        // rim band around the deck edge
        var rim = shadowify(new THREE.Mesh(new THREE.TorusGeometry(PLAT_R * 0.97, 0.045, 8, 24), beamMat));
        rim.rotation.x = Math.PI / 2;
        rim.position.y = -0.02;
        g.add(rim);
        // support beams visibly joining platform to the trunk
        var joinLen = PLAT_R * 0.9;
        var beam1 = shadowify(new THREE.Mesh(new THREE.BoxGeometry(joinLen, 0.12, 0.12), beamMat));
        beam1.position.set(-dirX * joinLen * 0.5, -0.16, -dirZ * joinLen * 0.5);
        beam1.rotation.y = -angle;
        g.add(beam1);
        var beam2 = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, joinLen), beamMat));
        beam2.position.set(-dirX * joinLen * 0.5, -0.30, -dirZ * joinLen * 0.5);
        beam2.rotation.y = -angle;
        g.add(beam2);
        // diagonal knee brace down to the trunk
        var brace = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, joinLen * 1.15, 8), beamMat));
        brace.position.set(-dirX * joinLen * 0.42, -0.5, -dirZ * joinLen * 0.42);
        brace.rotation.z = Math.cos(angle) * 0.0;
        brace.lookAt(new THREE.Vector3(-dirX * joinLen, -1.05, -dirZ * joinLen).add(g.position));
        brace.rotateX(Math.PI / 2);
        g.add(brace);
        // low railing posts + top rail on the outer arc
        for (var p = 0; p < 7; p++) {
            var pa = angle - 1.05 + (p / 6) * 2.1;
            var px = Math.cos(pa) * PLAT_R * 0.88 - dirX * 0.0;
            var pz = Math.sin(pa) * PLAT_R * 0.88;
            var post = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.55, 0.05), railWood));
            post.position.set(px - dirX * 0.0, 0.30, pz);
            g.add(post);
        }
        var railArc = shadowify(new THREE.Mesh(new THREE.TorusGeometry(PLAT_R * 0.88, 0.028, 6, 20, 2.1), railWood));
        railArc.rotation.x = Math.PI / 2;
        railArc.rotation.z = -(angle - 1.05) - 2.1 + Math.PI;
        railArc.position.y = 0.58;
        g.add(railArc);
        scene.add(g);
        platforms.push({ group: g, angle: angle, y: y, idx: idx });
        return g;
    }
    // restore saved heights (100% of the arrangement persists)
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('oldOak.heights')); } catch (e) { saved = null; }
    var heights = (saved && saved.length === 3 && saved.every(function (h) { return h >= 1.2 && h <= 8.6; })) ? saved : DEFAULT_HEIGHTS.slice();
    // guarantee distinct levels even from a hand-edited save
    heights.sort(function (a, b) { return a - b; });
    for (var pi = 0; pi < 3; pi++) buildPlatform(pi, OFFSET_ANGLES[pi], heights[pi]);
    // hut on the top platform for charm
    (function () {
        var top = platforms[2].group;
        var hut = new THREE.Group();
        var wallMat = new THREE.MeshStandardMaterial({ color: 0xc9a878, roughness: 0.85 });
        var roofMat = new THREE.MeshStandardMaterial({ color: 0x8a4f35, roughness: 0.8 });
        var walls = shadowify(new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.85, 1.0), wallMat));
        walls.position.y = 0.46;
        hut.add(walls);
        var roofA = shadowify(new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.07, 0.72), roofMat));
        roofA.position.set(0, 1.12, 0.27);
        roofA.rotation.x = 0.62;
        hut.add(roofA);
        var roofB = shadowify(new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.07, 0.72), roofMat));
        roofB.position.set(0, 1.12, -0.27);
        roofB.rotation.x = -0.62;
        hut.add(roofB);
        var doorH = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.55, 0.04), new THREE.MeshStandardMaterial({ color: 0x5d3f26, roughness: 0.9 }));
        doorH.position.set(0.1, 0.32, 0.51);
        hut.add(doorH);
        var winH = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.04), new THREE.MeshStandardMaterial({ color: 0xbfe0f0, roughness: 0.15, metalness: 0.4 }));
        winH.position.set(-0.3, 0.5, 0.51);
        hut.add(winH);
        hut.position.set(-Math.cos(platforms[2].angle) * 0.5, 0.04, -Math.sin(platforms[2].angle) * 0.5);
        hut.rotation.y = -platforms[2].angle;
        top.add(hut);
    })();
    // ---------- Rope bridge (P0 <-> P1) and ladder (P1 <-> P2), rebuilt every frame ----------
    var ropeMat = new THREE.LineBasicMaterial({ color: 0xb59a6a }); // hemp: distinct from the decking
    var slatMat = new THREE.MeshStandardMaterial({ color: 0x8a6238, roughness: 0.9 });
    var N_SLATS = 14;
    var slats = [];
    for (var si = 0; si < N_SLATS; si++) {
        var slat = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.035, 0.5), slatMat));
        scene.add(slat);
        slats.push(slat);
    }
    var ropeL = new THREE.Line(new THREE.BufferGeometry(), ropeMat);
    var ropeR = new THREE.Line(new THREE.BufferGeometry(), ropeMat);
    var ropeDeckL = new THREE.Line(new THREE.BufferGeometry(), ropeMat);
    var ropeDeckR = new THREE.Line(new THREE.BufferGeometry(), ropeMat);
    scene.add(ropeL, ropeR, ropeDeckL, ropeDeckR);

    function edgePoint(plat, toward, lift) {
        // deck edge of plat facing the point 'toward'
        var c = plat.group.position;
        var d = new THREE.Vector3(toward.x - c.x, 0, toward.z - c.z).normalize();
        return new THREE.Vector3(c.x + d.x * PLAT_R * 0.92, plat.y + 0.06 + (lift || 0), c.z + d.z * PLAT_R * 0.92);
    }
    var _A = new THREE.Vector3(), _B = new THREE.Vector3(), _M = new THREE.Vector3(), _P = new THREE.Vector3(), _T = new THREE.Vector3();
    function updateBridge() {
        var p0 = platforms[0], p1 = platforms[1];
        _A.copy(edgePoint(p0, p1.group.position));
        _B.copy(edgePoint(p1, p0.group.position));
        _M.lerpVectors(_A, _B, 0.5);
        _M.y = Math.min(_A.y, _B.y) - Math.max(0.35, _A.distanceTo(_B) * 0.16); // walkway sags below mid-span
        var curve = new THREE.QuadraticBezierCurve3(_A, _M, _B);
        var side = new THREE.Vector3().subVectors(_B, _A);
        var yaw = Math.atan2(side.x, side.z);
        var lat = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        var ptsHandL = [], ptsHandR = [], ptsDeckL = [], ptsDeckR = [];
        for (var i = 0; i < N_SLATS; i++) {
            var tt = (i + 0.5) / N_SLATS;
            curve.getPoint(tt, _P);
            slats[i].position.copy(_P);
            curve.getTangent(tt, _T);
            slats[i].rotation.set(0, Math.atan2(_T.x, _T.z), 0);
            slats[i].rotation.x = -Math.asin(_T.y) * 0.8;
        }
        for (var j = 0; j <= 16; j++) {
            var t2 = j / 16;
            curve.getPoint(t2, _P);
            ptsDeckL.push(new THREE.Vector3(_P.x + lat.x * 0.26, _P.y + 0.02, _P.z + lat.z * 0.26));
            ptsDeckR.push(new THREE.Vector3(_P.x - lat.x * 0.26, _P.y + 0.02, _P.z - lat.z * 0.26));
            // hand ropes sag slightly less, raised above the deck line
            var handY = _P.y + 0.55 + Math.sin(t2 * Math.PI) * 0.08;
            ptsHandL.push(new THREE.Vector3(_P.x + lat.x * 0.26, handY, _P.z + lat.z * 0.26));
            ptsHandR.push(new THREE.Vector3(_P.x - lat.x * 0.26, handY, _P.z - lat.z * 0.26));
        }
        ropeL.geometry.setFromPoints(ptsHandL);
        ropeR.geometry.setFromPoints(ptsHandR);
        ropeDeckL.geometry.setFromPoints(ptsDeckL);
        ropeDeckR.geometry.setFromPoints(ptsDeckR);
    }

    // ladder: two side rails + separate rungs, following the platforms
    var ladderMat = new THREE.MeshStandardMaterial({ color: 0x7a5836, roughness: 0.85 });
    var railGeo = new THREE.CylinderGeometry(0.035, 0.035, 1, 8);
    var ladderRails = [shadowify(new THREE.Mesh(railGeo, ladderMat)), shadowify(new THREE.Mesh(railGeo, ladderMat))];
    var ladderRungs = [];
    for (var lr = 0; lr < 6; lr++) ladderRungs.push(shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.46, 8), ladderMat)));
    ladderRails.forEach(function (r) { scene.add(r); });
    ladderRungs.forEach(function (r) { scene.add(r); });
    var _dir = new THREE.Vector3(), _side = new THREE.Vector3(), _mid = new THREE.Vector3();
    function updateLadder() {
        var p1 = platforms[1], p2 = platforms[2];
        _A.copy(edgePoint(p1, p2.group.position));
        _B.copy(edgePoint(p2, p1.group.position));
        _A.y = p1.y + 0.05; _B.y = p2.y + 0.02;
        _dir.subVectors(_B, _A);
        var len = _dir.length();
        _side.crossVectors(_dir, new THREE.Vector3(0, 1, 0)).normalize();
        if (_side.lengthSq() < 0.01) _side.set(1, 0, 0);
        _side.multiplyScalar(0.25);
        for (var rI = 0; rI < 2; rI++) {
            var off = rI === 0 ? _side : _side.clone().negate();
            var rail = ladderRails[rI];
            _mid.lerpVectors(_A, _B, 0.5).add(off);
            rail.position.copy(_mid);
            rail.scale.set(1, len, 1);
            rail.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), _dir.clone().normalize());
        }
        for (var gI = 0; gI < ladderRungs.length; gI++) {
            var t3 = 0.10 + (gI / (ladderRungs.length - 1)) * 0.80;
            var rp = new THREE.Vector3().lerpVectors(_A, _B, t3);
            ladderRungs[gI].position.copy(rp);
            ladderRungs[gI].quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), _side.clone().normalize());
        }
    }
    // ---------- Drag platforms up/down + persistence ----------
    var raycaster = new THREE.Raycaster();
    var pointer = new THREE.Vector2();
    var dragIdx = -1, dragStartY = 0, dragPointerStartY = 0;
    var MIN_H = 1.2, MAX_H = 8.6, MIN_GAP = 1.0;

    function saveHeights() {
        var hs = platforms.map(function (p) { return Math.round(p.y * 100) / 100; });
        try { localStorage.setItem('oldOak.heights', JSON.stringify(hs)); } catch (e) {}
    }
    function clampWithNeighbors(idx, y) {
        y = Math.max(MIN_H, Math.min(MAX_H, y));
        for (var i = 0; i < platforms.length; i++) {
            if (i === idx) continue;
            var other = platforms[i].y;
            if (Math.abs(y - other) < MIN_GAP) {
                y = other + (y > other ? MIN_GAP : -MIN_GAP);
            }
        }
        return Math.max(MIN_H, Math.min(MAX_H, y));
    }
    function setPointer(ev) {
        var cx = ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0].clientX);
        var cy = ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0].clientY);
        pointer.x = (cx / window.innerWidth) * 2 - 1;
        pointer.y = -(cy / window.innerHeight) * 2 + 1;
        return { x: cx, y: cy };
    }
    function platformMeshes() {
        var arr = [];
        platforms.forEach(function (p) { p.group.traverse(function (o) { if (o.isMesh) arr.push(o); }); });
        return arr;
    }
    renderer.domElement.addEventListener('pointerdown', function (ev) {
        setPointer(ev);
        raycaster.setFromCamera(pointer, camera);
        var hits = raycaster.intersectObjects(platformMeshes(), false);
        if (hits.length > 0) {
            var obj = hits[0].object;
            for (var i = 0; i < platforms.length; i++) {
                var found = false;
                platforms[i].group.traverse(function (o) { if (o === obj) found = true; });
                if (found) {
                    dragIdx = i;
                    dragStartY = platforms[i].y;
                    dragPointerStartY = ev.clientY;
                    controls.enabled = false;
                    renderer.domElement.style.cursor = 'ns-resize';
                    ev.preventDefault();
                    break;
                }
            }
        }
    });
    window.addEventListener('pointermove', function (ev) {
        if (dragIdx >= 0) {
            var dy = dragPointerStartY - ev.clientY;
            var worldDelta = dy * 0.018; // screen drag -> vertical world movement
            var newY = clampWithNeighbors(dragIdx, dragStartY + worldDelta);
            platforms[dragIdx].y = newY;
            platforms[dragIdx].group.position.y = newY;
            saveHeights();
        } else {
            setPointer(ev);
            raycaster.setFromCamera(pointer, camera);
            var hits = raycaster.intersectObjects(platformMeshes(), false);
            renderer.domElement.style.cursor = hits.length ? 'ns-resize' : 'grab';
        }
    });
    window.addEventListener('pointerup', function () {
        if (dragIdx >= 0) {
            dragIdx = -1;
            controls.enabled = true;
            renderer.domElement.style.cursor = 'grab';
            saveHeights();
        }
    });
    // reset button: restore defaults and forget the saved layout
    document.getElementById('resetBtn').addEventListener('click', function () {
        try { localStorage.removeItem('oldOak.heights'); } catch (e) {}
        for (var i = 0; i < 3; i++) {
            platforms[i].y = DEFAULT_HEIGHTS[i];
            platforms[i].group.position.y = DEFAULT_HEIGHTS[i];
        }
    });
    // ---------- Animation ----------
    var clock = new THREE.Clock();
    var t = 0;
    function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.05);
        t += dt;

        // bridge + ladder always follow the platforms
        updateBridge();
        updateLadder();

        // foliage breathes in the wind
        crown.rotation.y = Math.sin(t * 0.3) * 0.02;
        crown2.rotation.y = Math.cos(t * 0.4) * 0.03;

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // ---------- Resize ----------
    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>
</body>
</html>
