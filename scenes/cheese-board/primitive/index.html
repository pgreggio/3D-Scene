<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>
<title>The Evening Board · Primitive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    :root { --gold: #d4ab5f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Jost', 'Segoe UI', Arial, sans-serif; background: #16100b; color: #f4ead6; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }
    .panel {
        position: absolute; z-index: 10;
        background: rgba(27,20,14,.74);
        border: 1px solid rgba(212,171,95,.30);
        backdrop-filter: blur(7px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    #hud {
        left: 26px; top: 24px;
        width: 318px;
        padding: 18px 20px 16px;
        border-radius: 14px;
    }
    .hud-head { display: flex; align-items: center; gap: 11px; }
    .mark { display: block; flex: none; }
    #hud h1 {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
        font-size: 29px;
        letter-spacing: 0.2px;
        color: #f7e6c2;
        line-height: 1.1;
    }
    #hud .tagline {
        margin-top: 8px;
        font-size: 13px;
        font-weight: 300;
        color: #cdbd9f;
        line-height: 1.55;
    }
    .legend {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(212,171,95,.30);
    }
    .legendRow {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px;
        font-size: 13.5px;
        color: #f4ead6;
        padding: 3.5px 0;
    }
    .legendName { display: flex; align-items: center; gap: 9px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
    .legendDesc { font-size: 12px; font-weight: 300; color: #cdbd9f; }
    #knifeControl {
        left: 26px; bottom: 26px;
        display: flex; align-items: center; gap: 10px;
        padding: 10px 16px 10px 13px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 13.5px;
        color: #f4ead6;
        cursor: pointer;
        transition: border-color .25s ease;
        -webkit-appearance: none; appearance: none;
    }
    #knifeControl:hover { border-color: rgba(212,171,95,.65); }
    .knifeDivider { width: 1px; height: 16px; background: rgba(212,171,95,.30); flex: none; }
    .knifeCount { color: var(--gold); font-variant-numeric: tabular-nums; }
    #orbitHint {
        right: 26px; bottom: 26px;
        display: flex; align-items: center; gap: 9px;
        padding: 9px 15px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 300;
        color: #cdbd9f;
    }
    .icon { display: block; flex: none; }
    .icon path { fill: var(--gold); }
    .icon circle, .icon ellipse { stroke: var(--gold); }
    @media (max-width: 640px) {
        #hud { left: 12px; right: 12px; top: 12px; width: auto; padding: 10px 12px; }
        #hud h1 { font-size: 21px; }
        .mark { width: 24px; height: 24px; }
        #hud .tagline { margin-top: 5px; font-size: 11px; }
        .legend { margin-top: 8px; padding-top: 8px; }
        .legendRow { padding: 2px 0; font-size: 12px; }
        .legendDesc { font-size: 11px; }
        #orbitHint { display: none; }
        #knifeControl { left: 50%; bottom: 12px; transform: translateX(-50%); white-space: nowrap; }
    }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud" class="panel">
    <div class="hud-head">
        <svg class="mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M3 22.5 27.5 9.5c.9 2.6 1.4 5.3 1.4 8.1v6.9H3Z" fill="#e8c476"/>
            <path d="M3 22.5 27.5 9.5l-4-2.3L3 22.5Z" fill="#b98a3e"/>
            <circle cx="12" cy="20.6" r="1.6" fill="#b98a3e"/><circle cx="20.5" cy="19" r="2.1" fill="#b98a3e"/><circle cx="24.6" cy="22.6" r="1.1" fill="#b98a3e"/>
            <path d="M3 24.5h25.9" stroke="#8e6a2f" stroke-width="1.2"/>
        </svg>
        <h1>The Evening Board</h1>
    </div>
    <p class="tagline">Oiled olive wood with four cheeses, walnuts and a glossy bunch of grapes. Take a turn around the board.</p>
    <div class="legend">
        <div class="legendRow"><span class="legendName"><span class="swatch" style="background:#e7c77e"></span>Aged wedge</span><span class="legendDesc">hard, crumbly</span></div>
        <div class="legendRow"><span class="legendName"><span class="swatch" style="background:#f2eee2"></span>Bloomy round</span><span class="legendDesc">soft, white rind</span></div>
        <div class="legendRow"><span class="legendName"><span class="swatch" style="background:linear-gradient(135deg,#ece2c6 45%,#4e6c70 46% 60%,#ece2c6 61%)"></span>Blue</span><span class="legendDesc">cut veining</span></div>
        <div class="legendRow"><span class="legendName"><span class="swatch" style="background:#d8d4cb"></span>Goat log</span><span class="legendDesc">ash rind</span></div>
    </div>
</div>
<button id="knifeControl" class="panel" type="button">
    <svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 17.2 14.6 5.6c1.2-1.2 3.4-1.4 4.8-.3L7.9 16.8Z" fill="#d9dde0"/>
        <path d="M7.9 16.8 4.6 20.1c-.7.7-1.9.7-2.6 0s-.7-1.9 0-2.6l1-1" stroke="#8a4a2a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <circle cx="4.7" cy="18.4" r=".6" fill="#e2b85a"/>
    </svg>
    <span><b>Click the knife</b> to slice the goat log</span>
    <span id="knifeCount" class="knifeCount" style="margin-left:6px;padding-left:11px;border-left:1px solid rgba(212,171,95,.30)">0 / 2</span>
</button>
<div id="orbitHint" class="panel">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#d4ab5f" stroke-width="1.7" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>
    <span>Drag to walk around · scroll to lean in</span>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
(function () {
    const mount = document.getElementById('app');

    // ---------- render surface ----------
    const gpu = new THREE.WebGLRenderer({
        antialias: false,
        powerPreference: 'high-performance'
    });
    gpu.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
    gpu.setSize(window.innerWidth, window.innerHeight);
    gpu.shadowMap.enabled = true;
    gpu.shadowMap.type = THREE.PCFSoftShadowMap;
    gpu.shadowMap.autoUpdate = false;
    gpu.toneMapping = THREE.ACESFilmicToneMapping;
    gpu.toneMappingExposure = 0.96;
    gpu.outputColorSpace = THREE.SRGBColorSpace;
    mount.appendChild(gpu.domElement);

    const world = new THREE.Scene();
    world.background = new THREE.Color(0x1a130d);
    const envProbe = new THREE.PMREMGenerator(gpu);
    world.environment = envProbe.fromScene(new RoomEnvironment(), 0.04).texture;

    // ---------- lens framing (45 mm lens, 36 mm sensor, 16:9 fit) ----------
    const FOCAL_LEN = 45;
    const SENSOR_W = 36;
    const FOV_GAIN = 1.55;
    function readyFov() {
        const horizHalf = Math.atan(FOV_GAIN * (SENSOR_W / 2) / FOCAL_LEN);
        const vertHalfWide = Math.atan(FOV_GAIN * (SENSOR_W * 9 / 16 / 2) / FOCAL_LEN);
        const ratio = window.innerWidth / window.innerHeight;
        const vertHalf = Math.max(vertHalfWide, Math.atan(Math.tan(horizHalf) / ratio));
        return 2 * vertHalf * 180 / Math.PI;
    }

    const cam = new THREE.PerspectiveCamera(readyFov(), window.innerWidth / window.innerHeight, 0.02, 40);
    const aimSource = new THREE.Vector3(0.02, 0.8, 0.04);
    const eyeSource = new THREE.Vector3(0.94, 1.5, 1.26);
    const eyePull = eyeSource.clone().sub(aimSource).multiplyScalar(1.12).add(aimSource);
    cam.position.copy(eyePull);

    const orbit = new OrbitControls(cam, gpu.domElement);
    orbit.target.set(0.02, 1.11, -0.08);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.07;
    orbit.minDistance = 0.45;
    orbit.maxDistance = 2.15;
    orbit.minPolarAngle = 18 * Math.PI / 180;
    orbit.maxPolarAngle = 78 * Math.PI / 180;
    orbit.minAzimuthAngle = -5 * Math.PI / 180;
    orbit.maxAzimuthAngle = 85 * Math.PI / 180;
    orbit.enablePan = false;
    orbit.update();
    window.__shot = { camera: cam, controls: orbit };

    // ---------- lighting rig ----------
    const sparkDir = new THREE.Vector3(1, 0.95, 0.5).normalize();
    const spark = new THREE.DirectionalLight(new THREE.Color(1, 0.76, 0.5), 4.4);
    spark.position.copy(new THREE.Vector3(0, 0.7665, 0.05)).addScaledVector(sparkDir, 4);
    spark.castShadow = true;
    spark.shadow.mapSize.set(2048, 2048);
    spark.shadow.camera.left = -1.4;
    spark.shadow.camera.right = 1.4;
    spark.shadow.camera.top = 1.4;
    spark.shadow.camera.bottom = -1.4;
    spark.shadow.camera.near = 0.5;
    spark.shadow.camera.far = 9;
    spark.shadow.bias = -0.00020;
    spark.shadow.normalBias = 0.0035;
    spark.shadow.radius = 3;
    world.add(spark);
    world.add(spark.target);
    spark.target.position.set(0, 0.7665, 0.05);
    world.add(new THREE.HemisphereLight(0xd6cfc2, 0x3a2718, 0.22));
    const wash = new THREE.DirectionalLight(0xd2c7b6, 0.28);
    wash.position.set(-2, 2.2, 1.5);
    world.add(wash);

    // ---------- shared procedural surface core ----------
    const FRACTAL_SRC = `
    float pseudo(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
    vec3 multiHash(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
    float noise3(vec3 p){vec3 i=floor(p),f=fract(p);vec3 u=f*f*(3.-2.*f);
     return mix(mix(mix(pseudo(i),pseudo(i+vec3(1,0,0)),u.x),mix(pseudo(i+vec3(0,1,0)),pseudo(i+vec3(1,1,0)),u.x),u.y),
                mix(mix(pseudo(i+vec3(0,0,1)),pseudo(i+vec3(1,0,1)),u.x),mix(pseudo(i+vec3(0,1,1)),pseudo(i+vec3(1,1,1)),u.x),u.y),u.z);}
    float grainW=0.;
    float detailFade(float f){return 1.-smoothstep(.25,.75,grainW*f);}
    float fbmCalc(vec3 p){float a=.5,s=0.,f=1.;for(int i=0;i<5;i++){s+=a*mix(.5,noise3(p),detailFade(f));p=p*2.03+17.1;a*=.5;f*=2.03;}return s;}
    float fbmLite(vec3 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*noise3(p);p=p*2.03+17.1;a*=.5;}return s;}
    float ridgeCalc(vec3 p){float a=.5,s=0.,f=1.;for(int i=0;i<4;i++){s+=a*mix(.62,1.-abs(noise3(p)*2.-1.),detailFade(f));p=p*2.1+9.3;a*=.5;f*=2.1;}return s;}
    float valueBand(vec3 p,float f){return mix(.5,noise3(p*f),detailFade(f));}
    vec2 cells(vec3 p){vec3 i=floor(p),f=fract(p);float d1=8.,d2=8.;
     for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec3 g=vec3(x,y,z);vec3 r=g+multiHash(i+g)-f;float d=dot(r,r);
      if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}return vec2(sqrt(d1),sqrt(d2));}
    `;
    // one dress recipe per family, driven by metres of object space
    const DRESS_SRC = `
    uniform vec3 uColA; uniform vec3 uColB; uniform vec3 uColC;
    uniform float uTiling; uniform float uEtch; uniform float uRoughLo; uniform float uRoughHi; uniform float uShift; uniform float uPin;
    void dress(vec3 land, out vec3 paintColour, out float smoothness, out float relief){
     vec3 px=land*uTiling+uShift; paintColour=uColA; smoothness=uRoughLo; relief=0.; grainW=length(fwidth(px));

    #if SU==0
     {
      float streak=fbmCalc(px*vec3(.22,1.1,1.1))*2.6;
      float meridian=px.y+px.z*.6+streak;
      float shimmer=sin(meridian*6.2+fbmCalc(px*vec3(.15,.7,.7))*5.);
      float grainLine=smoothstep(.62,.99,shimmer)*(.35+.65*fbmCalc(px*vec3(.6,2.,2.)));
      float speckle=smoothstep(.82,1.,sin(meridian*31.+streak*3.));
      float pinhole=mix(.5,noise3(px*vec3(3.,160.,160.)),detailFade(160.));
      paintColour=mix(uColA,uColB,smoothstep(.25,.8,fbmCalc(px*.7)));
      paintColour=mix(paintColour,uColC,clamp(grainLine*.92+speckle*.32,0.,1.));
      paintColour*=.92+.16*pinhole;
      smoothness=mix(uRoughLo,uRoughHi,fbmCalc(px*3.));
      relief=-grainLine*.5-speckle*.4+pinhole*.35;
     }
    #endif
    #if SU==1
     {
      float grainPatch=fbmCalc(px*vec3(.4,9.,9.)+fbmCalc(px)*2.);
      float scuff=fbmCalc(px*1.6+3.)*.8+.2*valueBand(px,22.)+.12*valueBand(px,70.);
      float flaking=smoothstep(uPin,uPin+.02,scuff);
      vec3 enamel=uColA*(.9+.2*fbmCalc(px*6.));
      vec3 timber=mix(uColB,uColC,grainPatch);
      paintColour=mix(enamel,timber,flaking);
      paintColour*=.94+.08*noise3(px*vec3(2.,40.,40.));
      smoothness=mix(uRoughLo,uRoughHi,flaking);
      relief=-flaking*.6+grainPatch*.25+.15*valueBand(px,30.);
     }
    #endif
    #if SU==2
     {
      float wash=fbmCalc(px);
      float freckle=fbmCalc(px*6.+4.);
      paintColour=mix(uColA,uColB,smoothstep(.3,.75,wash))*(.95+.1*freckle);
      smoothness=uRoughLo;
      relief=freckle*.8+valueBand(px,40.)*.3;
     }
    #endif
    #if SU==3
     {
      float lath=floor(px.y*4.);
      float jumble=pseudo(vec3(lath,1.,2.));
      float grainNode=fbmCalc(vec3(px.x*.5+jumble*9.,px.y*30.,px.z*30.)+fbmCalc(px*2.)*2.);
      float slit=smoothstep(.0,.03,fract(px.y*4.))*smoothstep(1.,.97,fract(px.y*4.));
      float butt=smoothstep(0.,.01,fract(px.x*.35+jumble));
      paintColour=mix(uColA,uColB,grainNode)*(.8+.35*jumble)*mix(.45,1.,slit*butt);
      smoothness=mix(uRoughLo,uRoughHi,grainNode);
      relief=grainNode*.6+slit*butt*.4;
     }
    #endif
    #if SU==4
     {
      vec2 chunk=cells(px);
      float crack=smoothstep(.0,.08,chunk.y-chunk.x);
      vec2 pitZone=cells(px*1.9+5.);
      float cavity=smoothstep(.16,.04,pitZone.x)*smoothstep(.45,.6,noise3(px*.9+2.))*detailFade(1.9);
      float sparkle=smoothstep(.62,.72,noise3(px*1.3+8.))*smoothstep(.22,.08,cells(px*2.2).x)*detailFade(2.2);
      paintColour=mix(uColA,uColB,fbmCalc(px*.8));
      paintColour=mix(paintColour,uColB*.92,(1.-crack)*.18+cavity*.18);
      paintColour=mix(paintColour,uColC,sparkle);
      smoothness=uRoughLo;
      relief=(crack*.6-cavity*.5+sparkle*.2)*detailFade(1.)+fbmCalc(px*3.)*.4;
     }
    #endif
    #if SU==5
     {
      float crust=fbmCalc(px);
      float fibre=mix(.25,noise3(px*vec3(40.,40.,6.))*noise3(px*vec3(6.,6.,40.)),detailFade(40.));
      paintColour=mix(uColA,uColB,smoothstep(.3,.8,crust))*(.9+.18*fibre);
      paintColour=mix(paintColour,uColC,smoothstep(.62,.8,fbmCalc(px*2.+7.))*.6);
      smoothness=uRoughLo;
      relief=crust*.5+fibre*.5;
     }
    #endif
    #if SU==6
     {
      float bloom=fbmCalc(px);
      float fuzzy=valueBand(px,18.)*.6+valueBand(px,45.)*.4;
      paintColour=mix(uColA,uColB,smoothstep(.45,.85,bloom))*(.95+.07*fuzzy);
      smoothness=uRoughLo;
      relief=fuzzy+bloom*.6;
     }
    #endif
    #if SU==7
     {
      float sweat=fbmCalc(px*1.5);
      paintColour=mix(uColA,uColB,sweat*.7);
      float meander=length(land.xy)/max(uPin,1e-4);
      paintColour=mix(paintColour,uColC,smoothstep(.84,.97,meander)*.65);
      smoothness=mix(uRoughLo,uRoughHi,sweat);
      relief=sweat*.4;
     }
    #endif
    #if SU==8
     {
      vec3 mottle=px+vec3(fbmCalc(px*.7),fbmCalc(px*.7+3.),fbmCalc(px*.7+7.))*1.6;
      float threadA=ridgeCalc(mottle*.8);
      float threadB=ridgeCalc(mottle*1.9+11.);
      float streak=smoothstep(.66,.84,threadA)*(.6+.4*fbmCalc(px*2.))+smoothstep(.74,.9,threadB)*.55;
      vec2 pocketC=cells(px*1.3+3.);
      float hollow=smoothstep(.14,.05,pocketC.x)*smoothstep(.6,.7,noise3(px*.8+5.))*smoothstep(.4,.7,threadA)*detailFade(1.3);
      paintColour=mix(uColA,uColB*.95,fbmCalc(px*.6)*.4);
      paintColour=mix(paintColour,uColC,clamp(streak+hollow,0.,1.));
      smoothness=mix(uRoughLo,uRoughHi,clamp(streak,0.,1.));
      relief=-streak*.5-hollow*.9+fbmCalc(px*3.)*.3;
     }
    #endif
    #if SU==9
     {
      float splotch=fbmCalc(px);
      float mould=smoothstep(.62,.72,fbmCalc(px*2.5+9.));
      paintColour=mix(uColA,uColB,splotch)*(.92+.12*valueBand(px,20.));
      paintColour=mix(paintColour,uColC,mould*.8);
      smoothness=uRoughLo;
      relief=splotch*.6+mould*.3+valueBand(px,25.)*.3;
     }
    #endif
    #if SU==10
     {
      float rille=ridgeCalc(px*vec3(1.,1.,1.));
      float powder=smoothstep(.35,.75,fbmCalc(px*.8+2.));
      paintColour=mix(uColA,uColB,powder*.75)*(.9+.14*rille);
      smoothness=uRoughLo;
      relief=rille;
     }
    #endif
    #if SU==11
     {
      float stain=fbmCalc(px*1.3);
      paintColour=mix(uColA,uColB,stain*.5);
      float ashRing=length(land.yz)/max(uPin,1e-4);
      paintColour=mix(paintColour,uColC,smoothstep(.9,.95,ashRing)*(1.-smoothstep(.97,1.,ashRing))*.9);
      smoothness=uRoughLo;
      relief=stain*.5+valueBand(px,6.)*.3;
     }
    #endif
    #if SU==12
     {
      float fissure=ridgeCalc(px);
      float polish=fbmCalc(px*2.);
      paintColour=mix(uColB,uColA,smoothstep(.35,.85,fissure))*(.9+.2*polish);
      smoothness=mix(uRoughHi,uRoughLo,fissure);
      relief=fissure;
     }
    #endif
    #if SU==13
     {
      float bloomWax=fbmCalc(px);
      paintColour=mix(uColA,uColB,smoothstep(.3,.8,bloomWax));
      paintColour=mix(paintColour,uColC,smoothstep(.62,.9,fbmCalc(px*2.5+4.))*.35);
      smoothness=mix(uRoughLo,uRoughHi,smoothstep(.6,.9,fbmCalc(px*2.5+4.)));
      relief=bloomWax*.2;
     }
    #endif
    #if SU==14
     {
      float bark=fbmCalc(px);
      paintColour=mix(uColA,uColB,bark);
      smoothness=uRoughLo;
      relief=bark;
     }
    #endif
    #if SU==15
     {
      float satin=mix(.5,noise3(px*vec3(.6,60.,60.)),detailFade(60.))*.6+mix(.5,noise3(px*vec3(1.,160.,160.)),detailFade(160.))*.4;
      paintColour=mix(uColA,uColB,satin);
      smoothness=mix(uRoughLo,uRoughHi,satin);
      relief=satin*.4;
     }
    #endif
    #if SU==16
     {
      float ringKnot=fbmCalc(px*vec3(.5,4.,4.)+fbmCalc(px*1.2)*1.6);
      float yearRing=smoothstep(.4,.9,sin(ringKnot*18.));
      paintColour=mix(uColA,uColB,ringKnot);
      paintColour=mix(paintColour,uColC,yearRing*.35);
      smoothness=mix(uRoughLo,uRoughHi,yearRing);
      relief=yearRing*.4+ringKnot*.4;
     }
    #endif

                    (spec.reliefDisp
                        ? `uniform float uBumpDisp; uniform float uBumpRepeat; uniform float uShift;\n${FRACTAL_SRC}`

    function rumple(geometry, amount, size, salt) {
        const pts = geometry.attributes.position;
        const nrm = geometry.attributes.normal;
        for (let i = 0; i < pts.count; i++) {
            const bx = pts.getX(i) * size + salt;
            const by = pts.getY(i) * size + salt;
            const bz = pts.getZ(i) * size + salt;
            let fold = 0;
            let weight = 0.5;
            let ox = bx;
            let oy = by;
            let oz = bz;
            for (let octave = 0; octave < 4; octave++) {
                const wob = Math.sin(ox * 1.7 + oy * 1.3) * Math.cos(oy * 1.9 + oz * 1.1) * Math.sin(oz * 1.5 + ox);
                fold += weight * (1 - Math.abs(wob));
                ox = ox * 2.1 + 9.3;
                oy = oy * 2.1 + 9.3;
                oz = oz * 2.1 + 9.3;
                weight *= 0.5;
            }
            const bulge = amount * (fold - 0.55);
            pts.setXYZ(i,
                pts.getX(i) + nrm.getX(i) * bulge,
                pts.getY(i) + nrm.getY(i) * bulge,
                pts.getZ(i) + nrm.getZ(i) * bulge);
        }
        pts.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
    }

            const bulge = amount * (fold - 0.55);

                pts.getY(i) + nrm.getY(i) * bulge,

    const basisSwapBack = basisSwap.clone().invert();
    function bakeQuat(rx, ry, rz) {
        const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx * Math.PI / 180, ry * Math.PI / 180, rz * Math.PI / 180, 'ZYX'));
        return new THREE.Quaternion().multiplyQuaternions(basisSwap, q).multiply(basisSwapBack);
    }
    function wheelInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
    function hold01(x) { return Math.min(1, Math.max(0, x)); }
    function buildPoseSet(centerX) {
        const cutX = centerX;
        const poses = [
            { t: 0.00, p: [-0.175, -0.152, 0.0081], r: [0, 0, 0] },
            { t: 0.70, p: [-0.150, -0.120, 0.110], r: [25, -10, 15] },
            { t: 1.60, p: [cutX, 0.196, 0.095], r: [90, 0, -90] },
            { t: 1.95, p: [cutX, 0.196, 0.0598], r: [90, 0, -90] },
            { t: 3.25, p: [cutX, 0.196, 0.0098], r: [90, 0, -90] },
            { t: 3.55, p: [cutX, 0.196, 0.0098], r: [90, 0, -90] },
            { t: 4.05, p: [cutX, 0.205, 0.080], r: [90, 0, -90] },
            { t: 5.05, p: [-0.150, -0.125, 0.095], r: [20, -6, 10] },
            { t: 5.65, p: [-0.175, -0.152, 0.0081], r: [0, 0, 0] }
        ];
        poses.forEach(function (pose) {
            pose.vec = new THREE.Vector3(pose.p[0], pose.p[2], -pose.p[1]);
            pose.orient = bakeQuat(pose.r[0], pose.r[1], pose.r[2]);
        });
        return poses;
    }
    function readPose(elapsed) {
        let at = 0;
        while (at < poseTable.length - 2 && elapsed > poseTable[at + 1].t) at++;
        const from = poseTable[at];
        const toward = poseTable[at + 1];
        const span = toward.t - from.t;
        const raw = span > 0 ? hold01((elapsed - from.t) / span) : 0;
        const eased = (at === 3) ? raw : wheelInOut(raw);
        const place = new THREE.Vector3().lerpVectors(from.vec, toward.vec, eased);
        const facing = new THREE.Quaternion().slerpQuaternions(from.orient, toward.orient, eased);
        if (at === 3) {
            place.z -= 0.010 * Math.sin(raw * Math.PI * 2 * 3);
        }
        return { place: place, facing: facing };
    }
    function restoreChunks() {
        logChunks.forEach(function (chunk, k) {
            chunk.position.set(sliceMid(k), GOAT_R, -0.143);
            chunk.quaternion.identity();
        });
        slicesTaken = 0;
        sliceCounter.textContent = '0 / 2';
    }
    function swingChunk(elapsed) {
        const chunk = logChunks[activeSlice];
        const thickness = GOAT_SLICE;
        const radius = GOAT_R;
        const gapY = 0.143;
        const pivotX = GOAT_END - thickness * activeSlice;
        const chunkCenter = pivotX - thickness / 2;
        const start = 3.28;
        const finish = 3.80;
        if (elapsed < start) {
            chunk.position.set(chunkCenter, radius, -gapY);
            chunk.quaternion.identity();
            return;
        }
        const lift = Math.min(1, (elapsed - start) / (finish - start));
        const easedLift = lift * lift;
        const swing = (Math.PI / 2) * easedLift;
        const backShove = -thickness / 2;
        const sideShift = radius;
        const spotX = pivotX + backShove * Math.cos(swing) + sideShift * Math.sin(swing);
        const spotZ = -backShove * Math.sin(swing) + sideShift * Math.cos(swing) + activeSlice * thickness * easedLift;
        const drift = 0.004 * easedLift * (activeSlice % 2 ? -1 : 1);
        chunk.position.set(spotX, spotZ, -(gapY + drift));
        chunk.quaternion.copy(bakeQuat(0, swing * 180 / Math.PI, 0));
    }
    function advanceCut(elapsed) {
        if (!knifeBusy) return;
        if (elapsed >= CUT_DURATION) {
            slicesTaken++;
            sliceCounter.textContent = slicesTaken + ' / 2';
            lastCutEnd = clockNow;
            knifeBusy = false;
            knife.position.copy(knifePark);
            knife.quaternion.identity();
            return;
        }
        const stance = readPose(elapsed);
        knife.position.copy(stance.place);
        knife.quaternion.copy(stance.facing);
        swingChunk(elapsed);
    }
    function beginWhenIdle() {
        if (knifeBusy) return;
        if (slicesTaken >= 2) restoreChunks();
        activeSlice = slicesTaken;
        poseTable = buildPoseSet(sliceMid(activeSlice));
        knifeBusy = true;
        cutClockStart = clockNow;
    }
    function demandSlice() {
        lastTapTime = clockNow;
        beginWhenIdle();
    }
    gpu.domElement.addEventListener('pointerdown', function (ev) {
        cursor.x = (ev.clientX / window.innerWidth) * 2 - 1;
        cursor.y = -(ev.clientY / window.innerHeight) * 2 + 1;
        hitTest.setFromCamera(cursor, cam);
        if (hitTest.intersectObjects(knife.children, true).length > 0) demandSlice();
    });
    gpu.domElement.addEventListener('pointermove', function (ev) {
        cursor.x = (ev.clientX / window.innerWidth) * 2 - 1;
        cursor.y = -(ev.clientY / window.innerHeight) * 2 + 1;
        hitTest.setFromCamera(cursor, cam);
        gpu.domElement.style.cursor = hitTest.intersectObjects(knife.children, true).length ? 'pointer' : 'grab';
    });
    document.getElementById('knifeControl').addEventListener('click', demandSlice);

    // ---------- post processing ----------
    const rainShader = {
        uniforms: {
            tDiffuse: { value: null },
            resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            time: { value: 0 }
        },
        vertexShader: [
            'varying vec2 vUv;',
            'void main() {',
            '    vUv = uv;',
            '    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
            '}'
        ].join('\n'),
        fragmentShader: [
            'uniform sampler2D tDiffuse;',
            'uniform vec2 resolution;',
            'uniform float time;',
            'varying vec2 vUv;',
            'float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
            'void main() {',
            '    vec2 d = vUv - 0.5;',
            '    float r2 = dot(d, d);',
            '    vec2 o = d * r2 * 0.010;',
            '    vec3 col = vec3(texture2D(tDiffuse, vUv + o).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - o).b);',
            '    col *= mix(1.0, smoothstep(0.95, 0.18, length(d * vec2(1.0, 0.82))), 0.42);',
            '    col += (hash(vUv * resolution + fract(time) * 91.0) - 0.5) * 0.022;',
            '    gl_FragColor = vec4(col, 1.0);',
            '}',
        ].join('\n')
    };
    const composer = new EffectComposer(gpu, new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
        type: THREE.HalfFloatType,
        samples: 4
    }));
    composer.addPass(new RenderPass(world, cam));
    const lensBlur = new BokehPass(world, cam, {
        focus: 1.2,
        aperture: 0.0035,
        maxblur: 0.0055
    });
    composer.addPass(lensBlur);
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2), 0.24, 0.55, 0.92));
    composer.addPass(new OutputPass());
    const grainPass = new ShaderPass(rainShader);
    grainPass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
    composer.addPass(grainPass);

    // ---------- animation ----------
    let clockNow = 0;
    const stopwatch = new THREE.Clock();
    function tick() {
        requestAnimationFrame(tick);
        const delta = Math.min(stopwatch.getDelta(), 0.05);
        clockNow += delta;

        advanceCut(clockNow - cutClockStart);

        // candle flicker
        const flutter = Math.sin(clockNow * 11) * 0.5 + Math.sin(clockNow * 17.3) * 0.3 + Math.sin(clockNow * 5.1) * 0.2;
        halo.scale.set(1 + flutter * 0.04, 1 + flutter * 0.06, 1 + flutter * 0.04);
        ember.scale.set(1 + flutter * 0.04, 1 + flutter * 0.06, 1 + flutter * 0.04);
        candleGlow.intensity = 1.2 + flutter * 0.12;

        orbit.update();
        gpu.shadowMap.needsUpdate = true;
        lensBlur.uniforms.focus.value = cam.position.distanceTo(orbit.target);
        grainPass.uniforms.time.value = clockNow;
        composer.render(delta);
    }
    tick();

    // ---------- resize ----------
    window.addEventListener('resize', function () {
        cam.aspect = window.innerWidth / window.innerHeight;
        cam.fov = readyFov();
        cam.updateProjectionMatrix();
        gpu.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        grainPass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
    });

    // ---------- test-state hooks (no visual effect) ----------
    window.__test = {
        scene: world,
        camera: cam,
        orbit: orbit,
        board: board,
        tabletop: tabletop,
        stage: cheeseStage,
        cheeses: cheesePieces,
        knife: knife,
        grapes: bunch,
        nutSpots: nutSpots,
        slab: slabMesh,
        crumbs: crumbs,
        keyLight: spark
    };
})();
</script>
</body>
