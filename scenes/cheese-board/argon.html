<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artisan Cheese Board — Interactive 3D</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
        position: absolute; top: 16px; left: 16px; z-index: 10;
        background: rgba(38, 26, 16, 0.72); color: #f7ead2;
        padding: 13px 17px; border-radius: 12px;
        backdrop-filter: blur(6px); border: 1px solid rgba(220, 180, 120, 0.28);
        max-width: 240px; box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    #hud h1 { font-size: 15px; letter-spacing: 0.5px; margin-bottom: 4px; color: #e8c98a; }
    #hud p { font-size: 11px; opacity: 0.9; line-height: 1.55; }
    #knifeHint {
        position: absolute; bottom: 14px; left: 16px; z-index: 10;
        background: rgba(38, 26, 16, 0.72); color: #e8c98a;
        font-size: 12px; padding: 8px 16px; border-radius: 20px;
        border: 1px solid rgba(220, 180, 120, 0.35); backdrop-filter: blur(6px);
    }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
    <h1>🧀 The Evening Board</h1>
    <p>Olive wood, four cheeses, walnuts and grapes. Take a turn around the board.</p>
</div>
<div id="knifeHint">🔪 Click the knife — it lifts up</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
    var container = document.getElementById('app');
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2e2015);
    scene.fog = new THREE.Fog(0x2e2015, 20, 60);

    var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 200);
    camera.position.set(2.6, 2.4, 3.2);
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.2;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.52;

    // ---------- Warm kitchen light from one side (board brighter on that side) ----------
    var key = new THREE.DirectionalLight(0xffe2b8, 1.5);
    key.position.set(4, 5.5, 2.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -4; key.shadow.camera.right = 4;
    key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
    key.shadow.camera.far = 30;
    key.shadow.bias = -0.0004;
    scene.add(key);
    scene.add(new THREE.HemisphereLight(0x6a5a48, 0x241a12, 0.5));
    var rim = new THREE.DirectionalLight(0xb8c8e8, 0.25);
    rim.position.set(-4, 3, -3);
    scene.add(rim);

    // ---------- Dark wood table beneath ----------
    function shadowify(m) { m.castShadow = true; m.receiveShadow = true; return m; }
    var table = new THREE.Mesh(
        new THREE.CylinderGeometry(7, 7, 0.3, 40),
        new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 0.85 })
    );
    table.position.y = -0.28;
    table.receiveShadow = true;
    scene.add(table);
    // ---------- Oiled olive wood slab ----------
    function makeOliveWoodTexture() {
        var c = document.createElement('canvas'); c.width = c.height = 1024;
        var g = c.getContext('2d');
        // olive wood base: golden honey brown
        var base = g.createLinearGradient(0, 0, 1024, 1024);
        base.addColorStop(0, '#b98d54');
        base.addColorStop(0.5, '#c89e62');
        base.addColorStop(1, '#a87c46');
        g.fillStyle = base; g.fillRect(0, 0, 1024, 1024);
        // long wavy grain streaks (dark + light)
        for (var i = 0; i < 90; i++) {
            var dark = Math.random() > 0.42;
            g.strokeStyle = dark ? 'rgba(74,48,22,' + (0.10 + Math.random() * 0.22) + ')' : 'rgba(240,214,160,' + (0.08 + Math.random() * 0.14) + ')';
            g.lineWidth = 1 + Math.random() * (dark ? 5 : 3);
            g.beginPath();
            var y0 = Math.random() * 1024;
            g.moveTo(-20, y0);
            for (var x = 0; x <= 1064; x += 64) {
                g.lineTo(x, y0 + Math.sin(x * 0.008 + i) * 26 + (Math.random() - 0.5) * 10);
            }
            g.stroke();
        }
        // knots
        for (var k = 0; k < 5; k++) {
            var kx = Math.random() * 1024, ky = Math.random() * 1024;
            for (var r = 14; r > 0; r -= 2) {
                g.strokeStyle = 'rgba(60,38,16,' + (0.05 + (14 - r) * 0.02) + ')';
                g.beginPath();
                g.ellipse(kx, ky, r * 1.6, r, 0.4, 0, Math.PI * 2);
                g.stroke();
            }
        }
        var t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        return t;
    }
    var woodTex = makeOliveWoodTexture();
    var slabMat = new THREE.MeshStandardMaterial({
        map: woodTex, roughness: 0.22, metalness: 0.05 // low roughness: oiled sheen
    });
    var slab = shadowify(new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.14, 2.3), slabMat));
    slab.position.y = 0.07;
    scene.add(slab);
    // softly rounded live-edge rim
    var rimMat = new THREE.MeshStandardMaterial({ color: 0x6e4c28, roughness: 0.5 });
    var rimEdge = shadowify(new THREE.Mesh(new THREE.BoxGeometry(3.46, 0.06, 2.36), rimMat));
    rimEdge.position.y = 0.03;
    scene.add(rimEdge);
    var SLAB_TOP = 0.14;
    // ---------- Cheese materials ----------
    var cheeses = [];
    // 1) HARD CRUMBLY WEDGE — triangular pie slice, wider at the rind, tapering to a point
    var wedgeGroup = new THREE.Group();
    var wedgeBodyMat = new THREE.MeshStandardMaterial({ color: 0xe8cf8e, roughness: 0.75 }); // pale cheddar tone
    var wedgeRindMat = new THREE.MeshStandardMaterial({ color: 0xb08a4a, roughness: 1 });    // matte clothbound rind
    var wedge = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.34, 24, 1, false, 0, 0.85), wedgeBodyMat));
    wedge.position.y = 0.17;
    wedgeGroup.add(wedge);
    // darker rind band around the curved outer edge
    var wedgeRind = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.625, 0.625, 0.35, 24, 1, true, 0, 0.85), wedgeRindMat));
    wedgeRind.position.y = 0.17;
    wedgeGroup.add(wedgeRind);
    // crumbly relief: irregular bumps on the two broken faces + loose crumbs
    var crumbMat = new THREE.MeshStandardMaterial({ color: 0xf2ddA2, roughness: 1 });
    for (var cb = 0; cb < 26; cb++) {
        var face = cb % 2 === 0 ? 0 : 0.85;
        var dist = 0.12 + Math.random() * 0.42;
        var bump = new THREE.Mesh(new THREE.SphereGeometry(0.018 + Math.random() * 0.022, 6, 5), cb % 3 === 0 ? wedgeBodyMat : crumbMat);
        bump.position.set(Math.cos(face) * dist, 0.05 + Math.random() * 0.26, Math.sin(face) * dist);
        bump.position.x += Math.cos(face + Math.PI / 2) * 0.008;
        bump.position.z += Math.sin(face + Math.PI / 2) * 0.008;
        wedgeGroup.add(bump);
    }
    // loose crumb pieces fallen on the board at the wedge's point
    for (var lc = 0; lc < 6; lc++) {
        var crumb = new THREE.Mesh(new THREE.SphereGeometry(0.012 + Math.random() * 0.014, 6, 5), crumbMat);
        crumb.position.set(0.7 + Math.random() * 0.35, 0.012, -0.15 + Math.random() * 0.5);
        crumb.scale.y = 0.6;
        wedgeGroup.add(crumb);
    }
    wedgeGroup.position.set(-0.95, SLAB_TOP, 0.55);
    wedgeGroup.rotation.y = -0.5;
    scene.add(wedgeGroup);
    cheeses.push(wedgeGroup);

    // 2) BLOOMY SOFT ROUND — low round, pale white fuzzy rind, clear side wall height
    var brieGroup = new THREE.Group();
    var brieRindMat = new THREE.MeshStandardMaterial({ color: 0xf7f3e4, roughness: 0.95 }); // pale bloomy coat
    var brie = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.30, 28), brieRindMat));
    brie.position.y = 0.15;
    brieGroup.add(brie);
    // slightly domed top
    var brieTop = shadowify(new THREE.Mesh(new THREE.SphereGeometry(0.5, 28, 10, 0, Math.PI * 2, 0, Math.PI / 5), brieRindMat));
    brieTop.scale.set(1, 0.25, 1);
    brieTop.position.y = 0.30;
    brieGroup.add(brieTop);
    // cut wedge removed showing creamy interior
    var brieInner = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.47, 0.28, 28, 1, false, 0, 0.6), new THREE.MeshStandardMaterial({ color: 0xfbeec8, roughness: 0.6 })));
    brieInner.position.y = 0.148;
    brieInner.position.x = 0.012;
    brieGroup.add(brieInner);
    brieGroup.position.set(0.85, SLAB_TOP, 0.62);
    scene.add(brieGroup);
    cheeses.push(brieGroup);
    // 3) BLUE CHEESE — cut face with blue-grey veining
    function makeBlueVeinTexture() {
        var c = document.createElement('canvas'); c.width = c.height = 512;
        var g = c.getContext('2d');
        g.fillStyle = '#e9dfc2'; g.fillRect(0, 0, 512, 512); // ivory paste
        // blue-grey veins branching across the cut
        for (var v = 0; v < 26; v++) {
            g.strokeStyle = 'rgba(80,105,110,' + (0.35 + Math.random() * 0.4) + ')';
            g.lineWidth = 2 + Math.random() * 4;
            g.beginPath();
            var x = Math.random() * 512, y = Math.random() * 512;
            g.moveTo(x, y);
            for (var s = 0; s < 5; s++) {
                x += (Math.random() - 0.5) * 130;
                y += (Math.random() - 0.5) * 130;
                g.lineTo(x, y);
            }
            g.stroke();
        }
        // vein knots
        for (var n = 0; n < 40; n++) {
            g.fillStyle = 'rgba(70,95,105,' + (0.3 + Math.random() * 0.35) + ')';
            g.beginPath();
            g.ellipse(Math.random() * 512, Math.random() * 512, 3 + Math.random() * 9, 2 + Math.random() * 6, Math.random() * 3, 0, Math.PI * 2);
            g.fill();
        }
        return new THREE.CanvasTexture(c);
    }
    var blueGroup = new THREE.Group();
    var blueRindMat = new THREE.MeshStandardMaterial({ color: 0x9a8a72, roughness: 1 }); // matte natural rind
    var blueVeinMat = new THREE.MeshStandardMaterial({ map: makeBlueVeinTexture(), roughness: 0.7 });
    // half-wheel standing with the cut face forward
    var blueBody = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.36, 28, 1, false, 0, Math.PI), blueRindMat));
    blueBody.position.y = 0.18;
    blueGroup.add(blueBody);
    var blueFace = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.465, 0.465, 0.365, 28, 1, false, Math.PI / 2 - 0.001, 0.002), blueVeinMat));
    blueFace.position.y = 0.18;
    blueGroup.add(blueFace);
    // flat cut face (vertical) showing the veined interior
    var cutFace = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.34, 0.88), blueVeinMat));
    cutFace.position.set(0, 0.18, 0);
    blueGroup.add(cutFace);
    var cutFace2 = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.34, 0.02), blueVeinMat));
    cutFace2.position.set(0, 0.18, 0);
    blueGroup.add(cutFace2);
    blueGroup.position.set(-0.15, SLAB_TOP, -0.62);
    blueGroup.rotation.y = 0.9;
    scene.add(blueGroup);
    cheeses.push(blueGroup);

    // 4) GOAT LOG — slender cylinder, clearly longer than thick, ash-dusted
    var goatGroup = new THREE.Group();
    var goatMat = new THREE.MeshStandardMaterial({ color: 0xf4efe2, roughness: 0.85 });
    var ashMat = new THREE.MeshStandardMaterial({ color: 0x8d8d88, roughness: 1 });
    var log = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.95, 20), goatMat));
    log.rotation.z = Math.PI / 2;
    log.position.y = 0.13;
    goatGroup.add(log);
    // ash stripe along the middle
    var ashBand = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.132, 0.132, 0.16, 20), ashMat));
    ashBand.rotation.z = Math.PI / 2;
    ashBand.position.y = 0.13;
    goatGroup.add(ashBand);
    // herb flecks
    for (var hf = 0; hf < 10; hf++) {
        var fleck = new THREE.Mesh(new THREE.SphereGeometry(0.012, 5, 4), ashMat);
        var fa = Math.random() * Math.PI * 2, fx = (Math.random() - 0.5) * 0.85;
        fleck.position.set(fx, 0.13 + Math.sin(fa) * 0.13, Math.cos(fa) * 0.13);
        goatGroup.add(fleck);
    }
    goatGroup.position.set(1.05, SLAB_TOP, -0.45);
    goatGroup.rotation.y = 0.5;
    scene.add(goatGroup);
    cheeses.push(goatGroup);
    // ---------- Walnuts: lumpy lobed shells, spaced apart ----------
    var walnutMat = new THREE.MeshStandardMaterial({ color: 0x9c6b3d, roughness: 0.75 });
    var walnutDark = new THREE.MeshStandardMaterial({ color: 0x7a4f2a, roughness: 0.9 });
    function walnut(x, z, rot) {
        var g = new THREE.Group();
        var geo = new THREE.SphereGeometry(0.085, 18, 14);
        var pos = geo.attributes.position;
        for (var i = 0; i < pos.count; i++) {
            var vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
            var n = 1 + 0.14 * Math.sin(vx * 34) * Math.cos(vy * 28) + 0.09 * Math.sin(vz * 40 + vx * 22);
            pos.setXYZ(i, vx * n, vy * n * 0.88, vz * n);
        }
        geo.computeVertexNormals();
        var shell = shadowify(new THREE.Mesh(geo, walnutMat));
        g.add(shell);
        // shell seam
        var seam = new THREE.Mesh(new THREE.TorusGeometry(0.082, 0.006, 6, 20), walnutDark);
        seam.rotation.x = Math.PI / 2;
        seam.scale.y = 0.9;
        g.add(seam);
        g.position.set(x, SLAB_TOP + 0.075, z);
        g.rotation.set(rot, rot * 1.7, rot * 0.6);
        scene.add(g);
        return g;
    }
    walnut(-0.35, 0.15, 0.4);
    walnut(0.25, -0.15, 1.2);
    walnut(-0.55, -0.45, 2.1);
    walnut(0.55, 0.28, 0.8);
    walnut(-1.35, -0.15, 1.6);

    // ---------- Grapes: glossy cluster with tight bright highlights ----------
    var grapeMat = new THREE.MeshStandardMaterial({ color: 0x5a2a6e, roughness: 0.06, metalness: 0.12 });
    var grapeMat2 = new THREE.MeshStandardMaterial({ color: 0x6e3a82, roughness: 0.06, metalness: 0.12 });
    var grapes = new THREE.Group();
    var grapePos = [
        [0, 0, 0], [0.10, 0, 0.03], [-0.09, 0, 0.05], [0.05, 0, -0.09], [-0.04, 0, -0.07],
        [0.14, 0, -0.05], [0.02, 0.095, 0.01], [0.11, 0.09, -0.04], [-0.06, 0.09, -0.02],
        [0.05, 0.17, -0.02], [-0.13, 0, -0.03], [0.18, 0, 0.02], [0.09, 0.16, 0.05]
    ];
    grapePos.forEach(function (p, i) {
        var gr = shadowify(new THREE.Mesh(new THREE.SphereGeometry(0.062, 16, 12), i % 3 === 0 ? grapeMat2 : grapeMat));
        gr.position.set(p[0], p[1] + 0.062, p[2]);
        grapes.add(gr);
    });
    var stem = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.018, 0.16, 6), new THREE.MeshStandardMaterial({ color: 0x5d6e3a, roughness: 1 })));
    stem.position.set(0.02, 0.26, 0);
    stem.rotation.z = 0.3;
    grapes.add(stem);
    grapes.position.set(-0.05, SLAB_TOP, 0.95);
    scene.add(grapes);

    // ---------- Loose rind pieces (separate, matte) ----------
    var rindMat = new THREE.MeshStandardMaterial({ color: 0xa8956e, roughness: 1, side: THREE.DoubleSide });
    var rindMat2 = new THREE.MeshStandardMaterial({ color: 0x8f8468, roughness: 1, side: THREE.DoubleSide });
    function rindPiece(x, z, ry, mat) {
        var r = shadowify(new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.028, 6, 12, 1.6), mat || rindMat));
        r.rotation.set(Math.PI / 2, 0, ry);
        r.position.set(x, SLAB_TOP + 0.03, z);
        scene.add(r);
    }
    rindPiece(-0.62, 0.92, 0.4);
    rindPiece(0.45, 0.05, 2.2, rindMat2);
    rindPiece(1.45, 0.15, 1.1);
    // ---------- Cheese knife: bright steel blade + wooden handle ----------
    var knife = new THREE.Group();
    var bladeMat = new THREE.MeshStandardMaterial({ color: 0xdfe5ea, roughness: 0.08, metalness: 0.95 }); // bright steel
    var handleMat = new THREE.MeshStandardMaterial({ color: 0x6e4423, roughness: 0.55, metalness: 0.05 }); // wood
    var blade = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.012, 0.09), bladeMat));
    blade.position.set(0.29, 0.006, 0);
    knife.add(blade);
    var bladeTip = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.012, 3, 1), bladeMat));
    bladeTip.rotation.y = Math.PI / 2;
    bladeTip.position.set(0.60, 0.006, 0);
    knife.add(bladeTip);
    // forked cheese-knife notch
    var bolster = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.05, 10), bladeMat));
    bolster.rotation.x = Math.PI / 2;
    bolster.position.set(-0.02, 0.012, 0);
    knife.add(bolster);
    var handle = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.028, 0.34, 12), handleMat));
    handle.rotation.z = Math.PI / 2;
    handle.position.set(-0.22, 0.03, 0);
    knife.add(handle);
    // brass rivets in the handle
    [-0.14, -0.24, -0.32].forEach(function (rx) {
        var rivet = new THREE.Mesh(new THREE.SphereGeometry(0.010, 8, 6), new THREE.MeshStandardMaterial({ color: 0xd8b13c, roughness: 0.2, metalness: 0.9 }));
        rivet.position.set(rx, 0.062, 0);
        knife.add(rivet);
    });
    var KNIFE_HOME = { x: -1.15, y: SLAB_TOP + 0.012, z: -0.85, ry: -0.7 };
    knife.position.set(KNIFE_HOME.x, KNIFE_HOME.y, KNIFE_HOME.z);
    knife.rotation.y = KNIFE_HOME.ry;
    scene.add(knife);

    // ---------- Click the knife: it lifts up, hovers, settles back ----------
    var raycaster = new THREE.Raycaster();
    var pointer = new THREE.Vector2();
    var liftT = -10;
    var hint = document.getElementById('knifeHint');
    function liftKnife() {
        liftT = t;
        hint.textContent = '🔪 Up it goes!';
        clearTimeout(window._knifeTimeout);
        window._knifeTimeout = setTimeout(function () {
            hint.textContent = '🔪 Click the knife — it lifts up';
        }, 2200);
    }
    renderer.domElement.addEventListener('pointerdown', function (ev) {
        pointer.x = (ev.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(ev.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        if (raycaster.intersectObjects(knife.children, true).length > 0) liftKnife();
    });
    renderer.domElement.addEventListener('pointermove', function (ev) {
        pointer.x = (ev.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(ev.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        renderer.domElement.style.cursor = raycaster.intersectObjects(knife.children, true).length ? 'pointer' : 'grab';
    });
    function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
    function updateKnife(t) {
        var since = t - liftT;
        var lift = 0;
        if (since >= 0 && since < 2.6) {
            if (since < 0.6) lift = easeInOut(since / 0.6);            // rise
            else if (since < 1.6) lift = 1;                            // hover
            else lift = 1 - easeInOut((since - 1.6) / 1.0);            // settle back
        }
        knife.position.y = KNIFE_HOME.y + lift * 0.55;
        knife.rotation.z = lift * 0.35;
        knife.rotation.y = KNIFE_HOME.ry + lift * 0.5;
    }
    // ---------- Animation ----------
    var clock = new THREE.Clock();
    var t = 0;
    function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.05);
        t += dt;

        updateKnife(t);

        // subtle candlelight warmth breathing on the key light
        key.intensity = 1.5 + Math.sin(t * 2.2) * 0.04;

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // ---------- Resize ----------
    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>
</body>
</html>
