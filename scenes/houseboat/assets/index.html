<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Willow · Houseboat Holiday Let</title>
<style>
    :root {
        --panel-bg: rgba(255, 248, 236, 0.86);
        --panel-edge: rgba(150, 104, 58, 0.30);
        --panel-shadow: 0 10px 30px rgba(52, 30, 8, 0.28);
        --ink: #3d2914;
        --ink-soft: #6a4c2c;
        --accent: #a5582a;
        --bar-track: rgba(150, 104, 58, 0.22);
        --toast-bg: rgba(122, 44, 20, 0.94);
        --toast-ink: #fff4e6;
        --page: #8fa6b4;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --panel-bg: rgba(38, 27, 18, 0.84);
            --panel-edge: rgba(255, 214, 160, 0.22);
            --panel-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            --ink: #fbeedb;
            --ink-soft: #e2c9a6;
            --accent: #f2b071;
            --bar-track: rgba(255, 214, 160, 0.20);
            --toast-bg: rgba(150, 58, 28, 0.95);
            --toast-ink: #fff6ea;
            --page: #2c3a44;
        }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--page); }
    body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink); }
    #app { position: fixed; inset: 0; touch-action: none; }
    #app canvas { display: block; width: 100%; height: 100%; outline: none; }
    .card {
        background: var(--panel-bg); color: var(--ink);
        border: 1px solid var(--panel-edge); box-shadow: var(--panel-shadow);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    #welcome {
        position: fixed; z-index: 10;
        top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
        width: min(280px, calc(100vw - 28px)); padding: 13px 16px 12px; border-radius: 14px;
    }
    #welcome h1 { font-size: 17px; font-weight: 650; letter-spacing: 0.3px; color: var(--accent); margin-bottom: 2px; }
    #welcome .sub { font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 7px; }
    #welcome p { font-size: 12.5px; line-height: 1.5; color: var(--ink); }
    #howto {
        position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
        bottom: max(14px, env(safe-area-inset-bottom));
        padding: 7px 15px; border-radius: 999px; font-size: 12px; letter-spacing: 0.3px;
        white-space: nowrap; color: var(--ink-soft);
    }
    #howto .touch { display: none; }
    @media (pointer: coarse) { #howto .mouse { display: none; } #howto .touch { display: inline; } }
    #loading {
        position: fixed; z-index: 20; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(300px, calc(100vw - 40px)); padding: 16px 18px; border-radius: 14px; text-align: center;
        transition: opacity 0.6s ease;
    }
    #loading p { font-size: 13px; margin-bottom: 10px; }
    #loading .track { height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; }
    #loading .fill { height: 100%; width: 0%; border-radius: 3px; background: var(--accent); transition: width 0.25s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #toast {
        position: fixed; z-index: 30; left: 50%; bottom: 64px; transform: translate(-50%, 12px);
        max-width: min(420px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 12px;
        background: var(--toast-bg); color: var(--toast-ink); font-size: 13px; line-height: 1.45;
        box-shadow: var(--panel-shadow); opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 600px) {
        #welcome { width: min(232px, calc(100vw - 28px)); padding: 10px 13px 9px; }
        #welcome h1 { font-size: 15px; }
        #welcome .sub { font-size: 10.5px; margin-bottom: 5px; }
        #welcome p { font-size: 11.5px; line-height: 1.42; }
        #howto { font-size: 11px; padding: 6px 12px; }
    }
    @media (max-height: 460px) {
        #welcome p { display: none; }
        #welcome .sub { margin-bottom: 0; }
    }
</style>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }

<body>
<div id="app"></div>
<section id="welcome" class="card" aria-label="About The Willow">
    <h1>The Willow</h1>
    <div class="sub">Houseboat holiday let · sleeps 4</div>
    <p>Take a look around before you book: turn the boat to see the roof terrace, the bow deck and the view from every window.</p>
</section>
<div id="howto" class="card"><span class="mouse">Drag to look around · Scroll to zoom</span><span class="touch">Drag to look around · Pinch to zoom</span></div>
<div id="loading" class="card" role="status" aria-live="polite"><p>Getting The Willow ready…</p><div class="track"><div class="fill"></div></div></div>
<div id="toast" role="alert"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------------------------------------
// Settings. Everything below is read from the designer's TheWillow_houseboat_asset.blend (Blender 5.1, EEVEE)
// and converted to three.js axes (x forward to the bow, y up, z to starboard).
// ---------------------------------------------------------------------------------------------------------
const PACKAGE = {
    model: 'TheWillow_houseboat_asset.glb',                    // the .blend's meshes, exported to glTF with Draco
    sky: 'hdri/industrial_sunset_02_puresky_2k_rot.hdr',        // the .blend's world texture, as linear radiance
    textureDir: 'textures/',
    dracoPath: 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/'
};

// The scene camera "Cam": 15.5, 6.6, 14 looking at its orbit rig at 0.2, 1.9, -0.3, 40 degree vertical lens.
const VIEW = {
    eye: [15.5, 6.6, 14.0],
    target: [0.2, 1.9, -0.3],
    fov: 40,
    near: 0.3,
    far: 4000,
    designAspect: 16 / 9,       // windows narrower than 16:9 back the camera off so the same width stays in frame
    minDistance: 9.5,           // the whole boat stays outside the lens: its farthest part is 6.6 m from the target
    maxDistance: 48,
    minPolarAngle: 0.20,
    maxPolarAngle: 1.47,        // never below 1.9 + 9.5 * cos(1.47) = 2.85 m, above every rail, pile and lantern
    rotateSpeed: 0.55,
    zoomSpeed: 0.8,
    damping: 0.08
};

// World: the HDRI at strength 0.9. EEVEE turns every texel above 10 into a sun lamp, so the sky that lights the
// materials is the clamped one and the clipped part becomes skySun. sun is the .blend's own "Sun" lamp.
const DAYLIGHT = {
    skyStrength: 0.9,
    sunThreshold: 10,
    sun: { color: [1.0, 0.86, 0.68], strength: 3.6, towards: [-0.8216, 0.2852, 0.4936], angle: 0.0209 },
    skySun: { color: [0.4501, 0.0457, 0.00005], strength: 1.0, towards: [0.8563, 0.0379, -0.5151], angle: 0.0092 },
    // Diffuse sky light comes from first-order spherical harmonics, as EEVEE lights from its world probe. Below the
    // horizon EEVEE's ambient occlusion finds the deck and the water in the way, so the diffuse light from there is
    // only the dark water (waterGlow) and not the HDRI's bright lower half. Reflections see half HDRI, half the lake
    // (the sky mirrored by the water with its Fresnel term).
    shDiffuse: true,
    groundOccluded: true,
    waterGlow: [0.002, 0.010, 0.012],
    reflectLake: 0.5,
    shadowCentre: [0.0, 1.0, -10.0],
    shadowHalfSize: 26,
    shadowMapSize: 4096,
    shadowSoftness: 2
};

// Point lamps of the .blend (power in W converted to intensity: W / 4 pi). The interior lamp only gives diffuse
// light (its specular factor is 0) and only inside the cabin; the lanterns only outside it. Each lantern's light
// sits at the centre of its own glass chimney (the lantern's origin + 0.0955 m), where the flame would be; the .blend
// had the three lamps 18 cm to the side of their lanterns and 10 to 35 cm above the glass.
// floor: the lamp only reaches surfaces above that height: the deck, the jetty or the roof slab a lantern stands on
// shades everything under it.
const LAMPS = [
    { name: 'Interior_Light', at: [-1.90, 2.66, 0.00], color: [1.0, 0.72, 0.45], watts: 90, inside: true, floor: -100 },
    { name: 'Bow_Lantern_glow', at: [5.25, 1.006, 0.90], color: [1.0, 0.72, 0.40], watts: 25, inside: false, floor: 0.9 },
    { name: 'Terrace_Lantern_glow', at: [0.95, 3.396, 0.00], color: [1.0, 0.72, 0.40], watts: 25, inside: false, floor: 3.2 },
    { name: 'Jetty_Lantern_glow', at: [-0.95, 0.646, -4.30], color: [1.0, 0.72, 0.40], watts: 25, inside: false, floor: 0.54 }
];
// Inside of the cabin: the inner faces of its walls (x -4.92 and 1.52, z +-1.82) and ceiling (3.07) with 3 cm to
// spare; the outer faces (x -5.0 and 1.6, z +-1.9, roof 3.11) stay outside. bounce is the light the room sends back
// to itself (W/m2 per channel): the lamp's 90 W spread over ~90 m2 of walls, ceiling and floor, bounced once off the
// room's mean albedo (0.55, 0.38, 0.17: cream plaster on five sides, dark planks underfoot), in lamp colour, and kept
// at the quarter of it that EEVEE's screen-space light finds through the windows of the designer's render.
// sky is the share of daylight that gets in: ~7 m2 of window and door glass against ~90 m2 of room.
const CABIN_ROOM = { min: [-4.95, 0.88, -1.85], max: [1.55, 3.09, 1.85], bounce: [0.14, 0.07, 0.02], sky: 0.08 };

// Water "hb_water": the plane slides 9 m along x over the 24 s clip (its height and the 6 m texture repeat are read
// from the plane itself). thickness is how far behind what the eye sees a reflected surface still counts as seen
// (EEVEE's screen trace thickness), smoothing the width (in pixels of the frame) of the blur standing in for
// EEVEE's denoiser. The sun glint's lobe (roughness 0.05) and strength (0.25 of a lamp's GGX highlight) are fitted to the
// streak in the designer's render at frame 151. Only the HDRI's own sun glints, low over the hills where the sky shows it;
// the .blend's sun lamp has no disc in the sky, so its streak lay in the middle of the lake with nothing above it.
const WATER = { drift: 9 / 24, tile: 6, normalStrength: 0.35, roughness: 0.03, thickness: 0.2, smoothing: 2.6, rippleDetail: 1, glintRoughness: 0.05, glintScale: 0.25 };

// Materials of the .blend: Image Texture -> Principled BSDF, nothing else. level is the Specular IOR Level: Blender
// scales the reflectance at normal incidence (F0 = 0.04 x 2 x level) and keeps it at 1 at grazing angles, which is
// an IOR change, so the material gets the IOR with that F0 (0.35 -> 1.402).
const T = name => name + '.jpg';
const FINISHES = {
    hb_cabin: { map: T('painted_plaster_wall_tint_1k'), roughnessMap: T('painted_plaster_wall_rough_2k_1k'), normalMap: T('painted_plaster_wall_nor_2k_1k'), normal: 0.6 },
    hb_trim: { map: T('dark_wood_diff_2k_1k'), roughnessMap: T('dark_wood_rough_2k_1k'), normalMap: T('dark_wood_nor_2k_1k') },
    hb_deck: { map: T('worn_planks_tint_1k'), roughnessMap: T('worn_planks_rough_2k_1k'), normalMap: T('worn_planks_nor_2k_1k') },
    hb_hull: { map: T('weathered_brown_planks_diff_2k_1k'), roughnessMap: T('weathered_brown_planks_rough_2k_1k'), normalMap: T('weathered_brown_planks_nor_2k_1k') },
    hb_pile: { map: T('bark_willow_02_diff_2k_1k'), roughnessMap: T('bark_willow_02_rough_2k_1k'), normalMap: T('bark_willow_02_nor_2k_1k') },
    hb_rail: { map: T('hb_rail_diff_1k'), metalness: 1, roughness: 0.22, normalMap: T('metal_plate_02_nor_2k_1k'), normal: 0.15 },
    hb_darkmetal: { map: T('hb_dark_diff_1k'), metalness: 0.85, roughnessMap: T('metal_plate_02_rough_2k_1k'), normalMap: T('metal_plate_02_nor_2k_1k') },
    hb_glass: { map: T('hb_glass_tint_1k'), roughness: 0.02, opacity: 0.16, level: 0.6, glass: true },
    hb_rope: { map: T('Rope001_2K-JPG_Color_1k'), roughness: 0.9 },
    hb_rug: { map: T('denim_fabric_diff_2k_1k'), roughnessMap: T('denim_fabric_rough_2k_1k'), normalMap: T('denim_fabric_nor_2k_1k') },
    hb_ground: { map: T('aerial_grass_rock_diff_2k_1k'), roughnessMap: T('aerial_grass_rock_rough_2k_1k'), normalMap: T('aerial_grass_rock_nor_2k_1k') },
    hb_sand: { map: T('coast_sand_01_diff_2k_1k'), roughnessMap: T('coast_sand_01_rough_2k_1k'), normalMap: T('coast_sand_01_nor_2k_1k') },
    hb_water: { map: T('hb_water_col_1k'), roughness: WATER.roughness, normalMap: T('hb_water_nor_1k'), normal: WATER.normalStrength, level: 0.5 },
    Lantern_01_brass: polyHaven('Lantern_01_brass', 'roughness', 'metallic', 'nor_gl'),
    Lantern_01_glass: { ...polyHaven('Lantern_01_brass', 'roughness', 'metallic', 'nor_gl'), alphaMap: T('Lantern_01_brass_opacity_2k_1k'), glow: 1.6 },
    outdoor_table_chair_set_01_chair: polyHaven('outdoor_table_chair_set_01_chair', 'rough', 'metal', 'nor_gl'),
    outdoor_table_chair_set_01_table: polyHaven('outdoor_table_chair_set_01_table', 'rough', 'metal', 'nor_gl'),
    painted_wooden_bench: polyHaven('painted_wooden_bench', 'rough', null, 'nor_gl'),
    potted_plant_01_pot: polyHaven('potted_plant_01_pot', 'rough', null, 'nor_gl'),
    potted_plant_01_leaves: { ...polyHaven('potted_plant_01_leaves', 'rough', null, 'nor_gl'), alphaMap: T('potted_plant_01_leaves_alpha_2k_1k'), foliage: true },
    potted_plant_02_pot: polyHaven('potted_plant_02_pot', 'rough', null, 'nor_gl'),
    potted_plant_02_leaves: { ...polyHaven('potted_plant_02_leaves', 'rough', null, 'nor_gl'), alphaMap: T('potted_plant_02_leaves_alpha_2k_1k'), foliage: true },
    potted_plant_04: polyHaven('potted_plant_04', 'rough', null, 'nor_gl'),
    Armchair_01: polyHaven('Armchair_01', 'roughness', 'metallic', 'nor_gl'),
    GreenChair_01: polyHaven('GreenChair_01', 'roughness', 'metallic', 'nor_gl'),
    sofa_03: polyHaven('sofa_03', 'rough', null, 'nor_gl'),
    sofa_03_fringe: { ...polyHaven('sofa_03', 'rough', null, 'nor_gl'), alphaMap: T('sofa_03_opacity_2k_1k') },
    side_table_01: polyHaven('side_table_01', 'rough', 'metal', 'nor_gl'),
    wooden_table_02: polyHaven('wooden_table_02', 'rough', 'metal', 'nor_gl'),
    rock_moss_set_01: polyHaven('rock_moss_set_01', 'rough', null, 'nor_gl'),
    shrub_04: { ...polyHaven('shrub_04', 'rough', null, 'nor_gl'), alphaMap: T('shrub_04_alpha_2k_1k'), foliage: true },
    tree_small_02_trunk: polyHaven('tree_small_02', 'rough', null, 'nor_gl'),
    tree_small_02_branches: polyHaven('tree_small_02_branch', 'rough', null, 'nor_gl'),
    tree_small_02_leaves: { ...polyHaven('tree_small_02_leaves', 'rough', null, 'nor_gl'), alphaMap: T('tree_small_02_leaves_alpha_2k_1k'), foliage: true }
};
// The Poly Haven props (furniture, plants, lanterns, trees, shrubs, rocks) are small on screen: their maps are
// decoded at 512 px, which keeps the page near 270 MB of texture memory instead of 570 MB.
function polyHaven(set, rough, metal, normal) {
    const f = { map: T(set + '_diff_2k_1k'), roughnessMap: T(set + '_' + rough + '_2k_1k'), normalMap: T(set + '_' + normal + '_2k_1k'), propSize: 512 };
    if (metal) f.metalnessMap = T(set + '_' + metal + '_2k_1k');
    return f;
}

// Far scenery that repeats one mesh: drawn as instances, and the trees switch to the lighter copy far away.
// leafOpacity scales the leaves' alpha so a canopy covers the hill behind it as densely as in the designer's render
// (fitted on the opening view: canopy minus the hill beside it, red and green within 3 levels at 2; above 2 nothing changes).
// The shore meshes of the .blend are wound facing down (Blender shades both sides alike); they are turned up here.
const SCENERY = { treeNear: 'ShoreTree_', treeFarSource: 'ShoreTree_far', farTreeFrom: 60, leafOpacity: 2, instanced: ['ShoreShrub_', 'ShoreRock_'],
    faceDown: ['ShoreGround', 'HorizonHills', 'ShoreBeach'] };

// The .blend's two mooring lines are 34 cm stubs that stop in mid-air beside the hull. Each becomes a whole rope: a
// turn round its cleat, a slack span to the jetty pile the stub leans towards and a round turn on that pile, made like
// the designer's rope pieces (8 sides, 1.8 cm radius, the hb_rope image repeating every 0.12 m). The span sags by
// sag x its length; the turn on the pile sits pileDrop below the pile's top.
const MOORING = { lines: [['MooringLine_0', 'MooringCleat_0_neck', 'Pile_00'], ['MooringLine_1', 'MooringCleat_1_neck', 'Pile_04']],
    radius: 0.018, sides: 8, repeatsPerMetre: 8.33, sag: 0.04, pileDrop: 0.12 };

// Where two runs of railing meet, the .blend has one post per run in exactly the same place (the same vertices and
// UVs, two coincident surfaces); each of these corner posts is drawn once.
const SHARED_POSTS = ['TRail_A_post0', 'TRail_A_post5', 'TRail_F_post0', 'TRail_F_post5', 'BRail_F_post0', 'BRail_F_post5'];

// Where a top rail ends at a post (the corners of both railings, both sides of the ladder's opening and of the bow
// gate, and the bow rails' ends by the cabin), the .blend butts the rail's cut end against the post's flat top, level
// with the rail's centre, and the ladder's stiles end at that same point: each of these joints showed a small notch.
// Each gets a ball fitting on top of the post, as on a stanchion railing. The ball is centred on the post top, so the
// post (2.5 cm radius), the rails (2.2 cm) and the stiles (3 cm) all leave it as clean circles, and 3.6 cm takes in
// every cut end (the farthest rail edge over the post is 3.3 cm from the centre).
const RAIL_FITTINGS = { radius: 0.036, posts: ['TRail_S_post0', 'TRail_P_post0', 'TRail_S_post8', 'TRail_P_post8', 'TRail_A_post6',
    'TRail_A_post7', 'BRail_S_post4', 'BRail_P_post4', 'BRail_F_post6', 'BRail_F_post7', 'BRail_S_post0', 'BRail_P_post0'] };

// The cabin's two doors (BowDoor on the forward wall, SternDoor on the aft wall) had nothing to open them by. Each gets a
// round knob on its outer face, 8 cm in from its starboard edge and 0.91 m above the deck, turned in the aged brass of
// the package's lanterns. profile is the knob's section (radius, depth out of the door, in metres): a rose let 2 mm
// into the door so no face lies on the door's own, a neck, then the knob, 7.5 cm deep in all. Its texture coordinates
// are all squeezed into one even, fully metallic patch of the lantern's brass atlas (uv: corner u, corner v, size).
const DOOR_KNOBS = { doors: ['BowDoor', 'SternDoor'], fromEdge: 0.08, height: 0.91, uv: [0.908, 0.041, 0.043],
    profile: [[0, -0.002], [0.028, -0.002], [0.028, 0.004], [0.026, 0.008], [0.011, 0.010], [0.009, 0.016], [0.009, 0.030],
        [0.016, 0.036], [0.024, 0.046], [0.026, 0.056], [0.023, 0.066], [0.014, 0.073], [0, 0.075]] };

// The doors are slabs on the outer face of solid end walls, so from inside the cabin there was no door to see, only
// plaster where each one should be. Each door's leaf, its glazed panel and its knob are copied onto the inside face of
// its wall, mirrored through the middle of the wall (0.08 m thick). Inside, the bow door is right behind the dining
// table's far chair (Interior_Chair_B, its back 3 cm off the wall), so that chair moves 10 cm towards the table, clear
// of the knob and of the panel's frame; its seat slides a little further under the table top.
const DOORS_INSIDE = { parts: ['BowDoor', 'SternDoor'], wall: 0.08, moved: { Interior_Chair_B: [-0.10, 0, 0] } };

// The two bow cleats are a bar lying on a block, and the bar overhangs the block by 5 cm at each end; seen from low
// down the ends look loose, so each block is drawn as long as its bar.
const BOW_CLEATS = { Cleat_0_base: 'Cleat_0_horn', Cleat_1_base: 'Cleat_1_horn' };

// ---------------------------------------------------------------------------------------------------------
// Page furniture: loading bar and toast.
// ---------------------------------------------------------------------------------------------------------
const loadingEl = document.getElementById('loading');
const loadingFill = loadingEl.querySelector('.fill');
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(message, ms = 6000) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}
function progress(done, total) { loadingFill.style.width = Math.round(100 * done / Math.max(total, 1)) + '%'; }

// ---------------------------------------------------------------------------------------------------------
// Package files. Each file in assets/ has a data-only .js twin that stores the same bytes as a data URL in
// window.WILLOW_FILES, read with a classic script tag so the page also works when opened straight from disk.
// ---------------------------------------------------------------------------------------------------------
const fileShelf = () => (window.WILLOW_FILES = window.WILLOW_FILES || {});
function readPackageFile(rel) {
    return new Promise((resolve, reject) => {
        if (fileShelf()[rel]) { resolve(fileShelf()[rel]); return; }
        const tag = document.createElement('script');
        tag.src = 'assets/' + rel + '.js';
        tag.onload = () => { tag.remove(); fileShelf()[rel] ? resolve(fileShelf()[rel]) : reject(new Error('Empty package file: ' + rel)); };
        tag.onerror = () => { tag.remove(); reject(new Error('Missing package file: assets/' + rel + '.js')); };
        document.head.appendChild(tag);
    });
}
function dataUrlBytes(url) {
    const raw = atob(url.slice(url.indexOf(',') + 1));
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
}
async function readPicture(rel, size) {
    const bytes = dataUrlBytes(await readPackageFile(PACKAGE.textureDir + rel));
    // colorSpaceConversion none: normal, roughness and alpha maps must arrive untouched
    const options = { colorSpaceConversion: 'none', premultiplyAlpha: 'none' };
    if (size) Object.assign(options, { resizeWidth: size, resizeHeight: size, resizeQuality: 'high' });
    return createImageBitmap(new Blob([bytes], { type: 'image/jpeg' }), options);
}

const pictures = new Map();
function texture(rel, srgb) {
    const key = rel + (srgb ? '|srgb' : '');

        const tex = new THREE.Texture(pictureCache.get(rel));
        tex.flipY = false;                                     // glTF UVs
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
        tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

}
const pictureCache = new Map();

// Leaves, as the .blend draws them ("Dithered" alpha): each pixel is covered in proportion to the leaf's alpha, through
// the multisampled alpha-to-coverage, instead of three.js's cut at alphaTest. With the cut, a far canopy, whose
// filtered alpha falls under 0.5, lost almost every leaf. The shadow map and the water's mirror keep the cut.
function foliageCoverage(shader) {
    shader.fragmentShader = shader.fragmentShader.replace('#include <alphatest_fragment>', `
        if ( willowMirrorPass > 0.5 ) { if ( diffuseColor.a < alphaTest ) discard; }
        else {

            if ( diffuseColor.a < 0.02 ) discard;

        name,

        metalness: f.metalness ?? (f.metalnessMap ? 1 : 0),

    });

// the stand-ins (LAYER.leafStandIns). The see-through leaves and the glass (LAYER.seeThrough) are drawn last, over the
// water, against the solid scene's depth: drawn before it, the water pass painted over them wherever water lay behind.
const LAYER = { seeThrough: 2, leafStandIns: 1, waterStandIn: 3 };

    const root = gltf.scene;
    root.updateMatrixWorld(true);
    const batches = new Map();            // static boat and shore parts merged per material
    const repeats = new Map();            // meshes that share one geometry (shrubs, rocks, trees)
    const waterPlanes = [];
    const treeFar = [];
    const moorings = new Map();           // the cleats and piles the mooring ropes run between
    const fittings = [];                  // the posts that get a ball fitting (RAIL_FITTINGS)
    const doors = new Map();              // the doors that get a knob (DOOR_KNOBS)
    const doorParts = [];                 // the doors' parts, copied onto the inside of their walls (DOORS_INSIDE)
    const stubs = MOORING.lines.map(l => l[0]);
    root.traverse(o => {
        if (!o.isMesh) return;
        const name = (o.parent && o.parent.isGroup && o.parent !== root ? o.parent.name : o.name);
        if (MOORING.lines.some(l => l.includes(name))) moorings.set(name, new THREE.Box3().setFromObject(o));
        if (stubs.includes(name) || SHARED_POSTS.includes(name)) return;
        if (RAIL_FITTINGS.posts.includes(name)) fittings.push(new THREE.Box3().setFromObject(o));
        if (DOOR_KNOBS.doors.includes(name)) doors.set(name, new THREE.Box3().setFromObject(o));
        if (name.startsWith(SCENERY.treeFarSource)) { treeFar.push(o); return; }
        const family = name.startsWith(SCENERY.treeNear) ? SCENERY.treeNear : SCENERY.instanced.find(p => name.startsWith(p));
        if (family) {
            const key = family + '|' + o.material.name;
            if (!repeats.has(key)) repeats.set(key, { geometry: o.geometry, material: o.material.name, family, matrices: [] });
            repeats.get(key).matrices.push(o.matrixWorld.clone());
            return;
        }
        if (o.material.name === 'hb_water') { waterPlanes.push(o); return; }
        const g = o.geometry.clone().applyMatrix4(o.matrixWorld);
        for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
        if (SCENERY.faceDown.includes(name)) turnFacesUp(g);
        if (BOW_CLEATS[name]) stretchAlongX(g, new THREE.Box3().setFromObject(root.getObjectByName(BOW_CLEATS[name])));
        if (DOORS_INSIDE.moved[name]) g.translate(...DOORS_INSIDE.moved[name]);
        const door = DOORS_INSIDE.parts.find(d => name.startsWith(d));
        if (door) doorParts.push({ g, material: o.material.name, door });
        if (!batches.has(o.material.name)) batches.set(o.material.name, []);
        batches.get(o.material.name).push(g);
    });
    if (!batches.has('hb_rope')) batches.set('hb_rope', []);
    for (const [, cleat, pile] of MOORING.lines) batches.get('hb_rope').push(mooringRope(moorings.get(cleat), moorings.get(pile)));
    for (const b of fittings) batches.get('hb_rail').push(new THREE.SphereGeometry(RAIL_FITTINGS.radius, 24, 16).translate((b.min.x + b.max.x) / 2, b.max.y, (b.min.z + b.max.z) / 2));
    for (const { g, material, door } of doorParts) batches.get(material).push(insideCopy(g.clone(), doors.get(door)));
    for (const b of doors.values()) batches.get('Lantern_01_brass').push(doorKnob(b), insideCopy(doorKnob(b), b));
    const world = new THREE.Group();
    world.name = 'TheWillow';
    for (const [mat, list] of batches) {
        const mesh = new THREE.Mesh(mergeGeometries(list, false), finish(mat));
        mesh.name = 'batch:' + mat;
        const glass = !!FINISHES[mat].glass;
        mesh.castShadow = !glass && mat !== 'hb_ground' && mat !== 'hb_sand';
        mesh.receiveShadow = true;
        world.add(mesh);
        if (glass) mesh.layers.set(LAYER.seeThrough);
        if (FINISHES[mat].foliage) world.add(foliageStandIn(mesh, mat));
    }
    // instanced scenery
    const farGeometry = new Map(treeFar.map(o => [o.material.name, o.geometry]));
    const trees = [];
    for (const r of repeats.values()) {
        const near = new THREE.InstancedMesh(r.geometry, finish(r.material), r.matrices.length);
        r.matrices.forEach((m, i) => near.setMatrixAt(i, m));
        near.name = 'instances:' + r.family + r.material;
        near.castShadow = near.receiveShadow = true;
        if (r.family === SCENERY.treeNear) near.frustumCulled = false;   // which trees are near changes with the eye
        world.add(near);
        if (FINISHES[r.material].foliage) world.add(foliageStandIn(near, r.material));
        if (r.family === SCENERY.treeNear && farGeometry.has(r.material)) {
            const far = new THREE.InstancedMesh(farGeometry.get(r.material), finish(r.material), r.matrices.length);
            far.name = 'instances:far:' + r.material;
            far.castShadow = far.receiveShadow = true;
            far.frustumCulled = false;
            world.add(far);
            if (FINISHES[r.material].foliage) world.add(foliageStandIn(far, r.material));
            trees.push({ near, far, matrices: r.matrices, centres: r.matrices.map(m => new THREE.Vector3().setFromMatrixPosition(m)) });
        }
    }
    // water: the plane's height and texture repeat, then its textures for the water pass
    const plane = waterPlanes[0];
    plane.geometry.computeBoundingBox();
    const box = plane.geometry.boundingBox.clone().applyMatrix4(plane.matrixWorld);
    const uvs = plane.geometry.attributes.uv, pos = plane.geometry.attributes.position;
    water.uniforms.uHeight.value = box.max.y;
    water.uniforms.uTile.value = Math.abs((pos.getX(1) - pos.getX(0)) / (uvs.getX(1) - uvs.getX(0))) || WATER.tile;
    water.uniforms.tWaterColor.value = texture(FINISHES.hb_water.map, true);
    water.uniforms.tWaterNormal.value = texture(FINISHES.hb_water.normalMap);
    water.uniforms.tSky.value = scene.background;
    // the mirror, and the shadow map drawn during its pass, see the leaves' stand-ins
    water.mirrorEye.layers.enable(LAYER.leafStandIns);
    // the eye alone sees the lake's stand-in under the solid scene
    const lake = water.makeStandIn();
    lake.layers.set(LAYER.waterStandIn);
    camera.layers.enable(LAYER.waterStandIn);
    world.add(lake);
    scene.add(world);
    return { trees };
}

function turnFacesUp(g) {
    const index = g.index.array;
    for (let i = 0; i < index.length; i += 3) { const t = index[i + 1]; index[i + 1] = index[i + 2]; index[i + 2] = t; }
    g.index.needsUpdate = true;
    const n = g.attributes.normal.array;
    for (let i = 0; i < n.length; i++) n[i] = -n[i];
    g.attributes.normal.needsUpdate = true;
}

// The way out of the cabin through a door, given the door's world box: away from the cabin's middle (x -1.7), so +1
// (towards +x) for the bow door and -1 for the stern door.
const outwards = door => (door.min.x + door.max.x) / 2 > -1.7 ? 1 : -1;

// A door knob (DOOR_KNOBS) for a door, given the door's world box: on the face away from the cabin's middle (x -1.7),
// so +x for the bow door and -x for the stern door, 8 cm in from the door's starboard edge, at knob height above the
// deck the door stands on.
function doorKnob(door) {
    const out = outwards(door);
    const g = new THREE.LatheGeometry(DOOR_KNOBS.profile.map(([r, depth]) => new THREE.Vector2(r, depth)), 32);
    const uv = g.attributes.uv, [u0, v0, size] = DOOR_KNOBS.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + size * uv.getX(i), v0 + size * uv.getY(i));
    return g.rotateZ(-out * Math.PI / 2).translate(out > 0 ? door.max.x : door.min.x, door.min.y + DOOR_KNOBS.height, door.max.z - DOOR_KNOBS.fromEdge);
}

// A part of a door (DOORS_INSIDE), in world space, mirrored through the middle of the door's wall onto its inside. The
// mirror turns the triangles inside out, so two corners of each are swapped back.
function insideCopy(g, door) {
    const middle = (outwards(door) > 0 ? door.min.x : door.max.x) - outwards(door) * DOORS_INSIDE.wall / 2;
    g.applyMatrix4(new THREE.Matrix4().makeScale(-1, 1, 1).setPosition(2 * middle, 0, 0));
    const index = g.index.array;
    for (let i = 0; i < index.length; i += 3) [index[i + 1], index[i + 2]] = [index[i + 2], index[i + 1]];
    return g;
}

// Stretches a world-space geometry along x, about its own centre, to the length of another box (see BOW_CLEATS).
function stretchAlongX(g, to) {
    g.computeBoundingBox();
    const b = g.boundingBox, centre = (b.min.x + b.max.x) / 2, scale = (to.max.x - to.min.x) / (b.max.x - b.min.x);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setX(i, centre + (pos.getX(i) - centre) * scale);
    pos.needsUpdate = true;
    g.computeBoundingBox();
}

// A mooring rope from a cleat's neck to a pile, in world space (see MOORING). Both ends are tucked out of sight, one
// in the neck and one in the pile.
function mooringRope(neck, pile) {
    const r = MOORING.radius;
    const c = neck.getCenter(new THREE.Vector3()), p = pile.getCenter(new THREE.Vector3());
    const heading = Math.atan2(p.z - c.z, p.x - c.x);            // from the cleat towards the pile, in the x-z plane
    // The turns run with the angle falling, so the rope leaves the cleat on its outboard side, over the gunwale's outer
    // edge: leaving on the deck side, the slack span ran along the gunwale and sank 4 cm into it.
    const side = heading + Math.PI / 2;
    const at = (centre, radius, angle, y) => new THREE.Vector3(centre.x + radius * Math.cos(angle), y, centre.z + radius * Math.sin(angle));
    // most of a turn round the neck, squeezed between the base and the horns
    const ring = Math.max(neck.max.x - neck.min.x, neck.max.z - neck.min.z) / 2 + r, ringY = neck.min.y + 0.01;
    const points = [new THREE.Vector3(c.x, ringY, c.z)];
    for (let i = 0; i <= 16; i++) points.push(at(c, ring, side + 1.6 * Math.PI * (1 - i / 16), ringY));
    // the slack span, leaving the turn and reaching the pile along the same heading
    const loop = (pile.max.x - pile.min.x) / 2 + r, loopY = pile.max.y - MOORING.pileDrop;
    const from = points[points.length - 1], to = at(p, loop, side, loopY);
    const span = Math.hypot(to.x - from.x, to.z - from.z);
    for (let i = 1; i < 24; i++) {
        const t = i / 24;
        points.push(new THREE.Vector3(from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t - MOORING.sag * span * 4 * t * (1 - t),
            from.z + (to.z - from.z) * t));
    }
    // a round turn and a little more on the pile, dropping a rope's width, then the end goes into the pile
    for (let i = 0; i <= 24; i++) points.push(at(p, loop, side - (2 * Math.PI + 0.5) * i / 24, loopY - 2.2 * r * i / 24));
    points.push(at(p, loop - 2 * r, side - 2 * Math.PI - 0.7, loopY - 2.2 * r));
    const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
    const length = curve.getLength();
    const g = new THREE.TubeGeometry(curve, Math.ceil(length / 0.015), r, MOORING.sides, false);
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * length * MOORING.repeatsPerMetre, uv.getY(i) * 2 * Math.PI * r * MOORING.repeatsPerMetre);
    return g;
}

// Trees within SCENERY.farTreeFrom metres of the eye use the full copy, the rest the lighter one.
function sortTrees(trees) {
    for (const t of trees) {
        let n = 0, f = 0;
        t.centres.forEach((c, i) => {
            if (c.distanceTo(camera.position) < SCENERY.farTreeFrom) t.near.setMatrixAt(n++, t.matrices[i]);
            else t.far.setMatrixAt(f++, t.matrices[i]);
        });
        t.near.count = n; t.far.count = f;
        if (t.near.userData.standIn) t.near.userData.standIn.count = n;
        if (t.far.userData.standIn) t.far.userData.standIn.count = f;
        t.near.instanceMatrix.needsUpdate = t.far.instanceMatrix.needsUpdate = true;
    }
}

async function loadSky() {
    const bytes = dataUrlBytes(await readPackageFile(PACKAGE.sky));
    const hdr = new RGBELoader().setDataType(THREE.HalfFloatType).parse(bytes.buffer);
    const sky = new THREE.DataTexture(hdr.data, hdr.width, hdr.height, THREE.RGBAFormat, THREE.HalfFloatType);
    sky.colorSpace = THREE.LinearSRGBColorSpace;
    sky.mapping = THREE.EquirectangularReflectionMapping;
    sky.minFilter = sky.magFilter = THREE.LinearFilter;
    sky.generateMipmaps = false;
    sky.flipY = true;
    sky.needsUpdate = true;
    scene.background = sky;
    scene.backgroundIntensity = DAYLIGHT.skyStrength;
    // the light the materials see: the sky clipped at the sun threshold, over the lake
    const world = lightingWorld(sky, DAYLIGHT.reflectLake);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(world.texture).texture;
    scene.environmentIntensity = DAYLIGHT.skyStrength;
    pmrem.dispose(); world.dispose();
    if (DAYLIGHT.shDiffuse) {
        const probe = new THREE.LightProbe();
        skyHarmonics(hdr.data, hdr.width, hdr.height).forEach((c, i) => probe.sh.coefficients[i].copy(c));
        probe.layers.enableAll();
        scene.add(probe);
        water.uniforms.uSkyUp.value.copy(probe.sh.coefficients[0]).multiplyScalar(0.886227).addScaledVector(probe.sh.coefficients[1], 1.023328);
    }
}

// The sky the reflections see: clipped at the sun threshold; below the horizon, lakeShare of the HDRI's lower half is
// replaced by the lake (the sky above mirrored with Schlick's Fresnel for the water's F0 0.04, over its dark colour).
function lightingWorld(sky, lakeShare) {
    const target = new THREE.WebGLRenderTarget(1024, 512, { type: THREE.HalfFloatType, colorSpace: THREE.LinearSRGBColorSpace, depthBuffer: false });
    const pass = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
        uniforms: { tSky: { value: sky }, uCap: { value: DAYLIGHT.sunThreshold }, uLake: { value: lakeShare }, uWater: { value: new THREE.Vector3(...DAYLIGHT.waterGlow) } },
        vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
        fragmentShader: `uniform sampler2D tSky; uniform float uCap; uniform float uLake; uniform vec3 uWater; varying vec2 vUv;
            void main() {
                vec3 c = min(texture2D(tSky, vUv).rgb, vec3(uCap));
                if (vUv.y < 0.5) {
                    float f = 0.04 + 0.96 * pow(1.0 - sin((0.5 - vUv.y) * 3.14159265), 5.0);
                    vec3 lake = f * min(texture2D(tSky, vec2(vUv.x, 1.0 - vUv.y)).rgb, vec3(uCap)) + (1.0 - f) * uWater;
                    c = mix(c, lake, uLake);
                }
                gl_FragColor = vec4(c, 1.0);
            }`,
        depthTest: false, depthWrite: false
    }));
    pass.frustumCulled = false;
    const stage = new THREE.Scene(); stage.add(pass);
    renderer.setRenderTarget(target);
    renderer.render(stage, new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1));
    renderer.setRenderTarget(null);
    pass.geometry.dispose(); pass.material.dispose();
    return target;
}
// First-order spherical harmonics of the diffuse sky light (three.js order: constant, y, z, x), every 4th texel.
function skyHarmonics(half, w, h) {
    const read = THREE.DataUtils.fromHalfFloat, cap = DAYLIGHT.sunThreshold, step = 4;
    const sums = [0, 1, 2, 3].map(() => new THREE.Vector3());
    const texel = (x, y) => { const i = (y * w + x) * 4; return [0, 1, 2].map(k => Math.min(read(half[i + k]), cap)); };
    for (let y = step / 2; y < h; y += step) {
        const lat = (0.5 - (y + 0.5) / h) * Math.PI, cosLat = Math.cos(lat), sinLat = Math.sin(lat);
        const solid = (2 * Math.PI / w) * (Math.PI / h) * step * step * cosLat * DAYLIGHT.skyStrength;
        for (let x = step / 2; x < w; x += step) {
            const lon = ((x + 0.5) / w - 0.5) * 2 * Math.PI;
            const dir = [cosLat * Math.cos(lon), sinLat, cosLat * Math.sin(lon)];
            const L = DAYLIGHT.groundOccluded && lat < 0 ? DAYLIGHT.waterGlow : texel(x, y);
            const basis = [0.282095, 0.488603 * dir[1], 0.488603 * dir[2], 0.488603 * dir[0]];
            basis.forEach((b, i) => sums[i].add(new THREE.Vector3(L[0], L[1], L[2]).multiplyScalar(b * solid)));
        }
    }
    return sums;
}

// ---------------------------------------------------------------------------------------------------------
// Start-up.
// ---------------------------------------------------------------------------------------------------------
let scenery = { trees: [] };
let ready = false;
async function start() {
    const sizes = new Map();      // a map shared with a boat material keeps its full size
    for (const f of Object.values(FINISHES)) for (const rel of [f.map, f.roughnessMap, f.metalnessMap, f.normalMap, f.alphaMap]) {
        if (rel) sizes.set(rel, sizes.has(rel) && !sizes.get(rel) ? 0 : (f.propSize || 0));
    }
    const total = sizes.size + 2;
    let done = 0;
    const tick = () => progress(++done, total);
    const picturesReady = Promise.all([...sizes].map(([rel, size]) => readPicture(rel, size).then(bmp => { pictureCache.set(rel, bmp); tick(); })));
    const skyReady = loadSky().then(tick);
    const draco = new DRACOLoader().setDecoderPath(PACKAGE.dracoPath);
    const loader = new GLTFLoader().setDRACOLoader(draco);
    const modelBytes = dataUrlBytes(await readPackageFile(PACKAGE.model));
    const gltf = await loader.parseAsync(modelBytes.buffer, '');
    tick();
    await Promise.all([picturesReady, skyReady]);
    scenery = await buildScene(gltf);
    draco.dispose();
    sortTrees(scenery.trees);
    resize();
    updateLampUniforms();
    renderer.setRenderTarget(sceneFrame);
    await renderer.compileAsync(scene, camera, scene);
    renderer.setRenderTarget(null);
    renderer.shadowMap.needsUpdate = true;
    ready = true;
    document.documentElement.dataset.ready = 'true';
    loadingEl.classList.add('done');
    setTimeout(() => loadingEl.remove(), 900);
}

function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    const pr = renderer.getPixelRatio();
    sceneFrame.setSize(Math.round(w * pr), Math.round(h * pr));
    linearFrame.setSize(Math.round(w * pr), Math.round(h * pr));
    water.resize(w, h, pr);
    const before = camera.aspect;
    camera.aspect = w / h;
    // keep the visitor's own angle and zoom; only the opening distance rule follows the new shape
    const d = camera.position.distanceTo(controls.target);
    const want = framingDistance(camera.aspect), had = framingDistance(before);
    camera.position.sub(controls.target).setLength(THREE.MathUtils.clamp(d * want / had, controls.minDistance, controls.maxDistance)).add(controls.target);
    controls.minDistance = Math.min(VIEW.minDistance, want);
    controls.maxDistance = Math.max(VIEW.maxDistance, want);
    camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
let waterTime = 0;
function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    controls.update();
    if (!ready) return;
    waterTime += dt;
    drawFrame();
}
// One frame, in order: near or far copies of the trees by distance, the mirrored view the water reflects, the lantern
// light for this eye, the solid scene, the water over it, the leaves and glass on top, the leaves' depth, the blend
// with the last frame, then the AgX look to the screen.
function drawFrame() {
    sortTrees(scenery.trees);
    camera.updateMatrixWorld();
    water.drawMirror();
    updateLampUniforms();
    renderer.setRenderTarget(sceneFrame);
    renderer.render(scene, camera);
    water.render(sceneFrame, linearFrame, waterTime);
    drawSeeThrough();
    drawLeafDepth();
    finishPass.render(temporal.render(linearFrame, sceneFrame.depthTexture, water.uniforms));
}

// Leaves and glass, last and over the water: linearFrame holds the picture with the water laid in and the solid
// scene's depth (written by the water pass), so they blend over the water and hide behind solid things.
const seeThroughEye = new THREE.PerspectiveCamera();
function drawSeeThrough() {
    seeThroughEye.copy(camera);
    seeThroughEye.layers.set(LAYER.seeThrough);
    const sky = scene.background, autoClear = renderer.autoClear;
    scene.background = null; renderer.autoClear = false;
    renderer.setRenderTarget(linearFrame);
    renderer.render(scene, seeThroughEye);
    renderer.autoClear = autoClear; scene.background = sky;
}

// The leaves' depth, for the blend with the last frame alone. The see-through leaves write none, so a leaf's pixel had
// the depth of whatever lay behind it and was looked up a frame ago where that had been: a potted plant on the terrace
// faded while the view turned. After the colour is done, the leaves' stand-ins (cut at alpha 0.5) write their depth,
// with a plain material that writes no colour.
const leafDepthEye = new THREE.PerspectiveCamera();
const depthOnly = new Map();
function drawLeafDepth() {
    leafDepthEye.copy(camera);
    leafDepthEye.layers.set(LAYER.leafStandIns);
    const shaded = leafStandIns.map(m => m.material);
    leafStandIns.forEach((m, i) => {
        const full = shaded[i];
        if (!depthOnly.has(full)) depthOnly.set(full, new THREE.MeshBasicMaterial({ map: full.map, alphaMap: full.alphaMap,
            alphaTest: full.alphaTest, side: full.side, colorWrite: false }));
        m.material = depthOnly.get(full);
    });
    const sky = scene.background, autoClear = renderer.autoClear;
    scene.background = null; renderer.autoClear = false;
    renderer.setRenderTarget(linearFrame);
    renderer.render(scene, leafDepthEye);
    renderer.autoClear = autoClear; scene.background = sky;
    leafStandIns.forEach((m, i) => { m.material = shaded[i]; });
}

start().then(frame).catch(error => {
    console.error(error);
    loadingEl.querySelector('p').textContent = 'The 3D tour could not load.';
    toast('Sorry, the 3D tour could not be loaded: ' + error.message);
});
</script>
