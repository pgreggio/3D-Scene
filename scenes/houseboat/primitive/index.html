<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Willow — Houseboat Holiday Let</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #e9c79a; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(60,30,10,0.28) 100%);
    }
    #hud {
        position: absolute; top: 16px; left: 16px; z-index: 10; max-width: 292px;
        background: rgba(255, 247, 233, 0.90); color: #4a3220;
        padding: 15px 18px 14px; border-radius: 14px;
        backdrop-filter: blur(6px); border: 1px solid rgba(160, 110, 60, 0.28);
        box-shadow: 0 10px 30px rgba(90, 50, 15, 0.22);
    }
    #hud .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    #hud svg { flex: none; display: block; }
    #hud h1 { font-size: 21px; letter-spacing: 0.2px; font-weight: 600; color: #6a3d1c; margin: 0; }
    #hud .sub { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #a26a36; margin-bottom: 8px; }
    #hud p { font-size: 13px; line-height: 1.5; color: #5a4230; }
    #spots {
        position: absolute; top: 16px; right: 16px; z-index: 10;
        display: flex; flex-direction: column; gap: 8px;
    }
    #spots button {
        font: 500 13px 'Segoe UI', Arial, sans-serif; color: #5a3a20;
        background: rgba(255, 247, 233, 0.90); border: 1px solid rgba(160, 110, 60, 0.32);
        border-radius: 22px; padding: 8px 14px 8px 12px; cursor: pointer;
        display: flex; align-items: center; gap: 8px;
        box-shadow: 0 4px 14px rgba(90, 50, 15, 0.15); transition: background .2s, color .2s;
    }
    #spots button svg { flex: none; }
    #spots button:hover, #spots button.on { background: #fff3dc; color: #7a3f12; }
    #hint {
        position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
        color: #6b4a2c; font-size: 12px; letter-spacing: 0.6px;
        background: rgba(255, 248, 234, 0.82); padding: 7px 16px; border-radius: 20px;
        border: 1px solid rgba(160, 110, 60, 0.25); white-space: nowrap;
    }
    @media (max-width: 900px) {
        #hud { top: 12px; left: 12px; max-width: min(270px, calc(100% - 24px)); padding: 12px 14px; }
        #hud .row { gap: 8px; }
        #hud svg { width: 22px; height: 22px; }
        #hud h1 { font-size: 18px; }
        #hud .sub { letter-spacing: 1.1px; }
        #hud p { font-size: 12px; }
        #spots {
            top: auto; left: 10px; right: 10px; bottom: 84px;
            width: auto; max-width: calc(100% - 20px);
            transform: none; flex-direction: row; flex-wrap: wrap;
            justify-content: center; gap: 6px;
        }
        #spots button { padding: 6px 10px; font-size: 12px; border-radius: 18px; gap: 6px; }
        #hint {
            bottom: 10px; max-width: calc(100% - 24px);
            white-space: normal; text-align: center; line-height: 1.35;
        }
    }
    @media (max-width: 420px) {
        #hud { padding: 10px 12px; }
        #hud p { font-size: 11px; }
        #spots { gap: 5px; }
        #spots button { padding: 5px 8px; font-size: 11px; }
        #spots button svg { width: 12px; height: 12px; }
    }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette" data-role="shade"></div>
<div id="hud">
    <div class="row">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 17h20l-2.6 4.2H5.6z" fill="#8a5a30"/><rect x="7" y="10" width="11" height="7" rx="1" fill="#f3e2c2" stroke="#8a5a30"/><path d="M6 10h13" stroke="#8a5a30" stroke-width="1.6"/><path d="M8 7.5h9" stroke="#c9a06a" stroke-width="1.2"/><circle cx="21" cy="6" r="2.4" fill="#f0a24a"/></svg>
        <h1>The Willow</h1>
    </div>
    <div class="sub">Houseboat · sleeps 4</div>
    <p>Take a look around before you book. Spin the boat to see the roof terrace, the bow deck and the view from every window.</p>
</div>
<div id="spots">
    <button data-k="tour" class="on"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 3.5v3.5l2.4 1.4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>Slow tour</button>
    <button data-k="terrace"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 11h12M2 11V6h10v5M2 6V4M12 6V4M5 11V8M9 11V8" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>Roof terrace</button>
    <button data-k="bow"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 9h9l3-3M2 9l1.5 3h7L13 6" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>Bow deck</button>
    <button data-k="windows"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.2"/></svg>Window views</button>
</div>
<div id="hint">Drag to look around · Scroll to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Water.js"></script>
<script>
(function () {
    let wl_container = document.getElementById('app');
    let wl_renderer = new THREE.WebGLRenderer({ antialias: true });
    wl_renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    wl_renderer.setSize(window.innerWidth, window.innerHeight);
    wl_renderer.shadowMap.enabled = true;
    wl_renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wl_renderer.outputEncoding = THREE.sRGBEncoding;
    wl_renderer.toneMapping = THREE.ACESFilmicToneMapping;
    wl_renderer.toneMappingExposure = 1.05;
    wl_container.appendChild(wl_renderer.domElement);

    let wl_scene = new THREE.Scene();
    wl_scene.fog = new THREE.Fog(0xc4c8cc, 180, 600);

    function wl_V(wl_x, wl_y, z) { return new THREE.Vector3(wl_x, z, -wl_y); }
    let wl_SUN = wl_V(-0.75, -0.45, 0.26).normalize();

    let wl_camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 3000);
    let wl_TARGET = wl_V(0.2, 0.3, 1.9);
    let wl_CAM0 = wl_V(15.5, -14.0, 6.6);
    wl_camera.position.copy(wl_CAM0);

    let wl_controls = new THREE.OrbitControls(wl_camera, wl_renderer.domElement);
    wl_controls.target.set(wl_TARGET.x, wl_TARGET.y, wl_TARGET.z);
    wl_controls.enableDamping = true;
    wl_controls.dampingFactor = 0.06;
    wl_controls.enablePan = true;
    wl_controls.minDistance = 3;
    wl_controls.maxDistance = 48;
    wl_controls.maxPolarAngle = Math.PI * 0.49;

    wl_scene.add(new THREE.HemisphereLight(0xdfe4ea, 0x6a6448, 0.6));
    let wl_sun = new THREE.DirectionalLight(0xffd9a6, 2.3);
    wl_sun.position.copy(wl_SUN.clone().multiplyScalar(40));
    wl_sun.target.position.set(0, 0, 0);
    wl_sun.castShadow = true;
    wl_sun.shadow.mapSize.set(2048, 2048);
    let wl_sc = wl_sun.shadow.camera;
    wl_sc.left = -16; wl_sc.right = 16; wl_sc.top = 16; wl_sc.bottom = -16; wl_sc.near = 1; wl_sc.far = 100;
    wl_sc.updateProjectionMatrix();
    wl_sun.shadow.bias = -0.0004;
    wl_sun.shadow.normalBias = 0.02;
    wl_scene.add(wl_sun);
    wl_scene.add(wl_sun.target);
    function wl_treeLight(left, right, top, bottom) {
        let wl_l = new THREE.DirectionalLight(0xffd9a6, 2.3);
        wl_l.position.copy(wl_SUN.clone().multiplyScalar(140));
        wl_l.target.position.set(0, 0, 0);
        wl_l.castShadow = true;
        wl_l.shadow.mapSize.set(2048, 2048);
        let wl_c = wl_l.shadow.camera;
        wl_c.left = left; wl_c.right = right; wl_c.top = top; wl_c.bottom = bottom; wl_c.near = 1; wl_c.far = 340;
        wl_c.updateProjectionMatrix();
        wl_l.shadow.bias = -0.0006;
        wl_l.shadow.normalBias = 0.04;
        wl_scene.add(wl_l);
        wl_scene.add(wl_l.target);
    }
    wl_treeLight(-130, -37, 40, -30);
    wl_treeLight(-37, -14, 40, 14);
    wl_treeLight(-16, 40, 60, 10);
    let wl_pierSun = new THREE.DirectionalLight(0xffd9a6, 2.3);
    wl_pierSun.position.copy(wl_SUN.clone().multiplyScalar(40));
    wl_pierSun.target.position.set(0, 0, 0);
    wl_pierSun.castShadow = true;
    wl_pierSun.shadow.mapSize.set(1024, 1024);
    let wl_pc = wl_pierSun.shadow.camera;
    wl_pc.left = -34; wl_pc.right = -16; wl_pc.top = 10; wl_pc.bottom = -6; wl_pc.near = 1; wl_pc.far = 100;
    wl_pc.updateProjectionMatrix();
    wl_pierSun.shadow.bias = -0.0004;
    wl_pierSun.shadow.normalBias = 0.02;
    wl_scene.add(wl_pierSun);
    wl_scene.add(wl_pierSun.target);
    let wl_treeCancel = new THREE.DirectionalLight(0xffd9a6, -9.2);
    wl_treeCancel.position.copy(wl_SUN.clone().multiplyScalar(140));
    wl_treeCancel.target.position.set(0, 0, 0);
    wl_scene.add(wl_treeCancel);
    wl_scene.add(wl_treeCancel.target);

    function wl_hash(wl_x, wl_y, wl_s) { let wl_h = Math.sin(wl_x * 127.1 + wl_y * 311.7 + wl_s * 74.7) * 43758.5453; return wl_h - Math.floor(wl_h); }
    function wl_vnoise(wl_x, wl_y, wl_s, wl_p) {
        let wl_xi = Math.floor(wl_x), yi = Math.floor(wl_y), xf = wl_x - wl_xi, yf = wl_y - yi;
        let wl_u = xf * xf * (3 - 2 * xf), wl_v = yf * yf * (3 - 2 * yf);
        function wl_h(wl_a, wl_b) { return wl_hash(((wl_a % wl_p) + wl_p) % wl_p, ((wl_b % wl_p) + wl_p) % wl_p, wl_s); }
        return (wl_h(wl_xi, yi) * (1 - wl_u) + wl_h(wl_xi + 1, yi) * wl_u) * (1 - wl_v) + (wl_h(wl_xi, yi + 1) * (1 - wl_u) + wl_h(wl_xi + 1, yi + 1) * wl_u) * wl_v;
    }
    function wl_fbm(wl_x, wl_y, wl_s, oct, wl_p) {
        let wl_a = 0.5, tot = 0, nrm = 0, wl_f = 1;
        for (let wl_i = 0; wl_i < oct; wl_i++) { tot += wl_a * wl_vnoise(wl_x * wl_f, wl_y * wl_f, wl_s + wl_i, wl_p * wl_f); nrm += wl_a; wl_a *= 0.5; wl_f *= 2; }
        return tot / nrm;
    }
    function wl_dataTex(size, fn) {
        let wl_data = new Uint8Array(size * size * 4);
        for (let wl_y = 0; wl_y < size; wl_y++) for (let wl_x = 0; wl_x < size; wl_x++) {
            let wl_col = fn(wl_x / size, wl_y / size), wl_i = (wl_y * size + wl_x) * 4, wl_k;
            for (wl_k = 0; wl_k < 3; wl_k++) wl_data[wl_i + wl_k] = Math.max(0, Math.min(255, wl_col[wl_k]));
            wl_data[wl_i + 3] = 255;
        }
        let wl_t = new THREE.DataTexture(wl_data, size, size, THREE.RGBAFormat);
        wl_t.wrapS = wl_t.wrapT = THREE.RepeatWrapping;
        wl_t.magFilter = THREE.LinearFilter;
        wl_t.minFilter = THREE.LinearMipmapLinearFilter;
        wl_t.generateMipmaps = true;
        wl_t.flipY = false;
        wl_t.anisotropy = 8;
        wl_t.needsUpdate = true;
        return wl_t;
    }
    function wl_mixc(wl_a, wl_b, wl_t) { return [wl_a[0] + (wl_b[0] - wl_a[0]) * wl_t, wl_a[1] + (wl_b[1] - wl_a[1]) * wl_t, wl_a[2] + (wl_b[2] - wl_a[2]) * wl_t]; }
    function wl_hex(wl_h) { return [(wl_h >> 16) & 255, (wl_h >> 8) & 255, wl_h & 255]; }
    function wl_planks(cA, cB, wl_n, seed, size) {
        let wl_A = wl_hex(cA), B = wl_hex(cB);
        return wl_dataTex(size || 256, function (wl_u, wl_v) {
            let wl_row = Math.floor(wl_v * wl_n), fv = wl_v * wl_n - wl_row, tone = wl_hash(wl_row, 3, seed);
            let wl_off = wl_hash(wl_row, 9, seed) * 8;
            let wl_grain = wl_fbm(wl_u * 3 + wl_off, fv * 0.6 + wl_row * 3.1, seed, 4, 64);
            let wl_streak = Math.sin((wl_u * 40 + wl_grain * 9 + wl_off)) * 0.5 + 0.5;
            let wl_c = wl_mixc(wl_A, B, 0.25 + tone * 0.5 + (wl_grain - 0.5) * 0.7 + wl_streak * 0.08);
            let wl_gap = fv < 0.04 || fv > 0.96 ? 0.45 : 1;
            let wl_butt = Math.abs(((wl_u + wl_hash(wl_row, 1, seed)) * 2) % 1) < 0.008 ? 0.55 : 1;
            let wl_k = wl_gap * wl_butt;
            return [wl_c[0] * wl_k, wl_c[1] * wl_k, wl_c[2] * wl_k];
        });
    }
    function wl_plaster(cA, cB, seed) {
        let wl_A = wl_hex(cA), B = wl_hex(cB);
        return wl_dataTex(128, function (wl_u, wl_v) {
            let wl_n = wl_fbm(wl_u * 8, wl_v * 8, seed, 4, 8), wl_m = wl_fbm(wl_u * 2, wl_v * 2, seed + 7, 3, 2);
            return wl_mixc(wl_A, B, Math.min(1, Math.max(0, (wl_n - 0.5) * 1.6 + wl_m * 0.5)));
        });
    }
    function wl_brushed(cA, cB, seed) {
        let wl_A = wl_hex(cA), B = wl_hex(cB);
        return wl_dataTex(128, function (wl_u, wl_v) {
            let wl_n = wl_fbm(wl_u * 2, wl_v * 60, seed, 3, 2) * 0.7 + wl_fbm(wl_u * 10, wl_v * 10, seed + 3, 3, 10) * 0.3;
            return wl_mixc(wl_A, B, wl_n);
        });
    }
    function wl_groundTex(seed) {
        let wl_C = [wl_hex(0x5f5a24), wl_hex(0x7f7a44), wl_hex(0x948f6a), wl_hex(0x4b4a1c)];
        return wl_dataTex(512, function (wl_u, wl_v) {
            let wl_a = wl_fbm(wl_u * 2, wl_v * 2, seed, 3, 2), wl_b = wl_fbm(wl_u * 8, wl_v * 8, seed + 5, 3, 8);
            let wl_c = wl_fbm(wl_u * 32, wl_v * 32, seed + 9, 2, 32), d = wl_fbm(wl_u * 96, wl_v * 96, seed + 11, 1, 96);
            let wl_col = wl_mixc(wl_C[0], wl_C[1], wl_a);
            wl_col = wl_mixc(wl_col, wl_C[2], Math.max(0, wl_b - 0.55) * 1.8);
            wl_col = wl_mixc(wl_col, wl_C[3], Math.max(0, wl_c - 0.6) * 1.6);
            let wl_k = 0.86 + d * 0.28;
            return [wl_col[0] * wl_k, wl_col[1] * wl_k, wl_col[2] * wl_k];
        });
    }
    function wl_sandTex(seed) {
        return wl_dataTex(256, function (wl_u, wl_v) {
            let wl_n = wl_fbm(wl_u * 16, wl_v * 16, seed, 4, 16), wl_w = wl_fbm(wl_u * 3, wl_v * 3, seed + 2, 3, 3);
            let wl_wet = Math.max(0, 0.55 - wl_w) * 1.4;
            return wl_mixc(wl_mixc(wl_hex(0x95876f), wl_hex(0x695a44), wl_n), wl_hex(0x4f4433), wl_wet);
        });
    }
    function wl_barkTex(seed) {
        return wl_dataTex(128, function (wl_u, wl_v) {
            let wl_n = wl_fbm(wl_u * 10, wl_v * 2, seed, 4, 10);
            let wl_r = Math.pow(Math.abs(Math.sin(wl_u * 30 + wl_n * 6)), 0.4);
            return wl_mixc(wl_hex(0x605446), wl_hex(0xad9f92), wl_n * 0.6 + wl_r * 0.4);
        });
    }
    function wl_ropeTex(seed) {
        return wl_dataTex(64, function (wl_u, wl_v) {
            let wl_s = Math.sin((wl_u * 6 + wl_v * 6) * Math.PI * 2) * 0.5 + 0.5;
            return wl_mixc(wl_hex(0x4f432d), wl_hex(0x928263), wl_s * 0.7 + wl_fbm(wl_u * 20, wl_v * 20, seed, 2, 20) * 0.3);
        });
    }
    function wl_leafTex(cA, cB, seed) {
        return wl_dataTex(128, function (wl_u, wl_v) {
            let wl_n = wl_fbm(wl_u * 6, wl_v * 6, seed, 4, 6), cell = wl_vnoise(wl_u * 24, wl_v * 24, seed + 4, 24);
            return wl_mixc(wl_hex(cA), wl_hex(cB), wl_n * 0.7 + cell * 0.3);
        });
    }
    function wl_waterNormal() {
        let wl_waves = [];
        for (let wl_i = 0; wl_i < 18; wl_i++) {
            let wl_kx = Math.round(wl_hash(wl_i, 1, 4) * 16 - 8), ky = Math.round(wl_hash(wl_i, 2, 4) * 16 - 8);
            if (wl_kx === 0 && ky === 0) continue;
            wl_waves.push([wl_kx, ky, 1 / Math.pow(Math.hypot(wl_kx, ky), 1.3), wl_hash(wl_i, 3, 4) * 6.28]);
        }
        return wl_dataTex(256, function (wl_u, wl_v) {
            let wl_dx = 0, dy = 0;
            for (let wl_i = 0; wl_i < wl_waves.length; wl_i++) {
                let wl_w = wl_waves[wl_i], ph = (wl_w[0] * wl_u + wl_w[1] * wl_v) * Math.PI * 2 + wl_w[3], wl_c = Math.cos(ph) * wl_w[2];
                wl_dx += wl_c * wl_w[0]; dy += wl_c * wl_w[1];
            }
            let wl_nx = -wl_dx * 0.07, ny = -dy * 0.07, l = Math.sqrt(wl_nx * wl_nx + ny * ny + 1);
            return [(wl_nx / l * 0.5 + 0.5) * 255, (ny / l * 0.5 + 0.5) * 255, (1 / l * 0.5 + 0.5) * 255];
        });
    }
    function wl_std(map, rough, metal) {
        let wl_m = new THREE.MeshStandardMaterial({ map: map, roughness: rough, metalness: metal || 0 });
        if (map) {
            map.encoding = THREE.sRGBEncoding;
        }
        return wl_m;
    }
    let wl_mats = {
        pier: wl_std(wl_planks(0x4a2008, 0x87421b, 10, 2), 0.75),
        pile: wl_std(wl_barkTex(11), 0.95),
        rope: wl_std(wl_ropeTex(12), 0.95),
        metal: wl_std(wl_brushed(0x1b1b18, 0x2c2c28, 7), 0.45, 0.7),
        ground: wl_std(wl_groundTex(9), 1),
        sand: wl_std(wl_sandTex(10), 0.95),
        bark: wl_std(wl_plaster(0x5a4c40, 0x9a8d80, 25), 0.9),
        leaf: wl_std(wl_leafTex(0x3f5a38, 0x7a9468, 26), 0.8),
        trim: wl_std(wl_planks(0x43190d, 0x723a21, 4, 5), 0.65),
        hull: wl_std(wl_planks(0x483321, 0x75604f, 7, 1), 0.8),
        cabin: wl_std(wl_plaster(0xcdaf77, 0xe3c58d, 3), 0.9),
        rail: wl_std(wl_brushed(0xcfcfca, 0xefefea, 6), 0.22, 0.65),
        sofa: wl_std(wl_plaster(0x38281d, 0x6c5641, 22), 1),
        sideTable: wl_std(wl_planks(0x4b3726, 0xa4764a, 3, 23, 128), 0.6),
        rug: wl_std(wl_plaster(0x294d6b, 0x7395b0, 24), 1),
        armchair: wl_std(wl_plaster(0x4a4540, 0xa6a4a2, 28), 1),
        diningWood: wl_std(wl_planks(0x723d1f, 0x9f5f37, 4, 29, 128), 0.6),
        chairWood: wl_std(wl_planks(0x1d120b, 0x3a2a1c, 4, 30, 128), 0.6),
        chairGreen: wl_std(wl_plaster(0x2c3a2c, 0x4d5a47, 31), 1),
        leafA: wl_std(wl_leafTex(0x414a27, 0x757d45, 13), 0.85),
        leafB: wl_std(wl_leafTex(0x3a4322, 0x6c7440, 14), 0.85),
        terracotta: wl_std(wl_plaster(0x7a543c, 0xb47955, 15), 0.85),
        benchPaint: wl_std(wl_planks(0x311d19, 0x825a44, 5, 16, 128), 0.8),
        tableWood: wl_std(wl_planks(0x63452c, 0xb87c49, 6, 17, 128), 0.7),

            wl_t.set(wl_t.x - wl_dx, wl_t.y - wl_dy, wl_t.z - wl_dz);
            wl_camera.position.x -= wl_dx;
            wl_camera.position.y -= wl_dy;
            wl_camera.position.z -= wl_dz;
        }
    }

    // ---------- Animation: gentle bobbing on the water ----------
    let wl_clock = new THREE.Clock();
    let wl_t = 0;
    function wl_animate() {
        requestAnimationFrame(wl_animate);
        let wl_dt = Math.min(wl_clock.getDelta(), 0.05);
        wl_t += wl_dt;
        if (wl_water.material.uniforms && wl_water.material.uniforms.time) wl_water.material.uniforms.time.value = wl_t * 0.35;
        if (wl_sky.material.uniforms && wl_sky.material.uniforms.time) wl_sky.material.uniforms.time.value = wl_t;
        wl_lanterns.forEach(function (l, wl_i) { l.intensity = 0.85 + Math.sin(wl_t * 7 + wl_i * 2) * 0.05 + Math.sin(wl_t * 13 + wl_i) * 0.03; });
        if (wl_fly) {
            wl_fly.k = Math.min(1, wl_fly.k + wl_dt / 1.6);
            let wl_e = wl_fly.k * wl_fly.k * (3 - 2 * wl_fly.k);
            wl_camera.position.lerpVectors(wl_fly.p0, wl_fly.p1, wl_e);
            wl_controls.target.lerpVectors(wl_fly.t0, wl_fly.t1, wl_e);
            if (wl_fly.k >= 1) wl_fly = null;
        }
        wl_controls.update();
        wl_clampOrbit();
        wl_lockCamera();
        wl_renderer.render(wl_scene, wl_camera);
    }
    wl_animate();

    // ---------- Resize ----------
    window.addEventListener('resize', function () {
        wl_camera.aspect = window.innerWidth / window.innerHeight;
        wl_camera.updateProjectionMatrix();
        wl_renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // handle exposed for tests
    window.__WILLOW__ = { scene: wl_scene, camera: wl_camera, boat: wl_boat, water: wl_water, shore: wl_shore, sky: wl_sky };
})();
</script>
