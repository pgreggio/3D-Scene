<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evening Beach Camper Van — 3D Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0c1a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f6efe2;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #ui-panel {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      width: 290px;
      background: rgba(15, 19, 34, 0.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 200, 130, 0.24);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    #ui-panel h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #ffd39b;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #ui-panel p.subtitle {
      font-size: 0.76rem;
      color: rgba(246, 239, 226, 0.72);
      margin-bottom: 12px;
      line-height: 1.35;
    }
    .control-group {
      margin-bottom: 11px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: #f3dec0;
      margin-bottom: 5px;
      font-weight: 500;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #ff9e44;
      cursor: pointer;
      height: 5px;
      border-radius: 4px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 8px;
    }
    .btn {
      background: rgba(255, 175, 95, 0.14);
      border: 1px solid rgba(255, 190, 120, 0.32);
      color: #ffe8c8;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
    }
    .btn:hover {
      background: rgba(255, 175, 95, 0.28);
      border-color: rgba(255, 205, 145, 0.65);
      transform: translateY(-1px);
    }
    .btn.active {
      background: linear-gradient(135deg, rgba(255, 148, 54, 0.48), rgba(255, 102, 68, 0.42));
      border-color: #ffb86c;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 152, 56, 0.35);
    }
    .camera-bar {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 210, 160, 0.15);
    }
    .cam-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e6d8c5;
      padding: 5px 4px;
      border-radius: 6px;
      font-size: 0.69rem;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .cam-btn:hover, .cam-btn.active {
      background: rgba(255, 185, 105, 0.28);
      border-color: #ffbe76;
      color: #fff;
    }
    #hint-pill {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(14, 18, 32, 0.74);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 200, 130, 0.24);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.76rem;
      color: rgba(255, 236, 210, 0.88);
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    @media (max-width: 640px) {
      #ui-panel {
        width: 245px;
        padding: 12px 14px;
        top: 10px;
        left: 10px;
      }
      #hint-pill {
        font-size: 0.68rem;
        padding: 5px 12px;
        bottom: 10px;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-panel">
    <h1>
      <span>Coastal Camper Evening</span>
    </h1>
    <p class="subtitle">Interactive 3D coastal scene — click the table lamp, camper door, or headlights directly in 3D.</p>

    <div class="control-group">
      <div class="control-label">
        <span>Table Lamp Glow</span>
        <span id="lamp-val">100%</span>
      </div>
      <input type="range" id="lamp-slider" min="0" max="160" value="100" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>Evening Twilight Depth</span>
        <span id="dusk-val">Golden Dusk</span>
      </div>
      <input type="range" id="dusk-slider" min="0" max="100" value="38" />
    </div>

    <div class="btn-grid">
      <button class="btn active" id="btn-door">Door: Open</button>
      <button class="btn active" id="btn-lamp">Table Lamp: On</button>
      <button class="btn active" id="btn-string">Awning Lights</button>
      <button class="btn active" id="btn-headlights">Headlights</button>
    </div>

    <div class="camera-bar">
      <button class="cam-btn active" data-cam="overview">Camp View</button>
      <button class="cam-btn" data-cam="table">Table &amp; Door</button>
      <button class="cam-btn" data-cam="shore">Shoreline</button>
      <button class="cam-btn" data-cam="interior">Interior</button>
    </div>
  </div>

  <div id="hint-pill">Drag to orbit &bull; Scroll to zoom &bull; Click lamp, van doors, or campfire to interact</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // --- CORE SCENE, CAMERA, RENDERER ---
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x211b30, 0.0065);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(6.6, 3.35, 7.6);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.15, 1.85, 1.15);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.minDistance = 2.0;
    controls.maxDistance = 42.0;
    controls.update();

    // Post-processing for warm evening bloom
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.42, // strength
      0.55, // radius
      0.78  // threshold
    );
    composer.addPass(bloomPass);
    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    // Interactive state
    const state = {
      doorOpen: true,
      doorAngle: 1.0, // 0 = closed, 1 = open
      lampOn: true,
      lampIntensity: 1.0,
      stringLightsOn: true,
      headlightsOn: true,
      duskFactor: 0.38,
      cameraTransition: null
    };
    const interactiveMeshes = [];

    // --- DETERMINISTIC NOISE & TERRAIN MATH ---
    function hash2D(x, z) {
      const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
      return s - Math.floor(s);
    }

    function valueNoise(x, z) {
      const ix = Math.floor(x);
      const iz = Math.floor(z);
      const fx = x - ix;
      const fz = z - iz;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uz = fz * fz * (3.0 - 2.0 * fz);
      const a = hash2D(ix, iz);
      const b = hash2D(ix + 1, iz);
      const c = hash2D(ix, iz + 1);
      const d = hash2D(ix + 1, iz + 1);
      return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
    }

    function fbm(x, z) {
      let v = 0.0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < 4; i++) {
        v += amp * valueNoise(x * freq, z * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return v;
    }

    // Shoreline runs diagonally so ocean is in (-Z, -X) background and dunes rise toward (+Z, +X)
    function getShoreDistance(x, z) {
      const waveCurve = Math.sin(x * 0.065) * 2.4 + Math.cos(z * 0.05) * 1.2;
      return (z + 5.8) + x * 0.28 + waveCurve;
    }

    function getTerrainHeight(x, z) {
      const shoreDist = getShoreDistance(x, z);
      // Base slope from seabed (-2.2) up to beach shelf (1.35) and inland dunes
      let h = 0.0;
      if (shoreDist < 0) {
        h = Math.max(-2.6, shoreDist * 0.16);
      } else {
        // Smooth rise from shoreline to beach plateau at ~1.35
        const beachRise = 1.35 * (1.0 - Math.exp(-shoreDist * 0.24));
        // Inland dune hills starting past shoreDist > 10
        const duneFactor = Math.max(0.0, (shoreDist - 10.5) * 0.14);
        const duneNoise = fbm(x * 0.07 + 3.1, z * 0.07 + 1.7) * 3.8;
        h = beachRise + Math.min(5.5, duneFactor * duneNoise);
      }
      // Subtle sand ripples and micro-relief
      const micro = (fbm(x * 0.22, z * 0.22) - 0.5) * 0.22;
      h += micro * Math.min(1.0, Math.max(0.0, shoreDist * 0.15));

      // Flatten campsite pad around (-0.4, 1.8) so camper van, table, and chairs sit naturally
      const dx = x - (-0.4);
      const dz = z - 1.8;
      const distCamp = Math.sqrt(dx * dx + dz * dz);
      const flatWeight = Math.max(0.0, Math.min(1.0, (7.2 - distCamp) / 3.2));
      const smoothFlat = flatWeight * flatWeight * (3.0 - 2.0 * flatWeight);
      const campPadHeight = 1.35;
      return h * (1.0 - smoothFlat) + campPadHeight * smoothFlat;
    }

    // Returns 0.0 for pure sand, 1.0 for lush coastal grass
    function getGrassWeight(x, z, y) {
      if (y < 0.92) return 0.0;
      const shoreDist = getShoreDistance(x, z);
      if (shoreDist < 4.2) return 0.0;
      const n = fbm(x * 0.18 + 11.4, z * 0.18 - 7.2);
      const nDetail = valueNoise(x * 0.55, z * 0.55);
      // Create organic grass patches around the campsite and denser grass inland
      const base = (shoreDist - 5.2) * 0.085 + (n - 0.44) * 1.45 + (nDetail - 0.5) * 0.35;
      // Keep a natural sandy track under the van tires while allowing grass tufts near the table & van
      const tireDist = Math.exp(-((x + 1.3) * (x + 1.3) + (z - 0.6) * (z - 0.6)) * 0.22);
      const w = Math.max(0.0, Math.min(1.0, base - tireDist * 0.42));
      return w * w * (3.0 - 2.0 * w);
    }

    // --- PROCEDURAL CANVAS TEXTURES ---
    function createWoodTexture(baseHex = '#a66a38', plankCount = 8) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 512);

      const plankH = 512 / plankCount;
      for (let p = 0; p < plankCount; p++) {
        const y0 = p * plankH;
        const shade = (hash2D(p, 4.2) - 0.5) * 22;
        ctx.fillStyle = `rgba(${shade > 0 ? 255 : 0}, ${shade > 0 ? 220 : 0}, ${shade > 0 ? 180 : 0}, ${Math.abs(shade) / 255})`;
        ctx.fillRect(0, y0, 512, plankH);

        // Wood grain lines
        for (let i = 0; i < 42; i++) {
          const gy = y0 + (i / 42) * plankH;
          ctx.strokeStyle = i % 5 === 0 ? 'rgba(45, 22, 8, 0.16)' : 'rgba(255, 220, 175, 0.06)';
          ctx.lineWidth = 1 + (i % 3) * 0.6;
          ctx.beginPath();
          for (let x = 0; x <= 512; x += 32) {
            const wy = gy + Math.sin(x * 0.025 + p * 2.1 + i * 0.3) * 2.4;
            if (x === 0) ctx.moveTo(x, wy);
            else ctx.lineTo(x, wy);
          }
          ctx.stroke();
        }
        // Plank seam
        ctx.fillStyle = 'rgba(28, 14, 5, 0.55)';
        ctx.fillRect(0, y0, 512, 2.5);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createStripeFabricTexture(c1 = '#f5ead6', c2 = '#d96b43', c3 = '#2d6e7e') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const stripes = [c1, c2, c1, c3, c1, c2];
      const sw = 256 / stripes.length;
      for (let i = 0; i < stripes.length; i++) {
        ctx.fillStyle = stripes[i];
        ctx.fillRect(i * sw, 0, sw + 1, 256);
      }
      // Subtle canvas weave
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      for (let y = 0; y < 256; y += 4) {
        ctx.fillRect(0, y, 256, 1.5);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createSandDetailTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(512, 512);
      const data = img.data;
      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const idx = (y * 512 + x) * 4;
          const ripple = Math.sin(x * 0.09 + Math.sin(y * 0.04) * 2.5) * 0.5 + 0.5;
          const grain = hash2D(x * 0.7, y * 0.7);
          const v = Math.floor((ripple * 0.65 + grain * 0.35) * 255);
          data[idx] = v;
          data[idx + 1] = v;
          data[idx + 2] = v;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(28, 28);
      return tex;
    }

    const woodTex = createWoodTexture('#b57542', 10);
    const darkWoodTex = createWoodTexture('#7c4b27', 8);
    const awningTex = createStripeFabricTexture('#f6ecda', '#e06d44', '#337687');
    const sandBumpTex = createSandDetailTexture();

    // --- EVENING SKY DOME, SUNSET HORIZON, STARS & CRESCENT MOON ---
    const sunDirection = new THREE.Vector3(-0.46, 0.075, -0.885).normalize();

    const skyUniforms = {
      uTime: { value: 0 },
      uSunDir: { value: sunDirection.clone() },
      uDusk: { value: state.duskFactor }
    };

    const skyGeo = new THREE.SphereGeometry(240, 64, 32);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyUniforms,
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPos;
        uniform float uTime;
        uniform vec3 uSunDir;
        uniform float uDusk;

        float hash(vec3 p) {
          p = fract(p * 0.3183099 + 0.1);
          p *= 17.0;
          return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
        }

        float cloudNoise(vec2 uv) {
          vec2 i = floor(uv);
          vec2 f = fract(uv);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash(vec3(i, 0.0));
          float b = hash(vec3(i + vec2(1.0, 0.0), 0.0));
          float c = hash(vec3(i + vec2(0.0, 1.0), 0.0));
          float d = hash(vec3(i + vec2(1.0, 1.0), 0.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        void main() {
          vec3 dir = normalize(vWorldPos);
          float h = clamp(dir.y, 0.0, 1.0);

          // Evening palette shifting with uDusk
          vec3 zenithCol = mix(vec3(0.08, 0.10, 0.24), vec3(0.03, 0.04, 0.11), uDusk);
          vec3 midSkyCol = mix(vec3(0.36, 0.22, 0.42), vec3(0.16, 0.11, 0.26), uDusk);
          vec3 horizonCol = mix(vec3(0.96, 0.46, 0.25), vec3(0.68, 0.26, 0.22), uDusk);

          vec3 col = mix(horizonCol, midSkyCol, pow(h, 0.38));
          col = mix(col, zenithCol, pow(h, 0.78));

          // Sunset glow around sunDir
          float sunAmt = max(dot(dir, uSunDir), 0.0);
          col += vec3(1.0, 0.56, 0.22) * pow(sunAmt, 7.0) * (0.65 - uDusk * 0.28);
          col += vec3(1.0, 0.85, 0.55) * smoothstep(0.9965, 0.9996, sunAmt) * (1.2 - uDusk * 0.5);

          // Soft evening cloud bands near horizon
          if (dir.y > 0.01 && dir.y < 0.48) {
            vec2 cuv = dir.xz / (dir.y + 0.12) * 1.4 + vec2(uTime * 0.008, 0.0);
            float cn = cloudNoise(cuv * 2.2) * 0.6 + cloudNoise(cuv * 5.0) * 0.4;
            float cloudMask = smoothstep(0.47, 0.72, cn) * smoothstep(0.01, 0.09, dir.y) * smoothstep(0.45, 0.14, dir.y);
            vec3 cloudLit = mix(vec3(0.22, 0.15, 0.30), vec3(1.0, 0.58, 0.32), pow(sunAmt, 2.0));
            col = mix(col, cloudLit, cloudMask * 0.55);
          }

          // Crescent moon in upper sky
          vec3 moonDir = normalize(vec3(0.45, 0.52, -0.72));
          float moonDist = length(dir - moonDir);
          float moonCircle = smoothstep(0.024, 0.021, moonDist);
          float moonCut = smoothstep(0.022, 0.019, length(dir - normalize(moonDir + vec3(-0.011, 0.005, 0.0))));
          float crescent = clamp(moonCircle - moonCut, 0.0, 1.0);
          col += vec3(1.0, 0.95, 0.82) * crescent * 1.4;
          col += vec3(0.65, 0.72, 0.95) * exp(-moonDist * 22.0) * 0.16;

          // Twinkling evening stars in upper dome
          if (h > 0.15) {
            vec3 starCell = floor(dir * 260.0);
            float sh = hash(starCell);
            if (sh > 0.9935) {
              float twinkle = 0.55 + 0.45 * sin(uTime * 2.8 + sh * 120.0);
              float starVis = smoothstep(0.15, 0.55, h) * (0.45 + uDusk * 0.55);
              col += vec3(0.95, 0.93, 1.0) * twinkle * starVis * 0.9;
            }
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const skyMesh = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyMesh);

    // --- EVENING LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0x6e68a8, 0x4b382a, 0.72);
    hemiLight.position.set(0, 40, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xff8f4b, 1.45);
    sunLight.position.copy(sunDirection).multiplyScalar(65);
    sunLight.position.y = 14.5;
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 140;
    const d = 18;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Soft cool twilight rim light from opposite sky
    const rimLight = new THREE.DirectionalLight(0x5268b8, 0.38);
    rimLight.position.set(25, 18, 30);
    scene.add(rimLight);

    // --- BEACH TERRAIN (SAND & GRASS) ---
    const terrainSize = 150;
    const terrainSegs = 200;
    const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegs, terrainSegs);
    terrainGeo.rotateX(-Math.PI / 2);

    const posAttr = terrainGeo.attributes.position;
    const colors = new Float32Array(posAttr.count * 3);
    const normals = new Float32Array(posAttr.count * 3);

    const wetSandCol = new THREE.Color(0x6e553e);
    const drySandCol = new THREE.Color(0xdcb786);
    const warmSandCol = new THREE.Color(0xc99f6c);
    const grassColA = new THREE.Color(0x3b6939);
    const grassColB = new THREE.Color(0x557d42);
    const tempCol = new THREE.Color();
    const grassTemp = new THREE.Color();

    const eps = 0.25;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);
      const y = getTerrainHeight(x, z);
      posAttr.setY(i, y);

      // Finite difference normal
      const hx = getTerrainHeight(x + eps, z) - getTerrainHeight(x - eps, z);
      const hz = getTerrainHeight(x, z + eps) - getTerrainHeight(x, z - eps);
      const nx = -hx / (2 * eps);
      const ny = 1.0;
      const nz = -hz / (2 * eps);
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      normals[i * 3] = nx / len;
      normals[i * 3 + 1] = ny / len;
      normals[i * 3 + 2] = nz / len;

      // Sand vs Grass vertex color blend
      const nVal = valueNoise(x * 0.35, z * 0.35);
      tempCol.copy(drySandCol).lerp(warmSandCol, nVal);

      // Wet shoreline darkening
      const wetFactor = 1.0 - Math.min(1.0, Math.max(0.0, (y - 0.02) / 0.52));
      tempCol.lerp(wetSandCol, wetFactor * 0.85);

      // Grass blending
      const gWeight = getGrassWeight(x, z, y);
      if (gWeight > 0.001) {
        grassTemp.copy(grassColA).lerp(grassColB, valueNoise(x * 0.6 + 2.0, z * 0.6));
        tempCol.lerp(grassTemp, gWeight);
      }

      colors[i * 3] = tempCol.r;
      colors[i * 3 + 1] = tempCol.g;
      colors[i * 3 + 2] = tempCol.b;
    }

    terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      transparent: true,
      uniforms: oceanUniforms,
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorldPos;
        varying float vShoreDist;
        varying float vWaveHeight;

        float getShore(vec2 p) {
          float waveCurve = sin(p.x * 0.065) * 2.4 + cos(p.y * 0.05) * 1.2;
          return (p.y + 5.8) + p.x * 0.28 + waveCurve;
        }

        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          float sd = getShore(wp.xz);
          vShoreDist = sd;

          float damp = clamp(-sd * 0.18, 0.0, 1.0);
          float w1 = sin(wp.x * 0.35 + wp.z * 0.45 + uTime * 1.65) * 0.11;
          float w2 = cos(wp.x * 0.7 - wp.z * 0.55 + uTime * 2.1) * 0.05;
          float w3 = sin((sd) * 1.35 + uTime * 2.4) * 0.06;
          float h = (w1 + w2) * damp + w3 * clamp(1.0 - abs(sd) * 0.12, 0.0, 1.0);

          wp.y += h;
          vWaveHeight = h;
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uSunDir;
        uniform float uDusk;
        uniform vec3 uCamPos;
        varying vec3 vWorldPos;
        varying float vShoreDist;
        varying float vWaveHeight;

        void main() {
          // Shoreline swash oscillation
          float swash = sin(uTime * 1.8 + vWorldPos.x * 0.25) * 0.55;
          float effectiveShore = vShoreDist + swash;
          if (effectiveShore > 0.65) discard;

          // Procedural wave normal
          float nx = cos(vWorldPos.x * 0.9 + vWorldPos.z * 0.7 + uTime * 2.1) * 0.16
                   + sin(vWorldPos.x * 2.1 - uTime * 1.6) * 0.08;
          float nz = sin(vWorldPos.z * 1.1 - vWorldPos.x * 0.5 + uTime * 1.9) * 0.16
                   + cos(vWorldPos.z * 2.4 + uTime * 2.3) * 0.08;
          vec3 N = normalize(vec3(nx, 1.0, nz));

          vec3 V = normalize(uCamPos - vWorldPos);
          vec3 R = reflect(-V, N);
          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.6);

          // Water base colors (deep evening teal to shallow turquoise-amber)
          vec3 deepCol = mix(vec3(0.05, 0.13, 0.22), vec3(0.02, 0.06, 0.13), uDusk);
          vec3 shallowCol = mix(vec3(0.12, 0.30, 0.34), vec3(0.06, 0.16, 0.22), uDusk);
          float shallowMask = clamp(1.0 - (-effectiveShore) * 0.08, 0.0, 1.0);
          vec3 waterCol = mix(deepCol, shallowCol, shallowMask);

          // Sky reflection color
          vec3 skyRef = mix(vec3(0.75, 0.40, 0.34), vec3(0.20, 0.16, 0.32), clamp(R.y * 1.6 + uDusk * 0.4, 0.0, 1.0));
          vec3 col = mix(waterCol, skyRef, fresnel * 0.78);

          // Sunset specular shimmer path on the waves
          vec3 H = normalize(V + normalize(vec3(uSunDir.x, 0.16, uSunDir.z)));
          float spec = pow(max(dot(N, H), 0.0), 90.0);
          float glitter = pow(max(dot(N, H), 0.0), 18.0);
          vec3 sunSpecCol = mix(vec3(1.0, 0.62, 0.28), vec3(0.95, 0.42, 0.22), uDusk);
          col += sunSpecCol * (spec * 2.2 + glitter * 0.38) * (1.0 - uDusk * 0.35);

          // Shoreline whitewash & foam bands
          float foamEdge = smoothstep(-1.8, 0.35, effectiveShore);
          float foamWaves = sin(effectiveShore * 5.2 + uTime * 3.1 + sin(vWorldPos.x * 0.8) * 1.5);
          float foamBand = smoothstep(0.45, 0.88, foamWaves) * smoothstep(-5.5, 0.2, effectiveShore);
          float foam = clamp(foamEdge * 0.85 + foamBand * 0.65, 0.0, 1.0);
          vec3 foamCol = mix(vec3(0.96, 0.88, 0.80), vec3(0.65, 0.62, 0.72), uDusk);
          col = mix(col, foamCol, foam);

          float alpha = smoothstep(0.65, -0.35, effectiveShore);
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    // --- INSTANCED SWAYING COASTAL BEACH GRASS ---
    // Custom curved tapered grass blade geometry
    function createGrassBladeGeometry() {
      const geo = new THREE.BufferGeometry();
      const segs = 4;
      const verts = [];
      const uvs = [];
      const indices = [];
      const baseW = 0.042;
      const height = 0.62;

      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const w = baseW * (1.0 - t * 0.92);
        const y = t * height;
        const bendZ = t * t * 0.14;
        verts.push(-w, y, bendZ);
        verts.push( w, y, bendZ);
        uvs.push(0, t);
        uvs.push(1, t);
        if (i < segs) {
          const r = i * 2;
          indices.push(r, r + 1, r + 2);
          indices.push(r + 1, r + 3, r + 2);
        }
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    grassMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = grassUniformTime;
      shader.vertexShader = `
        uniform float uTime;
        varying float vBladeH;
      ` + shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        vBladeH = uv.y;
        vec4 worldInstancePos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        float breeze = sin(uTime * 2.1 + worldInstancePos.x * 0.45 + worldInstancePos.z * 0.35) * 0.16
                     + cos(uTime * 3.4 + worldInstancePos.x * 0.9) * 0.06;
        transformed.x += breeze * uv.y * uv.y;
        transformed.z += breeze * 0.6 * uv.y * uv.y;
        `
      );
      shader.fragmentShader = `
        varying float vBladeH;
      ` + shader.fragmentShader.replace(
        '#include <color_fragment>',
        `
        #include <color_fragment>
        vec3 rootCol = vec3(0.18, 0.32, 0.16);
        vec3 tipCol  = vec3(0.68, 0.76, 0.38);
        diffuseColor.rgb = mix(rootCol, tipCol, pow(vBladeH, 0.85));
        `
      );
    };

      const gz = (hash2D(attempt, 2.71) - 0.32) * spread;

          (hash2D(attempt, 6.1) - 0.5) * 0.25,

        dummy.updateMatrix();
        grassInstanced.setMatrixAt(placedGrass, dummy.matrix);

    camBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        camBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const preset = cameraPresets[btn.dataset.cam];
        if (preset) {
          state.cameraTransition = {
            startPos: camera.position.clone(),
            endPos: preset.pos.clone(),
            startTarget: controls.target.clone(),
            endTarget: preset.target.clone(),
            progress: 0
          };
        }
      });
    });

    // Raycasting for 3D Direct Clicks
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      if (Math.hypot(dx, dy) > 6) return; // Ignore drag orbits

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(interactiveMeshes, false);
      if (hits.length > 0) {
        const type = hits[0].object.userData.interactiveType;
        if (type === 'door') toggleDoor();
        else if (type === 'lamp') toggleLamp();
        else if (type === 'stringLights') toggleStringLights();
        else if (type === 'headlights') toggleHeadlights();
        else if (type === 'fire') {
          state.fireOn = !state.fireOn;
          flameOuter.visible = state.fireOn;
          flameInner.visible = state.fireOn;
        }
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      skyUniforms.uTime.value = elapsed;
      oceanUniforms.uTime.value = elapsed;
      grassUniformTime.value = elapsed;

      // Smoothly animate Camper Van Open/Closed Doors
      const targetDoor = state.doorOpen ? 1.0 : 0.0;
      state.doorAngle += (targetDoor - state.doorAngle) * Math.min(1.0, dt * 6.5);
      doorPivotLeft.rotation.y = -2.18 * state.doorAngle;
      doorPivotRight.rotation.y = 1.95 * state.doorAngle;
      // Interior light spills out more strongly when doors are open
      vanInteriorLight.intensity = 1.2 + state.doorAngle * 1.15;

      // Table Lamp warm breathe & intensity control
      const targetLampMult = state.lampOn ? state.lampIntensity : 0.0;
      const flicker = 1.0 + Math.sin(elapsed * 11.0) * 0.025 + Math.cos(elapsed * 17.3) * 0.018;
      tableLampLight.intensity = 3.8 * targetLampMult * flicker;
      lampCoreMat.emissiveIntensity = 4.5 * targetLampMult * flicker;

      // Campfire flicker animation
      if (state.fireOn) {
        const fPulse = 1.0 + Math.sin(elapsed * 14.0) * 0.14 + Math.cos(elapsed * 23.0) * 0.09;
        fireLight.intensity = 1.85 * fPulse;
        flameOuter.scale.set(1.0 + Math.sin(elapsed * 16.0) * 0.08, fPulse, 1.0 + Math.cos(elapsed * 15.0) * 0.08);
        flameInner.scale.set(1.0, 0.9 + Math.cos(elapsed * 19.0) * 0.15, 1.0);
      } else {
        fireLight.intensity = 0.0;
      }

      // Drift fireflies gently
      const posArr = fireflies.geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        posArr[i * 3 + 1] += Math.sin(elapsed * 1.5 + pPhase[i]) * 0.0025;
        posArr[i * 3] += Math.cos(elapsed * 0.9 + pPhase[i]) * 0.0018;
      }
      fireflies.geometry.attributes.position.needsUpdate = true;

      // Animate distant coastal seagulls
      for (const g of gulls) {
        const flap = Math.sin(elapsed * 5.2 + g.phase) * 0.42;
        g.wingL.rotation.z = flap;
        g.wingR.rotation.z = -flap;
        g.group.position.x += g.speed * dt;
        if (g.group.position.x > 28) g.group.position.x = -28;
      }

      // Smooth Camera Preset Transitions
      if (state.cameraTransition) {
        const tr = state.cameraTransition;
        tr.progress = Math.min(1.0, tr.progress + dt * 1.65);
        const ease = tr.progress < 0.5
          ? 4 * tr.progress * tr.progress * tr.progress
          : 1 - Math.pow(-2 * tr.progress + 2, 3) / 2;
        camera.position.lerpVectors(tr.startPos, tr.endPos, ease);
        controls.target.lerpVectors(tr.startTarget, tr.endTarget, ease);
        if (tr.progress >= 1.0) state.cameraTransition = null;
      }

      controls.update();
      composer.render();
    }

    animate();
  </script>
</body>
</html>
