    .cond-label { color: var(--muted); }
    .cond-value { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 13.5px; color: var(--cream); white-space: nowrap; }

    .dock-btn { display: flex; align-items: center; gap: 9px; font-family: 'Karla', sans-serif; font-weight: 600; font-size: 14px; color: inherit; background: transparent; border: 1px solid transparent; padding: 10px 16px; border-radius: 11px; cursor: pointer; }
    .dock-btn svg { width: 18px; height: 18px; }
    .dock-btn:hover { background: rgba(255, 236, 212, 0.08); }

        .dragtip { display: none; }

    @media (max-width: 999px) {

            }
            if (!drop) { newIdx.push(ia, ib, ic); }
        }
        geo.setIndex(newIdx);
        geo.computeBoundingBox();
        geo.computeBoundingSphere();
        var body = new THREE.Mesh(geo, MAT.paint);
        body.name = 'vanBody';
        return body;
    }

    function buildGlazing(van) {
        var panes = [];
        var bandH = WINDOW_BAND[1] - WINDOW_BAND[0];
        var bandC = (WINDOW_BAND[1] + WINDOW_BAND[0]) / 2;
        function addSideWindow(side, span) {
            var w = span[1] - span[0];
            var cx = (span[1] + span[0]) / 2;
            var pane = mesh(prism(roundedRect(w + 0.012, bandH + 0.012, 0.096), 0.01), MAT.glass, cx, bandC, side * (0.95 - 0.025));
            van.add(pane);
            panes.push(pane);
            var reveal = mesh(framePrism(w, bandH, 0.09, 0.012, 0.06), MAT.rubber, cx, bandC, side * (0.95 - 0.033));
            van.add(reveal);
        }
        SIDE_WINDOWS.forEach(function (span) { addSideWindow(1, span); });
        FAR_WINDOWS.forEach(function (span) { addSideWindow(-1, span); });
        var doorReveal = mesh(framePrism(VAN.door.front - VAN.door.rear, VAN.door.high - VAN.door.low, 0.05, 0.012, 0.13), MAT.rubber, (VAN.door.rear + VAN.door.front) / 2, (VAN.door.low + VAN.door.high) / 2, 0.95 - 0.085);
        van.add(doorReveal);
        SCREENS.forEach(function (scr) {
            var zc = (scr.x0 + scr.x1) / 2, yc = (scr.y0 + scr.y1) / 2;
            // the glass reaches 6 mm past the opening on every side, so its edge tucks under the cut skin and through the
            // rubber ribbon all the way round instead of stopping exactly on the outline and leaving slivers at the corners
            var reach = { x0: scr.x0 - 0.006, x1: scr.x1 + 0.006, y0: scr.y0 - 0.006, y1: scr.y1 + 0.006, r: scr.r + 0.006 };
            var g = new THREE.PlaneGeometry(1, 1, 48, 32);
            var gp = g.attributes.position;
            for (var i = 0; i < gp.count; i++) {
                var uz = gp.getX(i) * (reach.x1 - reach.x0) + zc;
                var uy = gp.getY(i) * (reach.y1 - reach.y0) + yc;
                var e = roundedRectEdge(uz, uy, reach);
                if (!e.inside) { uz = e.x; uy = e.y; }
                var sn = noseAt(uy, uz);
                gp.setXYZ(i, sn.p.x - sn.n.x * 0.015, sn.p.y - sn.n.y * 0.015, sn.p.z - sn.n.z * 0.015);
            }
            g.computeVertexNormals();
            if (g.attributes.normal.getX(0) < 0) {
                var ridx = g.index;
                var fl = new Uint32Array(ridx.count);
                for (var k = 0; k < ridx.count; k += 3) {
                    fl[k] = ridx.getX(k);
                    fl[k + 1] = ridx.getX(k + 2);
                    fl[k + 2] = ridx.getX(k + 1);
                }
                g.setIndex(new THREE.BufferAttribute(fl, 1));
                g.computeVertexNormals();
            }
            var screenMesh = new THREE.Mesh(g, MAT.glass);
            screenMesh.name = scr.side < 0 ? 'screenLeft' : 'screenRight';
            van.add(screenMesh);
            panes.push(screenMesh);
            var verts = [];
            var ribIdx = [];
            for (var s = 0; s < 96; s++) {
                var ang = (s / 96) * Math.PI * 2;
                var farZ = zc + 2 * Math.cos(ang);
                var farY = yc + 2 * Math.sin(ang);
                var oe = roundedRectEdge(farZ, farY, scr);
                var skin = noseAt(oe.y, oe.x);
                verts.push(skin.p.x, skin.p.y, skin.p.z);
                verts.push(skin.p.x - skin.n.x * 0.016, skin.p.y - skin.n.y * 0.016, skin.p.z - skin.n.z * 0.016);
                if (s > 0) {
                    var p0 = (s - 1) * 2, p1 = s * 2;
                    ribIdx.push(p0, p0 + 1, p1, p0 + 1, p1 + 1, p1);
                }
            }
            ribIdx.push(95 * 2, 95 * 2 + 1, 0, 95 * 2 + 1, 1, 0);
            var ribbonGeo = new THREE.BufferGeometry();
            ribbonGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            ribbonGeo.setIndex(ribIdx);
            ribbonGeo.computeVertexNormals();
            van.add(new THREE.Mesh(ribbonGeo, new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.8, side: THREE.DoubleSide })));
        });
        var rearGlass = mesh(prism(roundedRect(1.14, 0.3, 0.09), 0.012), MAT.glass, -2.304, 1.53, 0, 0, Math.PI / 2, 0);
        van.add(rearGlass);
        panes.push(rearGlass);
        var rearFrame = mesh(framePrism(1.14, 0.3, 0.09, 0.03, 0.02), MAT.rubber, -2.302, 1.53, 0, 0, Math.PI / 2, 0);
        van.add(rearFrame);
        return panes;
    }

    function rodBetween(a, b, r, mat) {
        var dir = new THREE.Vector3().subVectors(b, a);
        var len = dir.length();
        var m = mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);
        m.position.copy(a).addScaledVector(dir, 0.5);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
        return m;
    }
    function roundedBlock(w, h, d, r, mat) {
        return mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat);
    }
    function strut(a, b, thick, deep, mat) {
        var dir = new THREE.Vector3().subVectors(b, a);
        var len = dir.length();
        var m = mesh(new THREE.BoxGeometry(thick, len, deep), mat);
        m.position.copy(a).addScaledVector(dir, 0.5);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
        return m;
    }
    function buildFrontEnd(van) {
        var Y = new THREE.Vector3(0, 1, 0);

        function onSkin(y, z) {
            var sn = noseAt(y, z);
            return new THREE.Vector3().copy(sn.p).addScaledVector(sn.n, 0.001);
        }
        var headlights = [];
        [-1, 1].forEach(function (s) {
            van.add(rodBetween(onSkin(1.38, s * 0.52), onSkin(1.66, s * 0.24), 0.012, MAT.black));
            van.add(onNose(rod(0.014, 0.014, 0.03, MAT.black, 12), 1.38, s * 0.52, -0.015, Y));
        });
        van.add(onNose(rod(0.105, 0.11, 0.03, MAT.chrome, 48), 1.02, 0, 0, Y));
        var badgeOuter = new THREE.Mesh(new THREE.TorusGeometry(0.108, 0.013, 12, 48), MAT.chrome);
        onNose(badgeOuter, 1.02, 0, 0.016);
        van.add(badgeOuter);
        var badgeInner = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.009, 10, 40), MAT.chrome);
        onNose(badgeInner, 1.02, 0, 0.018);
        van.add(badgeInner);
        van.add(onNose(rod(0.05, 0.05, 0.012, MAT.paint, 32), 1.02, 0, 0.016, Y));
        [-1, 1].forEach(function (s) {
            van.add(onNose(rod(0.124, 0.132, 0.06, MAT.paint, 40), 0.95, s * 0.64, 0.005, Y));
            var ring = new THREE.Mesh(new THREE.TorusGeometry(0.105, 0.018, 12, 40), MAT.chrome);
            onNose(ring, 0.95, s * 0.64, 0.035);
            van.add(ring);
            var lens = onNose(rod(0.1, 0.1, 0.03, MAT.lens, 32), 0.95, s * 0.64, 0.035, Y);
            van.add(lens);
            headlights.push(lens);
            van.add(onNose(rod(0.042, 0.048, 0.03, MAT.chrome, 24), 1.15, s * 0.69, 0, Y));
            var ind = new THREE.Mesh(new THREE.SphereGeometry(0.038, 20, 12), MAT.amber);
            ind.scale.z = 0.75;
            onNose(ind, 1.15, s * 0.69, 0.016);
            van.add(ind);
            van.add(rodBetween(new THREE.Vector3(1.6, 1.29, s * 0.945), new THREE.Vector3(1.66, 1.46, s * 1.08), 0.016, MAT.chrome));

            van.add(box(0.18, 0.05, 0.06, MAT.black, -2.31, 0.52, s * 0.62));
            var tailLamp = roundedBlock(0.03, 0.17, 0.09, 0.012, MAT.tail);
            tailLamp.position.set(-x - 0.004, 1.02, s * 0.74);
            van.add(tailLamp);
            var cabHandle = roundedBlock(0.12, 0.025, 0.03, 0.01, MAT.chrome);
            cabHandle.position.set(1.1, 1.19, s * (0.95 + 0.008));
            van.add(cabHandle);
        });
        var R = 2.82, centreX = 2.36 - R, sweep = Math.asin(1 / R);
        var bumperShape = new THREE.Shape();
        bumperShape.absarc(centreX, 0, R + 0.075, -sweep, sweep, false);
        bumperShape.absarc(centreX, 0, R, sweep, -sweep, true);
        bumperShape.closePath();
        var bumperGeo = new THREE.ExtrudeGeometry(bumperShape, {
            depth: 0.106,
            bevelEnabled: true,
            bevelThickness: 0.012,
            bevelSize: 0.012,
            bevelSegments: 3,
            curveSegments: 64
        });
        bumperGeo.translate(0, 0, -0.053);
        var frontBumper = new THREE.Mesh(bumperGeo, MAT.bumper);
        frontBumper.position.y = 0.52;
        frontBumper.rotation.x = -Math.PI / 2;
        frontBumper.name = 'frontBumper';
        van.add(frontBumper);
        var riderR = R + 0.0375;
        [-1, 1].forEach(function (s) {
            var z = s * 0.38;
            var xr = centreX + Math.sqrt(riderR * riderR - z * z);
            var over = roundedBlock(0.06, 0.32, 0.065, 0.02, MAT.chrome);
            over.position.set(xr, 0.665, z);
            over.rotation.y = -Math.asin(z / riderR);
            van.add(over);
            var bz = s * 0.62;
            var inner = centreX + Math.sqrt(R * R - bz * bz) + 0.01;
            var skin = noseAt(0.52, bz).p.x - 0.02;
            van.add(box(inner - skin, 0.05, 0.06, MAT.black, (inner + skin) / 2, 0.52, bz));
        });
        var barSweep = Math.asin(0.4 / riderR);
        var barGeo = new THREE.TorusGeometry(riderR, 0.017, 10, 64, 2 * barSweep);
        barGeo.rotateZ(-barSweep);
        barGeo.rotateX(-Math.PI / 2);
        var bar = new THREE.Mesh(barGeo, MAT.chrome);
        bar.position.set(centreX, 0.8, 0);
        van.add(bar);
        var rearBumper = roundedBlock(0.14, 0.13, 2.0, 0.05, MAT.chrome);
        rearBumper.position.set(-x - 0.11, 0.52, 0);
        van.add(rearBumper);
        for (var k = 0; k < 5; k++) {
            van.add(box(0.008, 0.018, 0.5, MAT.rubber, -x - 0.002, 0.78 + k * 0.045, 0));
        }
        return headlights;
    }

    function buildRoof(van) {
        var top = VAN.roof;
        var popTopCanvas = box(2.6, 0.3, 1.38, MAT.fabric.canvas, -0.6, top + 0.15, 0);
        popTopCanvas.name = 'popTopCanvas';
        van.add(popTopCanvas);
        var popTopLid = mesh(prism(roundedRect(2.66, 1.72, 0.04), 0.1, 0.02), MAT.paint, -0.6, top + 0.35, 0, Math.PI / 2, 0, 0);
        popTopLid.name = 'popTopLid';
        van.add(popTopLid);
        var roofRack = new THREE.Group();
        roofRack.name = 'roofRack';
        [-0.62, 0.62].forEach(function (z) {
            roofRack.add(box(0.88, 0.03, 0.03, MAT.black, 1.22, top + 0.105, z));
            roofRack.add(box(0.04, 0.12, 0.04, MAT.black, 0.82, top + 0.04, z));
            roofRack.add(box(0.04, 0.12, 0.04, MAT.black, 1.6, top + 0.04, z));
        });
        [0.9, 1.14, 1.38, 1.6].forEach(function (cx) {
            roofRack.add(box(0.03, 0.025, 1.27, MAT.black, cx, top + 0.1325, 0));
        });
        // each roll lies in the gap between two cross bars, resting on both bars' top edges:
        // centred between the bars, raised so its curve meets the bar tops (bar top = top + 0.145, bar half width 0.015)
        function cradle(x0, x1, r) {
            var dx = (x1 - x0) / 2 - 0.015;
            return { x: (x0 + x1) / 2, y: top + 0.145 + Math.sqrt(r * r - dx * dx) };
        }
        var bedAt = cradle(0.9, 1.14, 0.11), tarpAt = cradle(1.38, 1.6, 0.1);
        var bedroll = rod(0.11, 0.11, 1.05, MAT.mustard, 24, bedAt.x, bedAt.y, 0, Math.PI / 2, 0, 0);
        var tarp = rod(0.1, 0.1, 1.05, MAT.navy, 24, tarpAt.x, tarpAt.y, 0, Math.PI / 2, 0, 0);
        roofRack.add(bedroll);
        roofRack.add(tarp);
        [-1, 1].forEach(function (z) {
            var s1 = new THREE.Mesh(new THREE.TorusGeometry(0.11 + 0.004, 0.006, 6, 24), MAT.black);
            s1.position.set(bedAt.x, bedAt.y, 0.3 * z);
            roofRack.add(s1);
            var s2 = new THREE.Mesh(new THREE.TorusGeometry(0.1 + 0.004, 0.006, 6, 24), MAT.black);
            s2.position.set(tarpAt.x, tarpAt.y, 0.3 * z);
            roofRack.add(s2);
        });
        van.add(roofRack);
    }

    function buildWheel(name) {

        tyre.scale.set(1, 1, 1.25);

        [-1, 1].forEach(function (side) {
            var hubcap = new THREE.Mesh(new THREE.SphereGeometry(0.095, 16, 8), MAT.chrome);
            hubcap.scale.set(0.35, 1, 1);
            hubcap.position.set(side * 0.082, 0, 0);
            g.add(hubcap);
            for (var b = 0; b < 5; b++) {

    function rugCanvas() {
        var size = 256;
        var stripes = [
            ['#e6e0d6', 14],
            ['#7f94b8', 6],
            ['#e6e0d6', 32],
            ['#212e52', 28],
            ['#e6e0d6', 20]
        ];
        var c = paintCanvas(size, size, function (g, w, h) {
            var scale = h / 8.7 / 100;
            var y = 0;
            while (y < h) {
                for (var s = 0; s < stripes.length; s++) {
                    var sh = stripes[s][1] * scale;
                    g.fillStyle = stripes[s][0];
                    g.fillRect(0, y, w, sh + 0.5);
                    y += sh;
                }
            }
        });
        var g = c.getContext('2d');
        var img = g.getImageData(0, 0, size, size);
        var data = img.data;
        for (var py = 0; py < size; py++) {
            for (var px = 0; px < size; px++) {
                var thread = (px + py) % 2 === 0 ? 1.03 : 0.95;
                var wear = 1 - 0.1 * ease(0.55, 0.8, layeredNoise(px / 80, py / 80, 3, 91));
                var k = thread * wear;
                var o = (py * size + px) * 4;
                data[o] = Math.min(255, data[o] * k);
                data[o + 1] = Math.min(255, data[o + 1] * k);
                data[o + 2] = Math.min(255, data[o + 2] * k);
            }
        }
        g.putImageData(img, 0, 0);
        return c;

    function buildDriftwood(bark) {
        var c = CAMP.log;
        var trunkGeo = new THREE.CylinderGeometry(0.105, 0.15, c.length, 28, 40);
        var pos = trunkGeo.attributes.position;
        for (var i = 0; i < pos.count; i++) {
            var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            if (Math.hypot(x, z) < 1e-4) { continue; }
            var a = Math.atan2(z, x);
            var k = 1 + 0.09 * Math.sin(3 * a + 2.3 * y) + 0.05 * Math.sin(7 * a - 5.1 * y) + 0.04 * (smoothNoise(2 * a + 4, 3 * y, 13) - 0.5);
            pos.setXYZ(i, x * k, y, z * k);
        }
        trunkGeo.computeVertexNormals();
        var trunk = new THREE.Mesh(trunkGeo, bark);
        trunk.rotation.z = Math.PI / 2 + Math.atan2(0.15 - 0.105, c.length);
        var group = new THREE.Group();
        group.name = 'driftwood';
        group.add(trunk);
        var stub1 = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.045, 0.15, 12), bark);
        stub1.position.set(0.589, 0.096, 0.145);
        stub1.rotation.set(0.9, 0, -0.6);
        group.add(stub1);
        var stub2 = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.035, 0.15, 12), bark);
        stub2.position.set(-0.738, 0.103, -0.1);
        stub2.rotation.set(-0.7, 0, 0.9);
        group.add(stub2);
        group.position.set(c.x, 0, c.z);
        group.rotation.y = c.turn;
        group.updateMatrixWorld();
        var half = c.length / 2 - 0.15;
        var world = new THREE.Vector3();
        var minPosEnd = Infinity, minNegEnd = Infinity;
        for (var i = 0; i < pos.count; i++) {
            var wy = pos.getY(i);
            if (Math.abs(wy) < half) { continue; }
            world.set(pos.getX(i), wy, pos.getZ(i)).applyMatrix4(trunk.matrixWorld);
            var gap = world.y - groundHeight(world.x, world.z);
            if (wy > 0) {
                if (gap < minPosEnd) { minPosEnd = gap; }
            } else {
                if (gap < minNegEnd) { minNegEnd = gap; }
            }
        }
        group.position.y = -(Math.max(minPosEnd, minNegEnd) + 0.01);
        group.updateMatrixWorld();
        return castAndReceive(group);
    }

    function valueNoise3(x, y, z, seed) {
        var ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
        var fx = x - ix, fy = y - iy, fz = z - iz;
        var sx = fx * fx * (3 - 2 * fx);
        var sy = fy * fy * (3 - 2 * fy);
        var sz = fz * fz * (3 - 2 * fz);
        var a = lattice(ix, iy + iz * 57, seed);
        var b = lattice(ix + 1, iy + iz * 57, seed);
        var c = lattice(ix, iy + 1 + iz * 57, seed);
        var d = lattice(ix + 1, iy + 1 + iz * 57, seed);
        var a2 = lattice(ix, iy + (iz + 1) * 57, seed);
        var b2 = lattice(ix + 1, iy + (iz + 1) * 57, seed);
        var c2 = lattice(ix, iy + 1 + (iz + 1) * 57, seed);
        var d2 = lattice(ix + 1, iy + 1 + (iz + 1) * 57, seed);
        var lower = a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
        var upper = a2 + (b2 - a2) * sx + (c2 - a2) * sy + (a2 - b2 - c2 + d2) * sx * sy;
        return (lower + (upper - lower) * sz) * 2 - 1;
    }

    function lumpyStone(seed) {
        var geo = mergeVertices(new THREE.IcosahedronGeometry(1, 3));
        var pos = geo.attributes.position;
        for (var i = 0; i < pos.count; i++) {
            var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            var k = 1 + 0.3 * valueNoise3(1.4 * x + seed, 1.4 * y, 1.4 * z, 3)
                - 0.12 * Math.abs(valueNoise3(3.5 * x + seed, 3.5 * y, 3.5 * z, 4))
                + 0.04 * valueNoise3(9 * x + seed, 9 * y, 9 * z, 5);
            pos.setXYZ(i, x * k, y * k, z * k);
        }
        geo.computeVertexNormals();
        return geo;
    }

    function stoneMaterial() {
        var mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
        mat.onBeforeCompile = function (shader) {
            shader.vertexShader = shader.vertexShader
                .replace('#include <common>', '#include <common>\nvarying vec3 vStonePos;')
                .replace('#include <project_vertex>', '#include <project_vertex>\nvStonePos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
            shader.fragmentShader = shader.fragmentShader
                .replace('#include <common>', '#include <common>\nvarying vec3 vStonePos;\n' + NOISE_GLSL + GROUND_GLSL + `
float crackGap(vec2 p) {
    vec2 cell = floor(p);
    vec2 f = p - cell;
    float near1 = 9.0;
    float near2 = 9.0;
    for (int j = -1; j <= 1; j++) {
        for (int i = -1; i <= 1; i++) {
            vec2 o = vec2(float(i), float(j));
            vec2 jitter = vec2(speckle(cell + o), speckle(cell + o + 17.3));
            float d = length(o + jitter - f);
            if (d < near1) {
                near2 = near1;
                near1 = d;
            } else if (d < near2) {
                near2 = d;
            }
        }
    }
    return near2 - near1;
}`)
                .replace('#include <color_fragment>', `#include <color_fragment>
vec3 stone = mix(vec3(0.17, 0.15, 0.13), vec3(0.42, 0.37, 0.31), clamp(0.5 + 0.6 * layers5(vStonePos * 3.0), 0.0, 1.0));
stone *= 0.75 + 0.25 * smoothstep(0.0, 0.12, crackGap(vStonePos.xz * 9.0 + vStonePos.y * 4.0));
float foot = 1.0 - smoothstep(0.0, 0.05, vStonePos.y - groundAt(vStonePos.xz));
diffuseColor.rgb = mix(stone, vec3(0.62, 0.5, 0.36), foot * 0.55);`);
        };
        mat.customProgramCacheKey = function () { return 'stone'; };
        return mat;
    }

    function mulberry(seed) {
        var a = seed >>> 0;
        return function () {
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function buildRocks() {
        var stone = stoneMaterial();

        rocks.name = 'rocks';
        var rnd = mulberry(21);
        for (var pile = 0; pile < CAMP.rockPiles.length; pile++) {
            var p = CAMP.rockPiles[pile];
            var px = p[0], pz = p[1], scale = p[2];
            for (var k = 0; k < 6; k++) {
                var geo = lumpyStone(rnd() * 50);
                var size = (0.07 + rnd() * 0.16) * scale;
                if (k === 0) { size *= 1.8; }
                var a = rnd() * 6.28;
                var r = k === 0 ? 0 : 0.25 + rnd() * 0.55;
                var x = px + Math.cos(a) * r;
                var z = pz + Math.sin(a) * r;
                var stretch = 1 + rnd() * 0.5;
                var rock = mesh(geo, stone, x, groundHeight(x, z) + size * 0.18, z, rnd(), rnd() * 6, rnd());
                rock.scale.set(size * stretch, size * 0.6, size);
                rock.name = 'rock' + pile + '_' + k;
                rocks.add(rock);
            }
        }
        return castAndReceive(rocks);
    }

                var p = new THREE.Vector3().lerpVectors(from, to, s);
                p.y -= sag * Math.sin(Math.PI * s);

            }
            var curve = new THREE.CatmullRomCurve3(pts);
            var tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.004, 5), cable);
            lights.add(tube);

    function bladeGeometry() {
        var geo = new THREE.ConeGeometry(1, 1, 3, 5, true);
        geo.translate(0, 0.5, 0);
        var pos = geo.attributes.position;
        var cols = new Float32Array(pos.count * 3);
        var root = new THREE.Color().setRGB(0.3, 0.36, 0.14);
        var tip = new THREE.Color().setRGB(0.86, 0.8, 0.5);
        for (var i = 0; i < pos.count; i++) {
            var y = pos.getY(i);
            pos.setXYZ(i, pos.getX(i) + 0.26 * y * y, y, pos.getZ(i));
            var m = ease(0.15, 1, y);
            cols[i * 3] = root.r + (tip.r - root.r) * m;
            cols[i * 3 + 1] = root.g + (tip.g - root.g) * m;
            cols[i * 3 + 2] = root.b + (tip.b - root.b) * m;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
        geo.computeVertexNormals();
        return geo;
    }

    function buildGrass() {
        var bladeGeo = bladeGeometry();
        var bladeMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide });
        var rnd = seededRandom(7);
        var perClump = 150;
        var goldenTurn = Math.PI * (3 - Math.sqrt(5));
        var clumps = [];
        CAMP.grass.forEach(function (entry, i) {
            var cx = entry[0], cz = entry[1], size = entry[2];
            var radius = 0.28 * size;
            var clump = new THREE.InstancedMesh(bladeGeo, bladeMat, perClump);
            clump.name = 'grassClump';
            var dummy = new THREE.Object3D();
            var colour = new THREE.Color();
            for (var k = 0; k < perClump; k++) {
                var out = Math.sqrt((k + 0.5) / perClump);
                var a = k * goldenTurn + (rnd() - 0.5) * 0.5;
                dummy.position.set(Math.cos(a) * out * radius, -0.02, Math.sin(a) * out * radius);
                var splay = 0.12 + rnd() * 0.5 * (out + 0.3);
                dummy.rotation.set(0, -a + Math.PI + (rnd() - 0.5) * 0.7, -splay);
                var tall = (0.38 + rnd() * 0.5) * size * (1 - 0.45 * out);
                var width = 0.01 + 0.007 * rnd();
                dummy.scale.set(width, tall, width);
                dummy.updateMatrix();
                clump.setMatrixAt(k, dummy.matrix);
                colour.setRGB(1, 1, 1);
                colour.offsetHSL((rnd() - 0.5) * 0.04, (rnd() - 0.5) * 0.25, (rnd() - 0.5) * 0.18);
                if (rnd() < 0.2) { colour.offsetHSL(0.02, -0.2, 0.08); }
                clump.setColorAt(k, colour);
            }
            clump.position.set(cx, groundHeight(cx, cz), cz);
            clump.userData.phase = i * 1.7;
            clump.castShadow = true;
            clump.receiveShadow = true;
            clump.computeBoundingBox();
            clump.computeBoundingSphere();
            clumps.push(clump);
        });
        return clumps;
    }
    var grassClumps = buildGrass();
    grassClumps.forEach(function (g) { scene.add(g); });

    var MARKS = { x0: -30, x1: 6, z0: -8, z1: 10, px: 112 };
    function marksCanvas(shades) {
        var w = Math.round((MARKS.x1 - MARKS.x0) * MARKS.px / 2);
        var h = Math.round((MARKS.z1 - MARKS.z0) * MARKS.px / 2);
        var s = w / (MARKS.x1 - MARKS.x0);
        function toPx(x, z) {
            return { x: (x - MARKS.x0) * s, y: (z - MARKS.z0) * s };
        }
        return paintCanvas(w, h, function (g, cw, ch) {
            g.clearRect(0, 0, cw, ch);
            var bend = 60;
            var start = VAN.axleRear;
            [-1, 1].forEach(function (side) {
                for (var x = start - 0.1; x > -27; x -= 0.12) {
                    var back = start - x;
                    var root = Math.sqrt(bend * bend - back * back);
                    var z = side * VAN.track - (bend - root);
                    var heading = Math.atan2(-back / root, 1);
                    var strength = ease(-27, -21, x) * (1 - ease(start - 0.4, start, x));
                    var p = toPx(x, z);
                    g.save();
                    g.translate(p.x, p.y);
                    g.rotate(-heading);
                    g.strokeStyle = 'rgba(58, 42, 28, ' + (0.08 * strength) + ')';
                    g.lineWidth = 0.03 * s;
                    g.beginPath();
                    g.moveTo(0.03 * s, -0.09 * s);
                    g.lineTo(-0.02 * s, 0);
                    g.lineTo(0.03 * s, 0.09 * s);
                    g.stroke();
                    g.fillStyle = 'rgba(58, 42, 28, ' + (0.035 * strength) + ')';
                    g.fillRect(-0.06 * s, -0.1 * s, 0.12 * s, 0.2 * s);
                    g.restore();
                }
            });
            var rnd = seededRandom(404);
            for (var n = 0; n < 90; n++) {
                var fx = -4.6 + rnd() * 7.2;
                var fz = 0.3 + rnd() * 5.2;
                if (Math.hypot(fx + 0.3, fz - 2.3) > 3.6) { continue; }
                var fp = toPx(fx, fz);
                g.save();
                g.translate(fp.x, fp.y);
                g.rotate(rnd() * 2 * Math.PI);
                g.fillStyle = 'rgba(70, 52, 34, 0.13)';
                g.beginPath();
                g.ellipse(0, 0, 0.05 * s, 0.12 * s, 0, 0, 2 * Math.PI);
                g.fill();
                g.restore();
            }
            for (var i = 0; i < shades.length; i++) {
                var sh = shades[i];
                var sp = toPx(sh[0], sh[1]);
                g.save();
                g.translate(sp.x, sp.y);
                g.scale(sh[2] * s, sh[3] * s);
                var grad = g.createRadialGradient(0, 0, 0, 0, 0, 1);
                grad.addColorStop(0, 'rgba(30, 20, 12, ' + sh[4] + ')');
                grad.addColorStop(0.55, 'rgba(30, 20, 12, ' + (sh[4] * 0.45) + ')');
                grad.addColorStop(1, 'rgba(30, 20, 12, 0)');
                g.fillStyle = grad;
                g.fillRect(-1, -1, 2, 2);
                g.restore();
            }
        });
    }

    function buildMarks(shades) {
        var geo = new THREE.PlaneGeometry(36, 18, 72, 36);
        geo.rotateX(-Math.PI / 2);
        var pos = geo.attributes.position;
        for (var i = 0; i < pos.count; i++) {
            var x = pos.getX(i) - 12;
            var z = pos.getZ(i) + 1;
            pos.setXYZ(i, x, groundHeight(x, z) + 0.004, z);
        }
        geo.computeVertexNormals();
        var tex = canvasTexture(marksCanvas(shades));
        tex.flipY = false;
        var mat = new THREE.MeshStandardMaterial({ map: tex, transparent: true, depthWrite: false, roughness: 1, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
        var marks = new THREE.Mesh(geo, mat);
        marks.name = 'sandMarks';
        marks.receiveShadow = true;
        marks.renderOrder = 1;
        return marks;
    }
    function footprintShade(object, depth, reach) {
        if (reach === undefined) { reach = 1.25; }
        var box = new THREE.Box3().setFromObject(object);
        var size = box.getSize(new THREE.Vector3());
        var centre = box.getCenter(new THREE.Vector3());
        return [centre.x, centre.z, Math.max(size.x / 2 * reach, 0.06), Math.max(size.z / 2 * reach, 0.06), depth];
    }

    // contact shade under everything that touches the sand; MARKS is declared above, so this runs after it
    var contactShade = [];
    wheels.forEach(function (w) { contactShade.push(footprintShade(w, 0.5, 1.4)); });
    contactShade.push(footprintShade(vanBody, 0.3, 0.75));
    contactShade.push(footprintShade(campParts.table, 0.22, 1.3));
    contactShade.push(footprintShade(campParts.bucket, 0.42, 1.4));
    contactShade.push(footprintShade(campParts.log, 0.26, 1.1));
    contactShade.push(footprintShade(campParts.pole, 0.45, 2.5));
    scene.add(buildMarks(contactShade));

    var EYE_CLEARANCE = 0.35;
    var EYE_SOFTNESS = 0.22;
    var freeEye = new THREE.Vector3();
    function softFloor(value, floor, soft) {
        var x = (value - floor) / soft;
        if (x > 30) { return value; }
        return floor + soft * Math.log1p(Math.exp(x));
    }

    function hullAround(objects, kind) {
        var box = new THREE.Box3();
        objects.forEach(function (o) { o.updateMatrixWorld(true); box.expandByObject(o); });
        var centre = box.getCenter(new THREE.Vector3());
        var half = box.getSize(new THREE.Vector3()).multiplyScalar(0.5);
        return { kind: kind, centre: centre, half: half, top: box.max.y };
    }

    // one shell round the whole van (every part but the swinging door and the cabin inside it)
    var SOLIDS = [hullAround(van.children.filter(function (child) { return child !== door.pivot && child !== interior; }), 'shell')];
    SOLIDS.push(hullAround([door.leaf], 'shell'));
    SOLIDS.push(hullAround([campParts.pole], 'bump'));
    SOLIDS.push(hullAround([campParts.table, campParts.lantern], 'bump'));
    SOLIDS.push(hullAround([campParts.log], 'bump'));
    SOLIDS.push(hullAround([campParts.bucket], 'bump'));
    CAMP.rockPiles.forEach(function (pile, index) {
        var rocks = campParts.camp.getObjectByName('rocks');
        var children = [];
        rocks.children.forEach(function (child) {
            if (child.name.indexOf('rock' + index + '_') === 0) { children.push(child); }
        });
        SOLIDS.push(hullAround(children, 'bump'));
    });

    var BUMP_RAMP = 0.8;
    var fromCentre = new THREE.Vector3();
    function hullNorm(h, dx, dy, dz) {
        var v = Math.pow(dx / h.half.x, 4) + Math.pow(dy / h.half.y, 4) + Math.pow(dz / h.half.z, 4);
        return Math.pow(v, 0.25);
    }

    function easeOff(eye, h) {
        fromCentre.copy(eye).sub(h.centre);
        if (h.kind === 'bump') {
            var reach = Math.min(h.half.x, h.half.z) + EYE_CLEARANCE;
            var nx = fromCentre.x / (h.half.x + EYE_CLEARANCE);
            var nz = fromCentre.z / (h.half.z + EYE_CLEARANCE);
            var n = Math.pow(Math.pow(nx, 4) + Math.pow(nz, 4), 0.25);
            var cover = 1 - ease(0, Math.max(BUMP_RAMP, (h.top + EYE_CLEARANCE) * 0.9), (n - 1) * reach);
            if (cover <= 0) { return; }
            var ground = groundHeight(eye.x, eye.z);
            eye.y = softFloor(eye.y, ground + (h.top + EYE_CLEARANCE - ground) * cover, EYE_SOFTNESS);
            return;
        }
        var r = fromCentre.length();
        if (r < 1e-6) { return; }
        var eased = softFloor(r, r / hullNorm(h, fromCentre.x, fromCentre.y, fromCentre.z) + EYE_CLEARANCE, EYE_SOFTNESS);
        if (eased !== r) {
            eye.copy(h.centre).addScaledVector(fromCentre, eased / r);
        }
    }

    function clearEye(free, out) {
        if (out === undefined) { out = new THREE.Vector3(); }
        out.copy(free);
        for (var pass = 0; pass < 2; pass++) {
            SOLIDS.forEach(function (h) { easeOff(out, h); });
            out.y = softFloor(out.y, Math.max(groundHeight(out.x, out.z), SEA_LEVEL) + EYE_CLEARANCE, EYE_SOFTNESS);
        }
        return out;
    }

    var eyeOffset = new THREE.Vector3();
    var wantedOffset = new THREE.Vector3();
    function showEye(dt) {
        wantedOffset.copy(clearEye(freeEye)).sub(freeEye);
        var k = dt === 0 ? 1 : 1 - Math.exp(-dt / 0.12);
        eyeOffset.lerp(wantedOffset, k);
        camera.position.copy(freeEye).add(eyeOffset);
        SOLIDS.forEach(function (h) {
            if (h.kind !== 'shell') { return; }
            var fc = new THREE.Vector3().subVectors(camera.position, h.centre);
            var n = hullNorm(h, fc.x, fc.y, fc.z);
            if (n < 1.05 && n > 1e-6) {
                camera.position.copy(h.centre).addScaledVector(fc, 1.05 / n);
            }
        });
        var floorY = Math.max(groundHeight(camera.position.x, camera.position.z), SEA_LEVEL) + 0.15;
        if (camera.position.y < floorY) { camera.position.y = floorY; }
        camera.lookAt(controls.target);
    }
    function setEye(position, target) {
        controls.target.copy(target);
        freeEye.copy(position);
        eyeOffset.copy(clearEye(freeEye)).sub(freeEye);
        camera.position.copy(freeEye);
        camera.lookAt(target);
    }

    var homeDirection = new THREE.Vector3().subVectors(HOME_VIEW.position, HOME_VIEW.target).normalize();
    var homeDistance = HOME_VIEW.position.distanceTo(HOME_VIEW.target);
    var subjectPoints = [];
    [van, campParts.table, campParts.lantern].forEach(function (root) {
        root.updateMatrixWorld(true);
        root.traverse(function (obj) {
            if (obj.isMesh) {
                var box = new THREE.Box3().setFromObject(obj);
                for (var i = 0; i < 8; i++) {
                    subjectPoints.push(new THREE.Vector3(
                        i & 1 ? box.max.x : box.min.x,
                        i & 2 ? box.max.y : box.min.y,
                        i & 4 ? box.max.z : box.min.z
                    ));
                }
            }
        });
    });

    function chromeRects() {
        var rects = [];
        document.querySelectorAll('.panel').forEach(function (el) {
            var r = el.getBoundingClientRect();
            if (r.width > 0 && r.height > 0) { rects.push(r); }
        });
        return rects;
    }
    function subjectClear(distance, rects) {
        camera.position.copy(HOME_VIEW.target).addScaledVector(homeDirection, distance);
        camera.lookAt(HOME_VIEW.target);
        camera.updateMatrixWorld();
        var v = new THREE.Vector3();
        for (var i = 0; i < subjectPoints.length; i++) {
            v.copy(subjectPoints[i]).project(camera);
            var sx = (v.x * 0.5 + 0.5) * window.innerWidth;
            var sy = (-v.y * 0.5 + 0.5) * window.innerHeight;
            if (sx < 8 || sx > window.innerWidth - 8 || sy < 8 || sy > window.innerHeight - 8) { return false; }
            for (var r = 0; r < rects.length; r++) {
                if (sx > rects[r].left - 8 && sx < rects[r].right + 8 && sy > rects[r].top - 8 && sy < rects[r].bottom + 8) { return false; }
            }
        }
        return true;
    }

    function homeFit() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.fov = HOME_VIEW.fov;
        camera.updateProjectionMatrix();
        var rects = chromeRects();
        var distance = homeDistance;
        if (!subjectClear(distance, rects)) {
            var lo = homeDistance, hi = 40;
            for (var i = 0; i < 24; i++) {
                var mid = (lo + hi) / 2;
                if (subjectClear(mid, rects)) { hi = mid; } else { lo = mid; }
            }
            distance = hi;
        }
        controls.maxDistance = 2 * distance;
        return distance;
    }

    var campViewBtn = document.getElementById('campViewBtn');
    var orbitBtn = document.getElementById('orbitBtn');
    var lanternBtn = document.getElementById('lanternBtn');
    var lanternOn = true;
    function setOrbit(on) {
        controls.autoRotate = on;
        orbitBtn.setAttribute('aria-pressed', String(on));
        if (on) { campViewBtn.setAttribute('aria-pressed', 'false'); }
    }
    function goHome() {
        var distance = homeFit();
        setEye(HOME_VIEW.target.clone().addScaledVector(homeDirection, distance), HOME_VIEW.target);
        return distance;
    }
    var homeDistanceNow = goHome();
    campViewBtn.addEventListener('click', function () {
        setOrbit(false);
        homeDistanceNow = goHome();
        campViewBtn.setAttribute('aria-pressed', 'true');
    });
    orbitBtn.addEventListener('click', function () {
        setOrbit(!controls.autoRotate);
    });
    lanternBtn.addEventListener('click', function () {
        lanternOn = !lanternOn;
        lanternBtn.setAttribute('aria-pressed', String(lanternOn));
    });
    controls.addEventListener('start', function () {
        campViewBtn.setAttribute('aria-pressed', 'false');
    });

    // ---------- Animation ----------
    var clock = new THREE.Clock();
    var t = 0;
    var flameColour = campParts.flame.material.color.clone();
    var globeGlow = campParts.globe.material.emissiveIntensity;
    var flicker = 1;
    function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.1);
        // animation runs on real elapsed time, so the water, sky and grain keep their pace at any frame rate
        t = clock.elapsedTime;
        sky.material.uniforms.uTime.value = t;
        filmGrade.uniforms.uClock.value = t;
        tideClock.value = t;

        var goal = 0.9 + Math.random() * 0.2;
        flicker += (goal - flicker) * Math.min(1, dt * 9);
        var glow = lanternOn ? flicker : 0;
        lanternLight.intensity = 2.6 * glow;
        campParts.flame.visible = lanternOn;
        campParts.flame.material.color.copy(flameColour).multiplyScalar(glow);
        campParts.globe.material.emissiveIntensity = lanternOn ? globeGlow * flicker : 0.05;
        for (var b = 0; b < campParts.bulbs.length; b++) {
            var bk = 5.2 + 0.8 * Math.sin(1.3 * t + 2.1 * b);
            var bulbCol = campParts.bulbs[b].material.color;
            bulbCol.r = 1 * bk;
            bulbCol.g = 0.7 * bk;
            bulbCol.b = 0.38 * bk;
        }

        // grass sway in the evening breeze
        for (var i = 0; i < grassClumps.length; i++) {
            var phase = grassClumps[i].userData.phase;
            grassClumps[i].rotation.z = 0.045 * Math.sin(1.4 * t + phase) + 0.02 * Math.sin(2.7 * t + 1.3 * phase);
            grassClumps[i].rotation.x = 0.025 * Math.sin(1.1 * t + 0.7 * phase);
        }

        controls.update(dt);
        var targetFloor = Math.max(groundHeight(controls.target.x, controls.target.z), SEA_LEVEL) + 0.2;
        if (controls.target.y < targetFloor) { controls.target.y = targetFloor; }
        freeEye.copy(camera.position);
        showEye(dt);
        composer.render(dt);
        camera.position.copy(freeEye);
        frames += 1;
        if (frames === 2) { window.__campReady = true; }
    }
    var frames = 0;
    window.__camp = { THREE: THREE, scene: scene, camera: camera, controls: controls, renderer: renderer, composer: composer, homeView: HOME_VIEW, homeDistance: function () { return homeDistanceNow; }, clearEye: clearEye, solids: SOLIDS, eyeClearance: EYE_CLEARANCE, setView: function (v) { controls.minDistance = 0; controls.maxDistance = 1e4; controls.maxTargetRadius = Infinity; setEye(new THREE.Vector3(v[0], v[1], v[2]), new THREE.Vector3(v[3], v[4], v[5])); }, van: van, body: vanBody, wheels: wheels, glass: glass, door: door.pivot, doorLeaf: door.leaf, doorway: { rear: VAN.door.rear, front: VAN.door.front, low: VAN.door.low, high: VAN.door.high, sideZ: VAN.width / 2 }, interior: interior, headlights: headlights, vanSpec: VAN, paint: MAT.paint, table: campParts.table, tableSlats: campParts.slats, tableLegs: campParts.legs, tableTopY: campParts.topY, lantern: campParts.lantern, lanternGlobe: campParts.globe, lanternLight: lanternLight, grassClumps: grassClumps, sun: sun, sky: sky, skyFill: skyFill, ground: ground, groundHeight: groundHeight };
    animate();

    // ---------- Resize ----------
    window.addEventListener('resize', function () {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h);
        composer.setSize(w, h);
        filmGrade.uniforms.uViewport.value.set(w, h);
        var wasHome = campViewBtn.getAttribute('aria-pressed') === 'true';
        var keptEye = freeEye.clone();
        var keptTarget = controls.target.clone();
        homeDistanceNow = homeFit();
        if (wasHome) {
            goHome();
        } else {
            var reach = Math.min(keptEye.distanceTo(keptTarget), controls.maxDistance);
            var dir = new THREE.Vector3().subVectors(keptEye, keptTarget).setLength(reach);
            setEye(keptTarget.clone().add(dir), keptTarget);
        }
    });
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
            if (campViewBtn.getAttribute('aria-pressed') === 'true') {
                homeDistanceNow = goHome();
            }
        });
    }
})();
</script>
</body>
</html>
