<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evening at the Beach — Camper Van</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
        position: absolute; top: 16px; right: 16px; z-index: 10;
        background: rgba(20, 18, 34, 0.72); color: #ffe9d0;
        padding: 14px 18px; border-radius: 14px;
        backdrop-filter: blur(6px); border: 1px solid rgba(255, 180, 120, 0.25);
        max-width: 250px; box-shadow: 0 6px 24px rgba(0,0,0,0.45);
    }
    #hud h1 { font-size: 15px; letter-spacing: 0.5px; margin-bottom: 4px; color: #ffb37a; }
    #hud p { font-size: 11px; opacity: 0.88; line-height: 1.55; }
    #hint {
        position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
        color: rgba(255, 230, 200, 0.85); font-size: 11px; letter-spacing: 0.6px;
        background: rgba(20,18,34,0.55); padding: 6px 14px; border-radius: 20px; z-index: 10;
        white-space: nowrap; border: 1px solid rgba(255,180,120,0.18);
    }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
    <h1>🌅 Beach Evening</h1>
    <p>The van is settled in for the night — door open, lamp lit outside. Drag to wander around the camp.</p>
</div>
<div id="hint">Drag to orbit &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Right-drag to pan</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
    var container = document.getElementById('app');
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x2a2438, 70, 260);

    var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 600);
    camera.position.set(6.4, 2.6, 7.6); // opening: door side faces us
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0.6);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.5;
    controls.maxDistance = 50;
    controls.maxPolarAngle = Math.PI * 0.52;

    // ---------- Evening sky dome (dark zenith, warm horizon) ----------
    function makeSkyTexture() {
        var c = document.createElement('canvas'); c.width = 16; c.height = 512;
        var g = c.getContext('2d');
        var grad = g.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0.0, '#0c1026');
        grad.addColorStop(0.42, '#232046');
        grad.addColorStop(0.62, '#5a3a55');
        grad.addColorStop(0.78, '#b35f43');
        grad.addColorStop(0.90, '#e88b4d');
        grad.addColorStop(1.0, '#f7b96a');
        g.fillStyle = grad; g.fillRect(0, 0, 16, 512);
        return new THREE.CanvasTexture(c);
    }
    var sky = new THREE.Mesh(
        new THREE.SphereGeometry(280, 32, 20),
        new THREE.MeshBasicMaterial({ map: makeSkyTexture(), side: THREE.BackSide, fog: false })
    );
    scene.add(sky);
    // low evening sun near the horizon
    var sunDisc = new THREE.Mesh(new THREE.CircleGeometry(9, 32), new THREE.MeshBasicMaterial({ color: 0xffd9a0, fog: false }));
    sunDisc.position.set(-190, 10, -120);
    sunDisc.lookAt(0, 5, 0);
    scene.add(sunDisc);
    var sunGlow = new THREE.Mesh(new THREE.CircleGeometry(22, 32), new THREE.MeshBasicMaterial({ color: 0xff9a50, transparent: true, opacity: 0.35, fog: false, depthWrite: false }));
    sunGlow.position.set(-189, 10, -119);
    sunGlow.lookAt(0, 5, 0);
    scene.add(sunGlow);
    // first stars up high
    (function () {
        var n = 260, pos = new Float32Array(n * 3);
        for (var i = 0; i < n; i++) {
            var th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI * 0.32;
            pos[i * 3] = 260 * Math.sin(ph) * Math.cos(th);
            pos[i * 3 + 1] = 260 * Math.cos(ph);
            pos[i * 3 + 2] = 260 * Math.sin(ph) * Math.sin(th);
        }
        var g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff4e0, size: 1.4, sizeAttenuation: false, fog: false })));
    })();
    // ---------- Low warm evening light, dim cool fill ----------
    var sun = new THREE.DirectionalLight(0xff9a55, 1.05);
    sun.position.set(-16, 4.5, -10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
    sun.shadow.camera.far = 80;
    sun.shadow.bias = -0.0006;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x3a4668, 0x8a7350, 0.5));
    var warmFill = new THREE.DirectionalLight(0xffc890, 0.18);
    warmFill.position.set(8, 3, 8);
    scene.add(warmFill);

    // ---------- Pale sand ground ----------
    function makeSandTexture() {
        var c = document.createElement('canvas'); c.width = c.height = 512;
        var g = c.getContext('2d');
        g.fillStyle = '#e3cfa2'; g.fillRect(0, 0, 512, 512);
        for (var i = 0; i < 9000; i++) {
            g.fillStyle = Math.random() > 0.5 ? 'rgba(190,165,120,0.25)' : 'rgba(245,230,195,0.25)';
            g.fillRect(Math.random() * 512, Math.random() * 512, 1.6, 1.6);
        }
        g.strokeStyle = 'rgba(170,145,100,0.16)';
        for (var r = 0; r < 26; r++) {
            g.beginPath();
            g.arc(Math.random() * 512, Math.random() * 512, 20 + Math.random() * 60, 0, Math.PI * 2);
            g.stroke();
        }
        var t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(24, 24);
        return t;
    }
    var sand = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 500),
        new THREE.MeshStandardMaterial({ map: makeSandTexture(), roughness: 1, metalness: 0 })
    );
    sand.rotation.x = -Math.PI / 2;
    sand.receiveShadow = true;
    scene.add(sand);

    // low dunes in the distance (behind the van, grass side)
    var duneMat = new THREE.MeshStandardMaterial({ color: 0xd8c28e, roughness: 1 });
    for (var d = 0; d < 6; d++) {
        var dune = new THREE.Mesh(new THREE.SphereGeometry(6 + Math.random() * 7, 16, 10), duneMat);
        dune.scale.set(1.6, 0.22, 1);
        dune.position.set(-30 + d * 14 + Math.random() * 4, 0.1, 22 + Math.random() * 14);
        dune.receiveShadow = true;
        scene.add(dune);
    }
    // dark evening sea with a warm light path
    var sea = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 160),
        new THREE.MeshStandardMaterial({ color: 0x27354e, roughness: 0.35, metalness: 0.4 })
    );
    sea.rotation.x = -Math.PI / 2;
    sea.position.set(0, 0.02, -120);
    scene.add(sea);
    var glint = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 120),
        new THREE.MeshBasicMaterial({ color: 0xffb37a, transparent: true, opacity: 0.22, depthWrite: false })
    );
    glint.rotation.x = -Math.PI / 2;
    glint.rotation.z = 0.35;
    glint.position.set(-70, 0.06, -95);
    scene.add(glint);
    // gentle foam line where the sea meets the sand
    var foam = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 3),
        new THREE.MeshBasicMaterial({ color: 0xf3ead2, transparent: true, opacity: 0.35 })
    );
    foam.rotation.x = -Math.PI / 2;
    foam.position.set(0, 0.05, -42);
    scene.add(foam);
    // ---------- Camper van ----------
    var van = new THREE.Group();
    scene.add(van);
    function shadowify(m) { m.castShadow = true; m.receiveShadow = true; return m; }
    var paintTop = new THREE.MeshStandardMaterial({ color: 0xf2e8d5, roughness: 0.28, metalness: 0.35 }); // glossy cream
    var paintLow = new THREE.MeshStandardMaterial({ color: 0x4f8a8b, roughness: 0.25, metalness: 0.4 });  // glossy teal
    var chrome = new THREE.MeshStandardMaterial({ color: 0xd8dce2, roughness: 0.15, metalness: 0.9 });
    var tyreMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.95 });
    var glassMat = new THREE.MeshStandardMaterial({ color: 0x1e2c38, roughness: 0.05, metalness: 0.85 }); // dark reflective
    var darkIn = new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 1 });

    var VAN_L = 4.3, VAN_W = 1.9, BODY_H = 1.95, FLOOR_Y = 0.62;
    // tall boxy living body
    var bodyLow = shadowify(new THREE.Mesh(new THREE.BoxGeometry(VAN_L, BODY_H * 0.55, VAN_W), paintLow));
    bodyLow.position.set(0, FLOOR_Y + BODY_H * 0.275, 0);
    van.add(bodyLow);
    var bodyTop = shadowify(new THREE.Mesh(new THREE.BoxGeometry(VAN_L, BODY_H * 0.45, VAN_W), paintTop));
    bodyTop.position.set(0, FLOOR_Y + BODY_H * 0.55 + BODY_H * 0.225, 0);
    van.add(bodyTop);
    // rounded roof
    var roof = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(VAN_W / 2, VAN_W / 2, VAN_L, 20, 1, false, 0, Math.PI), paintTop));
    roof.rotation.z = Math.PI / 2;
    roof.rotation.y = Math.PI / 2;
    roof.scale.set(1, 1, 0.35);
    roof.position.set(0, FLOOR_Y + BODY_H, 0);
    van.add(roof);
    // pop-top camper roof
    var popTop = shadowify(new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.30, VAN_W * 0.7), paintTop));
    popTop.position.set(-0.5, FLOOR_Y + BODY_H + 0.42, 0);
    van.add(popTop);
    // chrome bumpers
    [-1, 1].forEach(function (s) {
        var bump = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.18, VAN_W + 0.1), chrome));
        bump.position.set(s * (VAN_L / 2 + 0.08), FLOOR_Y - 0.05, 0);
        van.add(bump);
    });
    // windshield (front +X) — dark, reflective
    var shield = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.75, VAN_W * 0.82), glassMat);
    shield.position.set(VAN_L / 2 + 0.005, FLOOR_Y + BODY_H * 0.72, 0);
    shield.rotation.z = -0.12;
    van.add(shield);
    // headlights
    [-1, 1].forEach(function (s) {
        var hl = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.06, 16), new THREE.MeshStandardMaterial({ color: 0xfff2c8, roughness: 0.2, emissive: 0x554422, emissiveIntensity: 0.5 }));
        hl.rotation.z = Math.PI / 2;
        hl.position.set(VAN_L / 2 + 0.02, FLOOR_Y + 0.25, s * 0.62);
        van.add(hl);
    });
    // side windows — darker than the body panels (both sides)
    var winZ = VAN_W / 2 + 0.005;
    [[-1.4, 0.62], [-0.35, 0.62], [0.75, 0.62], [-1.4, -0.62], [-0.35, -0.62], [0.75, -0.62]].forEach(function (p, i) {
        var w = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.55, 0.05), glassMat);
        var side = i < 3 ? 1 : -1;
        w.position.set(p[0], FLOOR_Y + BODY_H * 0.72, side * winZ);
        van.add(w);
        var frame = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.62, 0.03), chrome);
        frame.position.set(p[0], FLOOR_Y + BODY_H * 0.72, side * (winZ - 0.01));
        van.add(frame);
    });
    // four wheels
    function wheel(x, z) {
        var g = new THREE.Group();
        var tyre = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.40, 0.26, 20), tyreMat));
        tyre.rotation.x = Math.PI / 2;
        g.add(tyre);
        var hub = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.28, 16), chrome);
        hub.rotation.x = Math.PI / 2;
        g.add(hub);
        g.position.set(x, 0.40, z);
        van.add(g);
    }
    wheel(1.35, VAN_W / 2 - 0.02); wheel(-1.35, VAN_W / 2 - 0.02);
    wheel(1.35, -VAN_W / 2 + 0.02); wheel(-1.35, -VAN_W / 2 + 0.02);
    // ---------- Open side door (hinged leaf, angled away, clear gap) ----------
    var DOOR_X = 1.05, DOOR_W = 0.78, DOOR_H = 1.30, DOOR_Y = FLOOR_Y + 0.15;
    // dark doorway opening visible in the van side
    var doorway = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W + 0.06, DOOR_H + 0.06, 0.10), darkIn);
    doorway.position.set(DOOR_X, DOOR_Y + DOOR_H / 2, VAN_W / 2 - 0.02);
    van.add(doorway);
    // glimpse of the cozy interior inside the doorway
    var bunk = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.28, 0.7), new THREE.MeshStandardMaterial({ color: 0x8a5f43, roughness: 0.9 }));
    bunk.position.set(-0.2, FLOOR_Y + 0.45, 0);
    van.add(bunk);
    var cushion = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 0.6), new THREE.MeshStandardMaterial({ color: 0xc96f5a, roughness: 1 }));
    cushion.position.set(-0.2, FLOOR_Y + 0.62, 0);
    van.add(cushion);
    // the open door leaf: hinged along its forward vertical edge, swung outward
    var hinge = new THREE.Group();
    hinge.position.set(DOOR_X + DOOR_W / 2, DOOR_Y, VAN_W / 2 + 0.02); // hinge at forward edge
    van.add(hinge);
    var doorLeaf = shadowify(new THREE.Mesh(new THREE.BoxGeometry(DOOR_W, DOOR_H, 0.055), paintLow));
    doorLeaf.position.set(-DOOR_W / 2, DOOR_H / 2, 0);
    hinge.add(doorLeaf);
    var doorPanelTop = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W - 0.08, DOOR_H * 0.4, 0.06), paintTop);
    doorPanelTop.position.set(-DOOR_W / 2, DOOR_H * 0.72, 0);
    hinge.add(doorPanelTop);
    var doorWindow = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W - 0.18, 0.42, 0.065), glassMat);
    doorWindow.position.set(-DOOR_W / 2, DOOR_H * 0.74, 0);
    hinge.add(doorWindow);
    var handle = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.04, 0.05), chrome);
    handle.position.set(-DOOR_W + 0.12, DOOR_H * 0.5, 0.05);
    hinge.add(handle);
    hinge.rotation.y = -1.25; // door stands open, free edge well clear of the doorway
    // warm interior light spilling out of the doorway
    var innerLight = new THREE.PointLight(0xffc27a, 1.1, 5.5);
    innerLight.position.set(DOOR_X, FLOOR_Y + 1.2, 0.4);
    van.add(innerLight);
    // doorway glow spill on the sand
    var spill = new THREE.PointLight(0xffb37a, 0.5, 6);
    spill.position.set(DOOR_X + 0.3, 0.6, VAN_W / 2 + 1.2);
    scene.add(spill);

    // ---------- Roof rack + string lights ----------
    var rack = shadowify(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, VAN_W * 0.6), chrome));
    rack.position.set(1.2, FLOOR_Y + BODY_H + 0.35, 0);
    van.add(rack);
    // string of warm bulbs along the door-side roof edge
    var bulbMat = new THREE.MeshBasicMaterial({ color: 0xffd27a });
    var bulbs = [];
    for (var b = 0; b < 9; b++) {
        var bx = -1.8 + b * 0.45;
        var by = FLOOR_Y + BODY_H + 0.18 - Math.sin((b / 8) * Math.PI) * 0.16;
        var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), bulbMat);
        bulb.position.set(bx, by, VAN_W / 2 + 0.10);
        van.add(bulb);
        bulbs.push(bulb);
        if (b > 0) {
            var wireGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-1.8 + (b - 1) * 0.45, FLOOR_Y + BODY_H + 0.18 - Math.sin(((b - 1) / 8) * Math.PI) * 0.16, VAN_W / 2 + 0.10),
                new THREE.Vector3(bx, by, VAN_W / 2 + 0.10)
            ]);
            van.add(new THREE.Line(wireGeo, new THREE.LineBasicMaterial({ color: 0x2a2a2a })));
        }
    }
    var stringGlow = new THREE.PointLight(0xffc27a, 0.4, 4);
    stringGlow.position.set(0, FLOOR_Y + BODY_H, VAN_W / 2 + 0.4);
    van.add(stringGlow);
    // ---------- Small camping table outside, all legs on the sand ----------
    var tableG = new THREE.Group();
    var tableMat = new THREE.MeshStandardMaterial({ color: 0x9a6b40, roughness: 0.7 });
    var tTop = shadowify(new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.04, 0.42), tableMat));
    tTop.position.y = 0.46;
    tableG.add(tTop);
    [[-0.26, -0.16], [0.26, -0.16], [-0.26, 0.16], [0.26, 0.16]].forEach(function (p) {
        var leg = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.46, 8), chrome));
        leg.position.set(p[0], 0.23, p[1]); // feet meet the sand at y = 0
        tableG.add(leg);
    });
    tableG.position.set(1.15, 0, 2.35);
    tableG.rotation.y = 0.25;
    scene.add(tableG);

    // ---------- Lamp on the tabletop (base, stem, glowing shade) ----------
    var lamp = new THREE.Group();
    var lampBase = shadowify(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.05, 12), new THREE.MeshStandardMaterial({ color: 0x3a3f4a, roughness: 0.4, metalness: 0.6 })));
    lampBase.position.y = 0.025;
    lamp.add(lampBase);
    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.16, 8), new THREE.MeshStandardMaterial({ color: 0x3a3f4a, roughness: 0.4, metalness: 0.6 }));
    stem.position.y = 0.12;
    lamp.add(stem);
    var shade = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.11, 14, 1, true), new THREE.MeshStandardMaterial({ color: 0xf7e3b0, roughness: 0.6, side: THREE.DoubleSide, emissive: 0xffc27a, emissiveIntensity: 0.35 }));
    shade.position.y = 0.24;
    lamp.add(shade);
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffe6b0 }));
    bulb.position.y = 0.20;
    lamp.add(bulb);
    var lampLight = new THREE.PointLight(0xffc27a, 1.5, 7);
    lampLight.position.y = 0.22;
    lampLight.castShadow = true;
    lampLight.shadow.mapSize.set(512, 512);
    lamp.add(lampLight);
    lamp.position.set(1.02, 0.48, 2.28); // standing on the tabletop
    scene.add(lamp);
    // warm pool of light on the tabletop around the lamp
    var tableGlow = new THREE.Mesh(new THREE.CircleGeometry(0.3, 20), new THREE.MeshBasicMaterial({ color: 0xffc27a, transparent: true, opacity: 0.18, depthWrite: false }));
    tableGlow.rotation.x = -Math.PI / 2;
    tableGlow.position.set(1.02, 0.485, 2.28);
    scene.add(tableGlow);

    // ---------- Grass tufts (green, distinct from the sand) ----------
    var grassMats = [
        new THREE.MeshStandardMaterial({ color: 0x5d7a3a, roughness: 1, side: THREE.DoubleSide }),
        new THREE.MeshStandardMaterial({ color: 0x6d8a42, roughness: 1, side: THREE.DoubleSide }),
        new THREE.MeshStandardMaterial({ color: 0x4d6a30, roughness: 1, side: THREE.DoubleSide })
    ];
    var tufts = [];
    function grassTuft(x, z, scale) {
        var g = new THREE.Group();
        var blades = 7 + Math.floor(Math.random() * 4);
        for (var i = 0; i < blades; i++) {
            var h = (0.28 + Math.random() * 0.22) * scale;
            var blade = new THREE.Mesh(new THREE.ConeGeometry(0.02 * scale, h, 4), grassMats[i % 3]);
            var a = Math.random() * Math.PI * 2, r = Math.random() * 0.09 * scale;
            blade.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
            blade.rotation.set((Math.random() - 0.5) * 0.55, 0, (Math.random() - 0.5) * 0.55);
            blade.castShadow = true;
            g.add(blade);
        }
        g.position.set(x, 0, z);
        scene.add(g);
        tufts.push(g);
        return g;
    }
    grassTuft(-2.6, 3.1, 1.2);
    grassTuft(2.9, 3.6, 1.4);
    grassTuft(3.6, 1.2, 1.0);
    grassTuft(-3.4, 1.6, 1.3);
    grassTuft(-1.2, 4.2, 1.1);
    grassTuft(0.4, 5.0, 1.5);
    grassTuft(-4.4, 3.8, 1.2);
    // ---------- Animation ----------
    var clock = new THREE.Clock();
    var t = 0;
    function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.05);
        t += dt;

        // lamp flame flicker
        lampLight.intensity = 1.5 + Math.sin(t * 11) * 0.12 + Math.sin(t * 23.7) * 0.08;
        bulb.scale.setScalar(1 + Math.sin(t * 13) * 0.06);
        tableGlow.material.opacity = 0.16 + Math.sin(t * 11) * 0.03;

        // grass sway in the evening breeze
        for (var i = 0; i < tufts.length; i++) {
            tufts[i].rotation.z = Math.sin(t * 1.4 + i * 1.3) * 0.05;
            tufts[i].rotation.x = Math.cos(t * 1.1 + i * 0.7) * 0.03;
        }

        // string lights gentle twinkle
        for (var b = 0; b < bulbs.length; b++) {
            bulbs[b].scale.setScalar(1 + Math.sin(t * 3 + b * 1.7) * 0.15);
        }

        // slow shimmering sea
        sea.position.y = 0.02 + Math.sin(t * 0.6) * 0.01;
        glint.material.opacity = 0.20 + Math.sin(t * 0.8) * 0.05;

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // ---------- Resize ----------
    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>
</body>
</html>
